<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lah We">
<meta name="theme-color" content="#f5f1ec">
<title>Lah We</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f1ec;--bg2:#eae5dd;--card:#fffefb;--border:#e8e3d9;--hair:#efeae1;
  --shadow:0 1px 2px rgba(28,24,16,.05);
  --shadow-md:0 10px 30px -8px rgba(28,24,16,.14),0 2px 6px rgba(28,24,16,.05);
  /* --navy / --ndim / --nbright injected by applyTheme() */
  --navy:#373f8f;--ndim:rgba(55,63,143,.07);--nbright:rgba(55,63,143,.16);
  --gold:#9b6f24;--gdim:rgba(155,111,36,.1);
  --green:#2f7350;--grdim:rgba(47,115,80,.08);--grbright:rgba(47,115,80,.16);
  --red:#bd4040;--rdim:rgba(189,64,64,.08);
  --blue:#2e6db2;--bdim:rgba(46,109,178,.08);
  --purple:#6a4eb2;--pdim:rgba(106,78,178,.08);
  --text:#1b1813;--muted:#7e7669;--muted2:#bcb5a9;
  --bm-body:#e4ded3;--bm-muscle:#cdc5b6;--bm-line:#c7c2b8;
  --nh:56px;--sb:env(safe-area-inset-bottom,0px);--r:16px;--rm:11px;
}
[data-dark="true"]{
  color-scheme:dark;
  --bg:#100f0d;--bg2:#1a1916;--card:#1b1a16;--border:#2d2a25;--hair:#242220;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 16px 36px -10px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.4);
  /* --navy / --ndim / --nbright injected by applyTheme() for dark */
  --navy:#4d56c4;--ndim:rgba(125,134,240,.15);--nbright:rgba(125,134,240,.32);
  --gold:#cf9844;--gdim:rgba(207,152,68,.16);
  --green:#4caf80;--grdim:rgba(76,175,128,.15);--grbright:rgba(76,175,128,.26);
  --red:#e06a6a;--rdim:rgba(224,106,106,.15);
  --blue:#5b9fe0;--bdim:rgba(91,159,224,.15);
  --purple:#9b80e0;--pdim:rgba(155,128,224,.15);
  --text:#efebe3;--muted:#968d80;--muted2:#615a50;
  --bm-body:#2b2823;--bm-muscle:#3a352d;--bm-line:#45413a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;overflow:hidden;transition:background .2s,color .2s;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.01em}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nh) + var(--sb) + 56px);scroll-behavior:smooth}

/* ── NAV ── */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--card);border-top:1px solid var(--border);display:flex;align-items:flex-start;
  padding-top:8px;padding-bottom:calc(var(--sb) + 12px);padding-left:12px;padding-right:12px;z-index:100;
  box-shadow:0 -0.5px 0 var(--border)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;
  color:var(--muted2);cursor:pointer;padding:2px 0;transition:color .15s;touch-action:manipulation}
.nb.on{color:var(--navy)}
.nb-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.nb.on .nb-icon{background:var(--ndim)}
.nb svg{width:18px;height:18px;transition:transform .15s}
.nb.on svg{transform:scale(1.05)}
.nb span{font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}

/* ── REST TIMER ── */
.bm-blob{position:absolute;width:16%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);filter:blur(8px);opacity:.5;mix-blend-mode:multiply;pointer-events:none}
#rest-pill{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:#fff;background:var(--red);padding:4px 9px;border-radius:6px;letter-spacing:.02em;cursor:pointer;touch-action:manipulation;white-space:nowrap;display:none;align-items:center;gap:5px;animation:popin .2s ease}
#rest-pill.on{display:inline-flex}
#rest-pill .rp-x{font-size:10px;opacity:.7;font-weight:700}
@keyframes popin{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
#rest-label-removed{display:none}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin:0 13px 10px;overflow:hidden;box-shadow:var(--shadow)}
.ch{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ct{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cb{padding:14px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 17px;
  border-radius:10px;border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;
  cursor:pointer;transition:transform .08s,opacity .08s,background .1s;user-select:none;
  letter-spacing:-.01em;touch-action:manipulation;-webkit-user-select:none}
.btn:active{opacity:.78;transform:scale(.96)}
.btp{background:var(--navy);color:#fff;box-shadow:0 1px 2px rgba(28,24,16,.16)}
.btp:active{filter:brightness(.92)}
.bts{background:var(--card);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow)}
.btg{background:transparent;color:var(--muted);border:none;box-shadow:none}
.btd{background:var(--red);color:#fff;box-shadow:0 1px 3px rgba(176,53,53,.25)}
.btok{background:var(--green);color:#fff;box-shadow:0 1px 3px rgba(39,114,74,.25)}
.btb{background:var(--bdim);color:var(--blue);border:1px solid rgba(36,104,184,.2)}
.bfw{width:100%}.bsm{padding:7px 13px;font-size:13px}.bxs{padding:4px 9px;font-size:11px}
.delbtn{background:transparent;border:1px solid var(--border);color:var(--red);box-shadow:none}
.delbtn:active{background:var(--rdim)}

/* ── INPUTS ── */
input,select,textarea{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;padding:10px 12px;
  width:100%;outline:none;transition:border-color .15s,box-shadow .15s;
  -webkit-appearance:none;-moz-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--navy);background:var(--card);
  box-shadow:0 0 0 3px var(--ndim)}
input[type=number]{font-family:'IBM Plex Mono',monospace;text-align:center;font-size:16px}
input[type=date]{font-family:'DM Sans',sans-serif;font-size:14px}
select option{background:var(--card)}
textarea{resize:none;line-height:1.6}

/* ── OVERLAYS & MODALS ── */
.ov{position:fixed;inset:0;background:rgba(8,6,4,.55);z-index:200;display:flex;align-items:flex-end;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{background:var(--card);border-top:1px solid var(--border);border-radius:22px 22px 0 0;
  width:100%;max-height:93vh;overflow-y:auto;padding:10px 16px calc(22px + var(--sb));
  animation:su .18s cubic-bezier(.22,.61,.36,1);-webkit-overflow-scrolling:touch;touch-action:pan-y;
  box-shadow:0 -4px 24px rgba(0,0,0,.12)}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mh{width:40px;height:4px;background:var(--muted2);border-radius:2px;margin:0 auto 16px;opacity:.5;cursor:grab;touch-action:none}
.mh:active{cursor:grabbing;opacity:.8}
.mt{font-size:19px;font-weight:700;margin-bottom:16px;letter-spacing:-.03em}
.page-title{font-size:25px;font-weight:700;letter-spacing:-.04em}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 13px 6px}
.mono{font-family:'IBM Plex Mono',monospace}

/* ── PAGE HEADER ── */
.ph{padding:16px 14px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}

/* ── WORKOUT SESSION BAR ── */
.fbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--border);
  padding:10px 14px;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow)}
.fbar-name{flex:1;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.wt{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy);background:var(--ndim);
  padding:4px 8px;border-radius:6px;letter-spacing:.02em;font-weight:500}

/* ── EXERCISE BLOCKS ── */
.exb{margin:0 13px 10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.exbh{padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--border)}
.exbn{font-size:14px;font-weight:700;letter-spacing:-.02em}
.exbc{font-size:11px;color:var(--muted);margin-top:2px}
.ex-last{font-size:11px;color:var(--green);font-weight:600;margin-top:2px}
.slbls{display:grid;grid-template-columns:22px 1fr 1fr 52px 30px 24px;gap:4px;padding:5px 10px;background:var(--bg)}
.sl{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);text-align:center}
.srow{display:grid;grid-template-columns:22px 1fr 1fr 52px 30px 24px;gap:4px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:none}.srow.done{background:rgba(39,114,74,.05)}
.srow.warm{background:rgba(176,120,40,.045)}
.srow.warm .sinp{opacity:.75}
.srow.warm .snum{color:var(--gold);font-weight:700}
.snum{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted2);text-align:center}
.sinp{padding:7px 3px;font-size:15px;border-radius:7px;touch-action:manipulation}
.sinp:disabled{background:transparent;border-color:transparent;color:var(--text)}
.e1rm-cell{display:flex;align-items:center;justify-content:center}
.e1rm-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;padding:2px 5px;border-radius:4px;
  background:var(--bg2);color:var(--muted);border:1px solid var(--border);text-align:center;white-space:nowrap}
.e1rm-badge.pr{color:var(--gold);border-color:rgba(176,120,40,.3);background:var(--gdim)}
.chk{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:transparent;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .1s;
  color:transparent;font-size:14px;flex-shrink:0;touch-action:manipulation}
.chk.done{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 1px 3px rgba(39,114,74,.3)}
.tag-btn{width:24px;height:30px;border-radius:6px;border:1px solid var(--border);background:transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;
  color:var(--muted2);flex-shrink:0;transition:all .1s;touch-action:manipulation}
.tag-btn.tagged{border-color:var(--gold);color:var(--gold)}
.tag-row{display:flex;gap:5px;padding:6px 10px 8px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.tag-chip{padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg);
  font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .1s;touch-action:manipulation}
.tag-chip.on{border-color:var(--navy);background:var(--ndim);color:var(--navy)}
.tag-chip.pain{border-color:var(--red);background:var(--rdim);color:var(--red)}

/* ── STAT GRIDS ── */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair)}
.sc{background:var(--card);padding:12px 14px}
.sv{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;letter-spacing:-.03em}
.slb{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:3px}

/* ── LIST ITEMS ── */
.hi{display:flex;align-items:center;padding:13px 14px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .08s;touch-action:manipulation}
.hi:last-child{border-bottom:none}
.hi:active{background:var(--bg)}
.hn{font-size:14px;font-weight:600;letter-spacing:-.01em}
.hm{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.sui{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.sui:last-child{border-bottom:none}
.tog{width:46px;height:27px;border-radius:14px;border:1.5px solid var(--border);background:var(--bg2);
  cursor:pointer;position:relative;transition:all .18s;flex-shrink:0;touch-action:manipulation}
.tog::after{content:'';position:absolute;width:19px;height:19px;border-radius:50%;
  background:var(--card);top:3px;left:3px;transition:all .18s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tog.on{border-color:var(--green);background:var(--green)}
.tog.on::after{transform:translateX(19px)}
.exi{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .08s;touch-action:manipulation}
.exi:last-child{border-bottom:none}
.exi:active{background:var(--bg)}
.exin{font-size:14px;font-weight:500;flex:1;letter-spacing:-.01em}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.02em}
.bg{background:var(--gdim);color:var(--gold)}
.ba{background:var(--ndim);color:var(--navy)}
.bp{background:var(--navy);color:#fff}
.exmus{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:13px}
.exmus-k{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2)}
.exmus-k:not(:first-child){margin-left:6px}
.bm-cap2{text-align:center;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-top:1px}
.bm-mw-rg{cursor:pointer;transition:opacity .14s}
.bm-mw-rg:active{opacity:.55}

/* ── FILTER BARS ── */
.sw{padding:10px 13px;border-bottom:1px solid var(--border)}
.fr{display:flex;gap:6px;padding:8px 13px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.fr::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 13px;border-radius:20px;border:1px solid var(--border);
  background:var(--bg);color:var(--muted);font-size:11px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .1s;touch-action:manipulation}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
/* ── BARCODE SCANNER ── */
#scan-video{background:#000}
.ptabs{display:flex;border-bottom:1px solid var(--border);padding:0 14px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex-shrink:0;padding:11px 12px;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;
  cursor:pointer;transition:all .1s;background:none;border-top:none;border-left:none;
  border-right:none;margin-bottom:-1px;touch-action:manipulation}
.ptab.on{color:var(--navy);border-bottom-color:var(--navy)}

/* ── FORMS ── */
.fg{margin-bottom:14px}
.fl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;display:block}
.frow{display:flex;align-items:center;gap:8px}
.ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--card);
  color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;font-size:14px;transition:all .1s;touch-action:manipulation;box-shadow:var(--shadow)}
.ib:active{background:var(--bg);transform:scale(.94)}

/* ── MISC ── */
.empty{text-align:center;padding:52px 24px;color:var(--muted)}
.etit{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;letter-spacing:-.02em}
.chart-wrap{padding:12px;position:relative;height:200px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:9px 18px;font-size:13px;font-weight:600;
  z-index:999;animation:tin .16s ease,tout .2s ease 2s both;white-space:nowrap;color:var(--text);
  box-shadow:var(--shadow-md)}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes tout{to{opacity:0;transform:translateX(-50%) translateY(-5px)}}
.wsr{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.wsr:last-child{border-bottom:none}
.afill-tag{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--green);background:var(--grdim);border-radius:4px;padding:1px 6px;margin-left:5px}
/* ── DRAG HANDLE ── */
.drag-handle{width:32px;height:44px;display:flex;align-items:center;justify-content:center;
  color:var(--muted2);cursor:grab;flex-shrink:0;touch-action:none;font-size:14px;letter-spacing:.5px}
.drag-handle:active{cursor:grabbing;color:var(--muted)}
.drag-placeholder{background:var(--ndim);border:2px dashed var(--navy);border-radius:10px;margin-bottom:5px;transition:height .1s}
/* ── COLOR SWATCHES ── */
.color-swatch{width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid transparent;
  transition:transform .1s,border-color .1s;flex-shrink:0;touch-action:manipulation}
.color-swatch.on{border-color:var(--text);transform:scale(1.12)}
.color-swatch:active{transform:scale(.93)}
.rtn-ex{padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:7px}
.rtn-ctl{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.rtn-grp{display:flex;flex-direction:column;gap:3px}
.rtn-grp-row{display:flex;align-items:center;gap:4px}
.rtn-lbl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2)}
.rtn-stepbtn{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--navy);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.rtn-stepbtn:active{transform:scale(.92)}
.rtn-val{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;min-width:40px;text-align:center}
.rtn-reps{width:48px;padding:5px 6px;font-size:12px;text-align:center}
.rtn-type{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.rtn-type button{padding:6px 9px;font-size:10.5px;font-weight:600;background:var(--card);color:var(--muted);border:none;border-right:1px solid var(--border);cursor:pointer;white-space:nowrap}
.rtn-type button:last-child{border-right:none}
.rtn-type button.on{background:var(--ndim);color:var(--navy)}
/* ── Superset brackets ── */
.ss-wrap{position:relative;margin-left:6px;padding-left:10px;border-left:3px solid var(--navy);border-radius:0}
.ss-wrap .exb:first-child{margin-top:0}.ss-wrap .exb:last-child{margin-bottom:0}
.ss-lbl{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);padding:2px 8px 4px 10px;margin:0 13px}
.ss-link-btn{font-size:10px;font-weight:700;color:var(--navy);background:var(--ndim);border:1px solid var(--nbright);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.ss-link-btn.linked{background:var(--navy);color:#fff;border-color:var(--navy)}
.ss-link-btn:active{transform:scale(.95)}
/* Muscle chip picker (secondary muscle selection) */
.mchip-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.mchip{font-size:11px;font-weight:600;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;transition:all .15s}
.mchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.mchip:active{transform:scale(.95)}
/* Routine editor superset visual */
.rtn-ss-wrap{border-left:3px solid var(--navy);margin-left:4px;padding-left:6px;border-radius:0}
.rtn-ss-lbl{font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);padding:3px 0 2px 2px}
/* Import modal */
.import-ta{width:100%;min-height:120px;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.5;padding:10px;border:1px solid var(--border);border-radius:var(--rm);background:var(--bg);color:var(--text);resize:vertical}
.import-preview{border:1px solid var(--border);border-radius:var(--rm);overflow:hidden;margin:10px 0}
.import-row{padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px}
.import-row:last-child{border-bottom:none}
.import-row .ir-name{font-weight:600}.import-row .ir-meta{font-size:10px;color:var(--muted);margin-top:2px}
.import-warn{font-size:11px;color:var(--gold);background:var(--gdim);border-radius:7px;padding:7px 10px;margin:8px 0}
.bm-svg{width:100%;height:auto;display:block}
.bm-rg{cursor:pointer;stroke:var(--card);stroke-width:1;transition:opacity .12s}
.bm-rg:active{opacity:.55}
.bm-cap{fill:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;font-family:'DM Sans',sans-serif}
.bm-dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:3px}
.ol-badge{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--blue);background:var(--bdim);border-radius:4px;padding:1px 6px;margin-left:5px;
  border:1px solid rgba(36,104,184,.18)}
.pain-banner{margin:8px 13px;padding:10px 14px;background:var(--rdim);border:1px solid rgba(176,53,53,.22);
  border-radius:10px;font-size:12px;color:var(--red);font-weight:600}
.plate-visual{display:flex;flex-wrap:wrap;gap:5px;padding:12px;background:var(--bg);
  border-radius:10px;margin-bottom:10px;align-items:center;justify-content:center;min-height:52px}
.plate{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11px;padding:7px 10px;border:2px solid}
.p45{background:#1b3353;color:#fff;border-color:#1b3353}.p35{background:#b07828;color:#fff;border-color:#b07828}
.p25{background:#27724a;color:#fff;border-color:#27724a}.p10{background:#2468b8;color:#fff;border-color:#2468b8}
.p5{background:#b03535;color:#fff;border-color:#b03535}.p2{background:var(--bg2);color:var(--text);border-color:var(--border)}
.macro-bar-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:5px 0 2px}
.macro-bar-fill{height:100%;border-radius:3px;transition:width .4s ease}
.sched-day{width:38px;height:42px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all .1s;font-size:9px;font-weight:700;letter-spacing:.03em;
  text-transform:uppercase;color:var(--muted);gap:2px;touch-action:manipulation}
.sched-day.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(27,51,83,.25)}
.eq-preset{border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;
  transition:all .1s;background:var(--card);display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow);touch-action:manipulation}
.eq-preset:active{background:var(--bg);transform:scale(.98)}
.eq-preset.on{border-color:var(--navy);background:var(--ndim)}
.insight-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;margin-bottom:10px;cursor:pointer;transition:all .1s;box-shadow:var(--shadow);touch-action:manipulation}
.insight-card:active{background:var(--bg)}

/* ── PROGRESS DASH ── */
.dash-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  margin:0 13px 8px;overflow:hidden;box-shadow:var(--shadow)}
.dash-hdr{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;
  user-select:none;transition:background .08s;touch-action:manipulation}
.dash-hdr:active{background:var(--bg)}
.dash-icon{font-size:15px;flex-shrink:0;width:34px;height:34px;display:flex;align-items:center;
  justify-content:center;background:var(--bg2);border-radius:10px}
.dash-info{flex:1;min-width:0}
.dash-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.dash-sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-chev{color:var(--muted2);font-size:16px;transition:transform .2s;line-height:1;flex-shrink:0}
.dash-chev.open{transform:rotate(90deg)}
.dash-body{border-top:1px solid var(--border)}

/* ── CALENDAR ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border)}
.cal-day-hdr{background:var(--bg);padding:6px 0;text-align:center;font-size:9px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cal-cell{background:var(--card);padding:5px 3px;min-height:50px;cursor:pointer;transition:background .08s;touch-action:manipulation;position:relative}
.cal-goal-tri{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 9px 9px 0}
.cal-cell:active{background:var(--bg2)}.cal-cell.empty{background:var(--bg);cursor:default}
.cal-cell.today .cal-date{background:var(--navy);color:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(27,51,83,.3)}
.cal-cell.rest-day{background:rgba(27,51,83,.02)}
.cal-date{width:25px;height:25px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;margin:0 auto 3px}
.cal-dots{display:flex;justify-content:center;gap:2px;flex-wrap:wrap;min-height:7px}
.cal-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.act-icon{width:34px;height:34px;border-radius:9px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-right:10px}
.mvrow{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
.mvrow:last-child{border-bottom:none}
.mvname{flex:1;font-size:12px;font-weight:500}
.aft-total{background:var(--navy);color:#fff;margin:0 13px 10px;border-radius:var(--r);padding:16px;box-shadow:var(--shadow-md)}
.aft-bar-track{height:6px;background:rgba(255,255,255,.15);border-radius:3px;margin:6px 0 3px;position:relative}
.aft-bar-fill{height:100%;border-radius:3px;transition:width .35s ease}
.aft-bar-goal{position:absolute;top:-4px;width:2px;height:14px;background:#fff;border-radius:1px;opacity:.5}
.aft-row{padding:11px 14px;border-bottom:1px solid var(--border)}
.aft-row:last-child{border-bottom:none}
.meas-chg{font-size:10px;font-weight:600;margin-left:6px}

/* ── HOME CARDS ── */
.hype-section{margin:0 13px 10px}
.routine-today{background:var(--navy);border-radius:var(--r);padding:18px;color:#fff;
  position:relative;overflow:hidden;box-shadow:var(--shadow-md)}
.routine-today::before{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;
  border-radius:50%;background:rgba(255,255,255,.05)}
.routine-today::after{content:'';position:absolute;right:10px;bottom:-40px;width:100px;height:100px;
  border-radius:50%;background:rgba(255,255,255,.03)}
.stat-mini{background:var(--card);border:1px solid var(--border);border-radius:11px;
  padding:11px 10px;text-align:center;box-shadow:var(--shadow)}
.stat-mini-val{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;letter-spacing:-.02em}
.stat-mini-lbl{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:3px}

/* ── MODES ── */
.mode-card{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);

.mode-card:active{background:var(--bg2);transform:scale(.98)}

.cd-card{width:200px;height:300px;background:var(--card);border-radius:18px;position:relative;

  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .1s;-webkit-user-select:none}
.cd-card:active{transform:scale(.96)}
.cd-corner-tl{position:absolute;top:14px;left:16px;text-align:left;line-height:1.15}
.cd-corner-br{position:absolute;bottom:14px;right:16px;text-align:right;transform:rotate(180deg);line-height:1.15}
.cd-corner-val{font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace;line-height:1}
.cd-corner-sym{font-size:15px;line-height:1.2}
.cd-main-sym{font-size:62px;line-height:1}
.cd-main-val{font-size:38px;font-weight:700;font-family:'IBM Plex Mono',monospace;letter-spacing:-.02em;line-height:1}
.cd-reps-lbl{font-size:13px;margin-top:6px;font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--muted)}

function muscleContribs(exId){
  const info=getEx(exId);if(!info||!info.muscle)return[];
  const pm=normMuscle(info.muscle);

// Contribution-weighted working sets per muscle for completed workouts in [start,end).
function muscleSetsInRange(start,end){
  const m={};Object.keys(MEV_MAV).forEach(k=>m[k]=0);
  S.workouts.filter(w=>w.started>=start&&w.started<end).forEach(wk=>{
    wk.exercises.forEach(ex=>{
      const done=ex.sets.filter(s=>s.done&&!s.warmup).length;if(!done)return;
      muscleContribs(ex.exId).forEach(c=>{if(m[c.muscle]!==undefined)m[c.muscle]+=done*c.w;});
    });
  });
  return m;
}

function inferDaysPerWeek(){const ago=Date.now()-28*86400000;const n=S.workouts.filter(w=>w.started>=ago).length;return n?Math.min(7,Math.max(1,Math.round(n/4))):4;}

function routineMuscleSets(routine){
  const m={};(routine.exercises||[]).forEach(ex=>{const n=parseInt(ex.sets)||0;if(!n)return;muscleContribs(ex.exId).forEach(c=>{m[c.muscle]=(m[c.muscle]||0)+n*c.w;});});
  return m;
}
// Projected contribution-weighted sets per muscle over a rolling 2 weeks for a group.
function groupProjection(g){
  const proj={};Object.keys(MEV_MAV).forEach(k=>proj[k]=0);
  const routines=(g.routineIds||[]).map(id=>(S.routines||[]).find(r=>r.id===id)).filter(Boolean);
  let sessions=0;
  if(g.mode==='daypicker'){
    routines.forEach(r=>{const days=((g.dayMap||{})[r.id]||[]).length;if(!days)return;sessions+=days*2;const ms=routineMuscleSets(r);Object.keys(ms).forEach(k=>{if(proj[k]!==undefined)proj[k]+=ms[k]*days*2;});});
  }else{
    const D=g.daysPerWeek||inferDaysPerWeek();const N=routines.length||1;sessions=Math.round(2*D);const runs=(2*D)/N;
    routines.forEach(r=>{const ms=routineMuscleSets(r);Object.keys(ms).forEach(k=>{if(proj[k]!==undefined)proj[k]+=ms[k]*runs;});});
  }
  return{proj,sessions,nRoutines:routines.length};
}

function heightCm(){return(S.height||69)*2.54;}
function ageFromRange(){
  const r=S.aftAge||'22-26';const m=r.match(/^(\d+)/);const lo=m?parseInt(m[1]):24;
  if(r.includes('+'))return lo+3;
  const hi=(r.match(/-(\d+)/)||[])[1];
  return hi?Math.round((lo+parseInt(hi))/2):lo;
}
// Real age from birth month/year when set; otherwise fall back to the AFT bracket midpoint.
function userAge(){
  if(S.birthYear){
    const now=new Date();let a=now.getFullYear()-parseInt(S.birthYear);
    if(S.birthMonth&&now.getMonth()<(parseInt(S.birthMonth)-1))a--;
    return Math.max(13,Math.min(100,a));
  }
  return ageFromRange();
}
function bmr(){ // Mifflin-St Jeor
  const s=(S.aftGender==='female')?-161:5;
  return Math.round(10*bwKg()+6.25*heightCm()-5*userAge()+s);
}
// AFT scoring bracket derived from the user's actual age + gender (no manual picker).
function aftAgeBracket(){
  const a=userAge();const gn=S.aftGender||'male';
  if(gn==='female'){return a<=21?'17-21':a<=26?'22-26':a<=31?'27-31':'32+';}
  return a<=21?'17-21':a<=26?'22-26':a<=31?'27-31':a<=36?'32-36':a<=41?'37-41':'42+';
}

function dayExerciseCals(ds){
  const w=S.workouts.filter(wk=>new Date(wk.started).toISOString().split('T')[0]===ds).reduce((t,wk)=>t+(wk.cals||0),0);
  const a=S.activities.filter(x=>x.date===ds).reduce((t,x)=>t+(x.cals||0),0);

}

// Estimated comfortable speed (mph) for distance-capable activities; walk scales with height.
function estSpeedMph(type){
  if(type==='walk'){const h=S.height||69;return Math.max(2.3,Math.min(3.7,3.0*(h/69)));}
  return({run:6,bike:12,hike:2.5}[type])||3;
}
function estDistanceMi(type,durMin){return +(estSpeedMph(type)*(durMin/60)).toFixed(2);}
function estDurationMin(type,distMi){const sp=estSpeedMph(type)||3;return Math.round((distMi/sp)*60);}
function activityCals(act){
  const t=ACT_TYPES.find(a=>a.id===act.type)||{mets:5};
  if(act.type==='ruck'){const tf={flat:1,hilly:1.3,trail:1.2,mixed:1.15}[act.terrain||'flat'];return Math.round(0.30*((S.bodyweight||185)+(parseFloat(act.ruckWeight)||0))*(parseFloat(act.dist)||0)*tf);}
  let dur=parseFloat(act.dur)||0;const dist=parseFloat(act.dist)||0;
  // If only distance given, estimate the time so we can still produce a kcal figure.
  if(!dur&&dist&&(t.fields||[]).includes('dist'))dur=estDurationMin(act.type,dist);
  let mets=t.mets;
  // Walking pace materially changes burn — derive METs from actual pace when both are present.
  if(act.type==='walk'&&dist&&parseFloat(act.dur)){
    const sp=dist/((parseFloat(act.dur))/60);
    mets=sp<2.5?2.8:sp<3?3.3:sp<3.5?3.8:sp<4?4.3:5.0;
  }
  return Math.round(mets*bwKg()*(dur/60));
}

// Rotation group / no group: no fixed weekday pattern exists, so every day is trainable
// (the calendar simply won't shade rest days in that case).
function isTrainingDay(ds){
  const sch=S.schedule;
  const ov=sch&&sch.overrides&&sch.overrides[ds];
  if(ov)return ov==='active';
  const rovRid=sch&&sch.routineOverrides&&sch.routineOverrides[ds];
  if(rovRid==='rest')return false;
  if(rovRid)return true;
  const g=getActiveGroup();
  if(g&&g.mode==='daypicker'){
    const dow=new Date(ds+'T12:00:00').getDay();
    return(g.routineIds||[]).some(id=>((g.dayMap||{})[id]||[]).includes(dow));
  }
  return true;
}

  return(g.routineIds||[]).filter(id=>((g.dayMap||{})[id]||[]).includes(dow))
    .map(id=>(S.routines||[]).find(r=>r.id===id)?.name).filter(Boolean);

function getStreak(){
  const actDates=new Set([
    ...S.workouts.map(w=>new Date(w.started).toISOString().split('T')[0]),
    ...S.activities.map(a=>a.date)
  ]);
  const dt=new Date();
  // An empty today doesn't break the streak — count back from yesterday in that case.
  if(!actDates.has(dt.toISOString().split('T')[0]))dt.setDate(dt.getDate()-1);
  let n=0;
  while(actDates.has(dt.toISOString().split('T')[0])){n++;dt.setDate(dt.getDate()-1);}
  return n;
}

// ─── Timed programs: ordered phases, each a group running for N weeks or until a date ───
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);}
function addDays(ds,n){const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().split('T')[0];}
// Compute each phase's [start,end] date window. End is exclusive (next phase's start).
function programPhaseWindows(){
  const p=S.program;if(!p||!p.phases||!p.phases.length||!p.startDate)return[];
  const out=[];let cursor=p.startDate;
  p.phases.forEach(ph=>{
    let end;
    if(ph.mode==='until'&&ph.untilDate){
      end=addDays(ph.untilDate,1); // inclusive of untilDate
      if(daysBetween(cursor,end)<1)end=addDays(cursor,1); // guard against past dates
    }else{
      const wks=Math.max(1,ph.weeks||1);
      end=addDays(cursor,wks*7);
    }
    out.push({groupId:ph.groupId,start:cursor,end,mode:ph.mode,weeks:ph.weeks,untilDate:ph.untilDate});
    cursor=end;
  });
  return out;
}
function currentProgramPhase(ds){
  ds=ds||today();
  const wins=programPhaseWindows();
  for(const w of wins){if(ds>=w.start&&ds<w.end)return w;}
  return null;
}
// Auto-activate the group the program says should be active today.
function resolveProgramGroup(){
  const p=S.program;if(!p||!p.active)return;
  const phase=currentProgramPhase(today());
  if(phase&&phase.groupId){
    const target=(S.groups||[]).find(g=>g.id===phase.groupId);
    if(target&&!target.active){
      (S.groups||[]).forEach(g=>g.active=(g.id===phase.groupId));
    }
  }
}
function getNextRoutine(){
  const g=getActiveGroup();if(!g||!(g.routineIds||[]).length)return null;
  if(g.mode==='rotation'){
    const ids=g.routineIds;const rid=ids[(g.cursor||0)%ids.length];
    return(S.routines||[]).find(r=>r.id===rid)||null;
  }
  const dow=new Date().getDay();
  const rid=(g.routineIds||[]).find(id=>((g.dayMap||{})[id]||[]).includes(dow));
  return rid?((S.routines||[]).find(r=>r.id===rid)||null):null;
}

function getTodayRoutine(){return getNextRoutine();}

// ─── Workout intelligence ───
function getExStrData(exId){
  const r=[];
  S.workouts.slice().reverse().forEach(wk=>{
    const ex=wk.exercises.find(e=>e.exId===exId);if(!ex)return;
    const done=ex.sets.filter(s=>s.done&&parseFloat(s.w)>0);if(!done.length)return;
    const mw=Math.max(...done.map(s=>parseFloat(s.w)));
    r.push({label:fmtShort(new Date(wk.started).toISOString()),date:wk.started,maxW:mw,
      vol:done.reduce((t,s)=>t+(parseFloat(s.w)*parseInt(s.r||0)),0),
      e1rm:e1rm(mw,done.find(s=>parseFloat(s.w)===mw)?.r||1)});
  });
  return r;
}
function getExsWithHist(){
  const ids=new Set();
  S.workouts.forEach(wk=>wk.exercises.forEach(ex=>{if(ex.sets.some(s=>s.done&&parseFloat(s.w)>0))ids.add(ex.exId);}));
  return[...ids];
}
function getProgressWins(exIds){
  const wins=[];
  (exIds||getExsWithHist()).forEach(exId=>{
    const hist=getExStrData(exId);
    if(hist.length<3)return;
    const newest=hist[hist.length-1].e1rm;
    const oldest=hist[0].e1rm;
    const pct=oldest>0?Math.round((newest-oldest)/oldest*100):0;
    if(pct>=5)wins.push({exId,name:getEx(exId)?.name,pct,sessions:hist.length});
  });
  return wins.sort((a,b)=>b.pct-a.pct).slice(0,2);
}
function getPRProximity(){
  const results=[];
  Object.entries(S.prs).forEach(([exId,pr])=>{
    const hist=getExStrData(exId);if(!hist.length)return;
    const recent=hist[hist.length-1];
    const gap=pr.est-recent.e1rm;
    if(gap>0&&gap<=pr.est*0.08)results.push({exId,name:getEx(exId)?.name,gap,prEst:pr.est});
  });
  return results.slice(0,1);
}
function getVolumeMomentum(){
  const muscles={};
  for(let w=0;w<3;w++){
    const s=Date.now()-(w+1)*7*86400000,e=Date.now()-w*7*86400000;
    S.workouts.filter(wk=>wk.started>=s&&wk.started<e).forEach(wk=>{
      wk.exercises.forEach(ex=>{
        const info=getEx(ex.exId);if(!info?.muscle)return;
        const sets=ex.sets.filter(s=>s.done).length;
        if(!muscles[info.muscle])muscles[info.muscle]=[0,0,0];
        muscles[info.muscle][w]+=sets;
      });
    });
  }
  const results=[];
  Object.entries(muscles).forEach(([m,[w0,w1,w2]])=>{
    if(w0>0&&w0>w1&&w1>w2)results.push({muscle:MEV_MAV[m]?.lbl||m,weeks:3,val:w0});
    else if(w0>0&&w0>w1)results.push({muscle:MEV_MAV[m]?.lbl||m,weeks:2,val:w0});
  });
  return results.filter(r=>r.weeks>=2).sort((a,b)=>b.weeks-a.weeks).slice(0,1);
}
function getStagnantExercises(exIds){
  const stag=[];
  (exIds||[]).forEach(exId=>{
    const hist=getExStrData(exId);if(hist.length<3)return;
    const last3=hist.slice(-3).map(h=>h.e1rm);
    const mx=Math.max(...last3),mn=Math.min(...last3);
    if(mx-mn<=1)stag.push({exId,name:getEx(exId)?.name,sessions:3});
  });
  return stag.slice(0,2);
}
function getPainWarnings(){

function checkProgressiveOverload(exId){
  const sessions=S.workouts.filter(w=>w.exercises.some(e=>e.exId===exId)).slice(0,2);
  if(sessions.length<2)return null;
  const allComplete=sessions.every(wk=>{
    const ex=wk.exercises.find(e=>e.exId===exId);
    return ex&&ex.sets.length>0&&ex.sets.every(s=>s.done);
  });
  if(!allComplete)return null;
  const ex=getEx(exId);if(!ex)return null;
  if(ex.eq==='Bodyweight')return{type:'reps',amount:1};
  const iso=['Biceps','Triceps','Shoulders','Abs','Calves','Traps','Forearms','Obliques'];
  const isIso=iso.includes(ex.muscle)&&ex.cat!=='Full Body';
  return{type:'weight',amount:S.unit==='kg'?(isIso?1.25:2.5):(isIso?2.5:5),unit:S.unit};
}
function getRecentExIds(n=8){

function getWeeklyActivity(nw=12){

function getRecoveryData(){

  const bkts=[[Date.now()-7*86400000,Date.now()],[Date.now()-14*86400000,Date.now()-7*86400000],[Date.now()-21*86400000,Date.now()-14*86400000]];

function getWilksData(){
  const pr=S.prs;
  const sq=pr['squat']||pr['front-squat']||pr['hex-dl'];
  const bench=pr['bb-bench']||pr['inc-bench'];
  const dl=pr['deadlift']||pr['sumo-dl'];
  if(!sq||!bench||!dl)return null;
  const total=parseFloat(sq.w)+parseFloat(bench.w)+parseFloat(dl.w);
  const bw=S.bodyweight||185;const gn=S.aftGender||'male';
  const bwK=bw/2.205,totK=total/2.205;
  const aw=gn==='female'?[594.31747775582,-27.23842536447,0.82112226871,-0.00930733913,4.731582e-5,-9.054e-8]:[-216.0475144,16.2606339,-0.002388645,-0.00113732,7.01863e-6,-1.291e-8];
  const dw=aw[0]+aw[1]*bwK+aw[2]*bwK**2+aw[3]*bwK**3+aw[4]*bwK**4+aw[5]*bwK**5;
  const wilks=Math.round(500/dw*totK*10)/10;
  const ad=gn==='female'?-57.96288+13.6175032*bwK-0.1126655495*bwK**2+0.0005158568*bwK**3-1.0706e-6*bwK**4:-307.75076+24.0900756*bwK-0.1918759221*bwK**2+0.0007391293*bwK**3-1.093e-6*bwK**4;
  const dots=Math.round(500/ad*totK*10)/10;
  return{total,wilks,dots,sq:sq.w,bench:bench.w,dl:dl.w};
}
function getStdLevels(){
  const bw=S.bodyweight||185;const gn=S.aftGender||'male';
  return Object.entries(STR_STANDARDS).map(([id,std])=>{
    const pr=S.prs[id];if(!pr)return{id,name:std.name,level:0,current:0,targets:[]};
    const w=parseFloat(pr.w);
    const mults=(gn==='female'?std.f:std.m).map(m=>m*bw);
    let level=0;for(let i=0;i<mults.length;i++){if(w>=mults[i])level=i+1;}
    return{id,name:std.name,level,current:w,targets:mults};
  });
}
function aftScore(evId,val,ag,gn){
  const g=AFT_TABLES[gn]||AFT_TABLES.male;const agKey=g[ag]?ag:Object.keys(g)[0];
  const table=g[agKey]?.[evId];if(!table||val===''||val==null)return null;
  const v=parseFloat(val);if(isNaN(v))return null;
  const ev=AFT_EVENTS.find(e=>e.id===evId);const dir=ev?.dir||'high';
  const sorted=[...table].sort((a,b)=>dir==='high'?a[0]-b[0]:b[0]-a[0]);
  if(dir==='high'){if(v<=sorted[0][0])return Math.max(0,sorted[0][1]-5);if(v>=sorted[sorted.length-1][0])return 100;for(let i=1;i<sorted.length;i++){if(v<=sorted[i][0]){const p=(v-sorted[i-1][0])/(sorted[i][0]-sorted[i-1][0]);return Math.round(sorted[i-1][1]+p*(sorted[i][1]-sorted[i-1][1]));}}
  }else{if(v>=sorted[0][0])return Math.max(0,sorted[0][1]-5);if(v<=sorted[sorted.length-1][0])return 100;for(let i=1;i<sorted.length;i++){if(v>=sorted[i][0]){const p=(sorted[i-1][0]-v)/(sorted[i-1][0]-sorted[i][0]);return Math.round(sorted[i-1][1]+p*(sorted[i][1]-sorted[i-1][1]));}}
  }
  return 60;
}

// ─── UI helpers ───
function makeOv(id){
  const ov=document.createElement('div');ov.className='ov';if(id)ov.id=id;
  ov.addEventListener('click',e=>{if(e.target===ov)dismissOv(ov);});
  return ov;
}
function dismissOv(ov){
  const modal=ov.querySelector('.modal');
  if(modal){modal.style.transition='transform .22s cubic-bezier(.22,.61,.36,1)';modal.style.transform='translateY(100%)';}
  setTimeout(()=>ov.remove(),220);
}
function attachSwipeDown(ov){
  const handle=ov.querySelector('.mh');const modal=ov.querySelector('.modal');
  if(!handle||!modal)return;
  let startY=0,startT=0,dragging=false;
  handle.style.touchAction='none';
  handle.addEventListener('pointerdown',e=>{
    startY=e.clientY;startT=Date.now();dragging=true;
    modal.style.transition='none';
    try{handle.setPointerCapture(e.pointerId);}catch(ex){}
  });
  handle.addEventListener('pointermove',e=>{
    if(!dragging)return;const dy=e.clientY-startY;
    if(dy>0)modal.style.transform=`translateY(${dy}px)`;
  });
  handle.addEventListener('pointerup',e=>{
    if(!dragging)return;dragging=false;
    const dy=e.clientY-startY,dt=Date.now()-startT;
    if(dy>80||dy/dt>0.5)dismissOv(ov);
    else{modal.style.transition='transform .22s cubic-bezier(.22,.61,.36,1)';modal.style.transform='';}
  });
  handle.addEventListener('pointercancel',()=>{
    dragging=false;modal.style.transition='transform .22s cubic-bezier(.22,.61,.36,1)';modal.style.transform='';
  });
}
function toast(msg,color){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el=document.createElement('div');el.className='toast';
  if(color==='gold')el.style.cssText='border-color:var(--gold);color:var(--gold)';
  if(color==='green')el.style.cssText='border-color:var(--green);color:var(--green)';
  el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2300);
}

// 7-day-average bodyweight trend (lbs/week) for home cards.
function bwRateInfo(){
  const bwl=S.bodyweightLog||[];if(bwl.length<2)return null;
  const now=Date.now();
  const within=(a,b)=>bwl.filter(e=>{const t=new Date(e.date+'T12:00:00').getTime();return t>now-b*86400000&&t<=now-a*86400000;});
  const avg=arr=>arr.length?arr.reduce((t,e)=>t+e.weight,0)/arr.length:null;
  const recent=avg(within(0,7)),prior=avg(within(7,14));
  if(recent==null)return{rate:null,cur:bwl[0].weight};
  if(prior==null)return{rate:null,cur:recent};
  return{rate:recent-prior,cur:recent};
}
// Goal-specific priority cards for the home intelligence feed.
function goalFeedItems(){
  const items=[];const g=S.goal||'general';const td=today();
  if(g==='weightloss'||g==='recomp'){
    const hasIntake=(getDayTotals(td).cals||0)>0;
    if(hasIntake){
      const eb=energyBalance(td);const def=eb.net<0;
      items.push({icon:def?'🔥':'⚠️',color:def?'var(--green)':'var(--gold)',bg:def?'var(--grdim)':'var(--gdim)',border:def?'rgba(45,122,82,.2)':'rgba(184,124,42,.2)',
        title:`${def?'Deficit':'Surplus'} today: ${eb.net<0?'−':'+'}${Math.abs(Math.round(eb.net)).toLocaleString()} kcal`,
        sub:`${eb.intake.toLocaleString()} in · ${eb.burn.toLocaleString()} out${eb.exercise?` (incl. ${eb.exercise} from training)`:''}.`});
    }
    const bw=bwRateInfo();
    if(bw&&bw.rate!=null){
      const losing=bw.rate<0;
      items.push({icon:'⚖️',color:losing?'var(--green)':'var(--blue)',bg:losing?'var(--grdim)':'var(--bdim)',border:losing?'rgba(45,122,82,.2)':'rgba(36,104,184,.2)',
        title:`${bw.cur.toFixed(1)} ${S.unit} · ${bw.rate<0?'−':'+'}${Math.abs(bw.rate).toFixed(1)} ${S.unit}/wk`,
        sub:'7-day average bodyweight trend.'});
    }
  }
  if(g==='weightloss'){
    const steps=S.stepsLog[td]||0;
    if(steps)items.push({icon:'👟',color:'var(--navy)',bg:'var(--ndim)',border:'var(--nbright)',title:`${steps.toLocaleString()} steps today`,sub:'Daily movement adds to your burn.'});
  }
  if(g==='recomp'){
    const tot=getDayTotals(td);const goalP=(S.macroGoals||{}).protein||0;
    if(tot.protein||tot.cals){const ok=goalP&&tot.protein>=goalP*0.8;
      items.push({icon:'🥩',color:ok?'var(--green)':'var(--gold)',bg:ok?'var(--grdim)':'var(--gdim)',border:ok?'rgba(45,122,82,.2)':'rgba(184,124,42,.2)',
        title:`Protein ${tot.protein||0}g${goalP?` / ${goalP}g`:''}`,sub:ok?'On track to protect muscle while leaning out.':'Hit protein to hold muscle in a recomp.'});}
  }
  return items;
}
// Goal-aware weekly stat strip (4 tiles).
function homeStrip(wkWks,wkSets,wkVol,wkCals){
  const td=today();const g=S.goal||'general';
  const fmtK=v=>v>=1000?(v/1000).toFixed(1)+'k':(Math.round(v)||0);
  const sessions={val:wkWks.length,lbl:'Sessions'};
  const curW=(S.bodyweightLog&&S.bodyweightLog[0]&&S.bodyweightLog[0].weight)||S.bodyweight||0;
  if(g==='weightloss'){
    const eb=energyBalance(td);const steps=S.stepsLog[td]||0;
    return[sessions,
      {val:steps?fmtK(steps):'0',lbl:'Steps'},
      {val:(eb.net<0?'−':'+')+fmtK(Math.abs(eb.net)),lbl:'Net kcal',col:eb.net<0?'var(--green)':'var(--red)'},
      {val:curW||'–',lbl:`Weight`}];
  }
  if(g==='recomp'){
    const tot=getDayTotals(td);
    return[sessions,{val:fmtK(wkVol),lbl:'Volume'},{val:(tot.protein||0)+'g',lbl:'Protein'},{val:curW||'–',lbl:'Weight'}];
  }
  return[sessions,{val:wkSets,lbl:'Sets'},{val:fmtK(wkVol),lbl:'Volume'},{val:fmtK(wkCals),lbl:'~kcal'}];
}

function updActCal(){
  const type=window._actType;
  const act={type,dist:document.getElementById('act-dist')?.value,dur:document.getElementById('act-dur')?.value,ruckWeight:document.getElementById('act-rw')?.value,terrain:document.getElementById('act-terrain')?.value};
  const cals=activityCals(act);const el=document.getElementById('act-cal-prev');if(!el)return;

// ─── Proportional autofill + warmups ───
const WARMUP_RAMP={1:[0.6],2:[0.5,0.7],3:[0.4,0.6,0.8]};
function loadInc(eq,weight){
  if(eq==='Dumbbell'||eq==='Machine'||eq==='Cable')return weight>=100?5:2.5;
  return 5; // Barbell, Kettlebell, Medicine Ball, Other, added-load Bodyweight
}
function roundTo(raw,inc){return Math.round(raw/inc)*inc;}
function jumpFor(weight,eq){const inc=loadInc(eq,weight);return Math.max(inc,roundTo(weight*0.025,inc));}
function warmupPcts(n){return WARMUP_RAMP[n]||Array.from({length:n},(_,i)=>0.4+(0.45*i/(n-1||1)));}
// Recompute every auto (non-manual, non-completed) set for one exercise.
// Working sets ascend from the first working set; warmups ramp off it.
function recalcExercise(ei){
  const wk=S.activeWorkout;if(!wk)return;
  const ex=wk.exercises[ei];if(!ex)return;
  const eq=getEx(ex.exId)?.eq||'Other';
  const working=ex.sets.filter(s=>!s.warmup);
  const w0=working.length?parseFloat(working[0].w):NaN;
  const mode=ex.progression||'flat';
  if(!isNaN(w0)){
    let base=w0;
    for(let k=1;k<working.length;k++){
      const s=working[k];
      if(!s.done&&!s._manual){
        let nw;
        if(mode==='ascend'){const a=base+jumpFor(base,eq);nw=roundTo(a,loadInc(eq,a));}
        else if(mode==='descend'){const a=base-jumpFor(base,eq);nw=Math.max(loadInc(eq,base),roundTo(a,loadInc(eq,a)));}
        else{nw=roundTo(w0,loadInc(eq,w0));} // flat / straight sets
        s.w=String(nw);
      }
      const sv=parseFloat(s.w);if(!isNaN(sv))base=sv;
    }
  }
  const warm=ex.sets.filter(s=>s.warmup);
  if(warm.length&&!isNaN(w0)){
    const pcts=warmupPcts(warm.length);
    warm.forEach((s,i)=>{
      if(!s.done&&!s._manual){
        const raw=w0*pcts[i],inc=loadInc(eq,raw);
        s.w=String(Math.max(inc,roundTo(raw,inc)));
      }
    });
  }
  save();
}
function syncExInputs(ei){
  const ex=S.activeWorkout?.exercises[ei];if(!ex)return;
  ex.sets.forEach((s,si)=>{
    const wi=document.querySelector(`#sr-${ei}-${si} input:nth-of-type(1)`);
    if(wi&&document.activeElement!==wi)wi.value=s.w||'';

}
function upd(ei,si,f,v){
  if(!S.activeWorkout)return;
  const s=S.activeWorkout.exercises[ei].sets[si];
  s[f]=v;

  else save();
}
function togSet(ei,si){
  if(!S.activeWorkout)return;

    const est=!s.warmup&&s.done&&parseFloat(s.w)&&parseInt(s.r)?e1rm(parseFloat(s.w),parseInt(s.r)):null;
    const pr=S.prs[S.activeWorkout.exercises[ei].exId];

function toggleTagRow(ei,si){if(!S.activeWorkout)return;const s=S.activeWorkout.exercises[ei].sets[si];s._showTag=!s._showTag;renderSession(document.getElementById('content'));}

function showPlateCalc(ei){
  const ex=S.activeWorkout?.exercises[ei];

      <option value="${S.unit==='kg'?20:45}">${S.unit==='kg'?'20kg':'45 lbs'} Standard</option>

function calcPltDisp(){
  const tgt=parseFloat(document.getElementById('plt-tgt')?.value);
  const bar=parseFloat(document.getElementById('plt-bar')?.value)||(S.unit==='kg'?20:45);
  const el=document.getElementById('plt-result');if(!el)return;
  if(!tgt){el.innerHTML='';return;}
  const side=(tgt-bar)/2;
  if(side<0){el.innerHTML=`<div style="color:var(--red);font-size:13px;text-align:center;padding:12px">Below bar weight (${bar}${S.unit})</div>`;return;}
  const sets=S.unit==='kg'?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5,1.25];
  let rem=side;const plates=[];
  for(const p of sets){const n=Math.floor(rem/p+0.001);if(n>0){plates.push({w:p,n});rem-=p*n;}}
  const all=plates.flatMap(p=>Array(p.n).fill(p.w));
  const cls=w=>w>=45?'p45':w>=35?'p35':w>=25?'p25':w>=10?'p10':w>=5?'p5':'p2';
  el.innerHTML=`<div style="text-align:center;font-size:10px;color:var(--muted);margin-bottom:8px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">Each side · bar ${bar}${S.unit}</div>
    <div class="plate-visual">${all.length?all.map(w=>`<div class="plate ${cls(w)}">${w}</div>`).join(''):'<div style="color:var(--muted);font-size:12px">Just the bar</div>'}</div>
    ${rem>0.01?`<div style="text-align:center;font-size:11px;color:var(--gold);font-weight:600">~${rem.toFixed(2)}${S.unit} remainder</div>`:''}`;
}

function getPRsFromSess(wk){
  const names=[];wk.exercises.forEach(ex=>{ex.sets.filter(s=>s.done).forEach(s=>{const w=parseFloat(s.w||0),r=parseInt(s.r||0);if(w&&r){const prev=S.prs[ex.exId];if(!prev||e1rm(w,r)>=e1rm(parseFloat(prev.w),parseInt(prev.r))){const info=getEx(ex.exId);if(info&&!names.includes(info.name))names.push(info.name);}}});});return names;
}
function getRoutineDiff(wk){
  if(!wk.routineId||!wk._origExIds)return null;
  const orig=wk._origExIds;const now=wk.exercises.map(e=>e.exId);
  const added=now.filter(id=>!orig.includes(id)).map(id=>getEx(id)?.name||id);
  const changed=[];const ls=getLastRSess(wk.routineId);
  if(ls){wk.exercises.filter(ex=>orig.includes(ex.exId)).forEach(ex=>{const prev=ls.exercises.find(e=>e.exId===ex.exId);if(!prev)return;const cW=parseFloat(ex.sets.find(s=>s.done)?.w||0);const pW=parseFloat(prev.sets.find(s=>s.done)?.w||0);if(pW&&cW&&Math.abs(cW-pW)/pW>0.03)changed.push(`${getEx(ex.exId)?.name||ex.exId} (${pW}→${cW}${S.unit})`);});}
  if(!added.length&&!changed.length)return null;return{added,changed};
}
function saveRoutineChanges(rid){
  const wk=S.activeWorkout;const r=S.routines.find(x=>x.id===rid);if(!r||!wk)return;
  wk.exercises.forEach(ex=>{if(!r.exercises.find(e=>e.exId===ex.exId)){const bs=ex.sets.find(s=>s.done)||ex.sets[0];r.exercises.push({exId:ex.exId,sets:ex.sets.length,w:bs?.w||'',r:bs?.r||''});}
  const rEx=r.exercises.find(e=>e.exId===ex.exId);if(!rEx)return;const bd=ex.sets.filter(s=>s.done).sort((a,b)=>parseFloat(b.w||0)-parseFloat(a.w||0))[0];if(bd){rEx.w=bd.w;rEx.r=bd.r;}rEx.sets=ex.sets.length;});
  save();toast('Routine updated!','green');
}

function setProgStart(v){if(v)_progDraft.startDate=v;renderProgramEditor();}
function addProgPhase(){

  renderProgramEditor();
}
function removeProgPhase(i){_progDraft.phases.splice(i,1);renderProgramEditor();}
function moveProgPhase(i,dir){const j=i+dir;if(j<0||j>=_progDraft.phases.length)return;const p=_progDraft.phases;[p[i],p[j]]=[p[j],p[i]];renderProgramEditor();}

function adjProgWeeks(i,d){_progDraft.phases[i].weeks=Math.max(1,(_progDraft.phases[i].weeks||1)+d);renderProgramEditor();}
function saveProgram(){

  if(_progDraft.phases.some(p=>p.mode==='until'&&!p.untilDate)){toast('Set a date for each "until" phase');return;}

  </div>

function renderProgress(c){
  const gl=S.goal||'general';
  // Open this goal's key cards the first time it's viewed; respect manual changes thereafter.
  if(!S.progSeeded)S.progSeeded={};
  if(!S.progSeeded[gl]){(GOAL_OPEN[gl]||[]).forEach(id=>{S.expandedCards[id]=true;});S.progSeeded[gl]=true;save();}
  const order=GOAL_ORDER[gl]||GOAL_ORDER.general;
  const sorted=order.map(id=>DASH_CARDS.find(d=>d.id===id)).filter(Boolean);
  let html=`<div class="ph"><div class="page-title">Progress</div></div>`;
  sorted.forEach(card=>{
    const open=S.expandedCards[card.id];const sub=getDashSub(card.id);

function toggleCard(id){S.expandedCards[id]=!S.expandedCards[id];renderProgress(document.getElementById('content'));}
function getDashSub(id){
  if(id==='energy'){const eb=energyBalance(today());const net=eb.net;return`${net<=0?'−':'+'}${Math.abs(Math.round(net)).toLocaleString()} kcal today`;}
  if(id==='weekly'){const n=S.workouts.filter(w=>w.started>=Date.now()-7*86400000).length;return`${n} session${n!==1?'s':''} this week`;}
  if(id==='strength'){const n=getExsWithHist().length;return n?`${n} exercises tracked`:'No history yet';}
  if(id==='prs'){const n=Object.keys(S.prs).length;return n?`${n} PR${n!==1?'s':''} recorded`:'None yet';}
  if(id==='volume'){const n=S.workouts.filter(w=>w.started>=Date.now()-7*86400000).reduce((t,wk)=>t+doneSetCnt(wk),0);return`${n} sets this week`;}
  if(id==='bodyweight'){const bwl=S.bodyweightLog||[];return bwl.length?`${bwl[0].weight}${S.unit} current`:'No logs yet';}
  if(id==='measurements'){const m=S.measurements||[];return m.length?`Last: ${fmtShort(m[0].date+'T12:00:00')}`:'No measurements yet';}
  if(id==='standards'){const lvs=getStdLevels();const p=lvs.filter(l=>l.level>0).length;return p?`${p}/${lvs.length} graded`:'No lift data yet';}
  if(id==='aft'){const sc=AFT_EVENTS.map(e=>aftScore(e.id,S.aftCurrent[e.id],aftAgeBracket(),S.aftGender)).filter(s=>s!==null);return sc.length?`Avg ${Math.round(sc.reduce((a,b)=>a+b,0)/sc.length)} pts`:'No scores entered';}
  if(id==='consistency')return`${getStreak()} day streak`;
  if(id==='recovery'){const{warnings}=getRecoveryData();return warnings.length?`⚠ ${warnings.length} muscle${warnings.length>1?'s':''} at risk`:'Fatigue normal';}
  if(id==='rucking'){const n=S.activities.filter(a=>['ruck','run','hike','bike','swim','walk'].includes(a.type)).length;return n?`${n} cardio sessions`:'None logged';}
  if(id==='wilks'){const w=getWilksData();return w?`Wilks ${w.wilks} · DOTS ${w.dots}`:'Need squat, bench, deadlift PRs';}
  return'';
}

// One tracked muscle can drive several SVG regions (delts split front/rear, traps incl. mid-trap, calves both views).
const BM_MAP={
  'Chest':['f-chest'],
  'Lats':['b-lats'],
  'Shoulders':['f-front-shoulders','b-rear-shoulders'],
  'Biceps':['f-biceps'],
  'Triceps':['b-triceps'],
  'Forearms':['f-forearms','b-forearms'],
  'Quads':['f-quads'],
  'Hamstrings':['b-hamstrings'],
  'Glutes':['b-glutes'],
  'Calves':['f-calves','b-calves'],
  'Abs':['f-abdominals'],
  'Obliques':['f-obliques'],
  'Lower Back':['b-lowerback'],
  'Traps':['f-traps','b-traps','b-traps-middle'],
};
const BM_UNTRACKED=['f-hands','b-hands'];
const BM_FILL={none:'var(--bm-muscle)',low:'var(--red)',ok:'var(--green)',high:'var(--purple)'};
function bmStatus(sbm,m){const mm=MEV_MAV[m];if(!mm)return'none';const s=sbm[m]||0;return s===0?'none':s<mm.mev?'low':s<=mm.mav?'ok':'high';}
// Inject per-group fill color + (for tracked muscles) a tap handler into the SVG markup.
function bmPaint(svg,groups){
  return svg.replace(/<g id="([^"]+)"/g,(full,id)=>{
    const g=groups[id];if(!g)return full;
    const click=g.m?` class="bm-mw-rg" onclick="showMuscleDetail('${g.m}')"`:'';
    return `<g id="${id}" style="color:${g.c}"${click}`;
  });
}
function bmFigure(view,sbm){
  const groups={};
  BM_UNTRACKED.forEach(id=>groups[id]={c:'var(--bm-muscle)',m:null});
  Object.entries(BM_MAP).forEach(([m,ids])=>{const c=BM_FILL[bmStatus(sbm,m)];ids.forEach(id=>groups[id]={c,m});});
  return bmPaint(view==='front'?BM_FRONT:BM_BACK,groups);
}
function renderBodyMap(sbm){
  return`<div style="padding:10px 12px 2px"><div style="display:flex;gap:8px;max-width:360px;margin:0 auto">
    <div style="flex:1">${bmFigure('front',sbm)}<div class="bm-cap2">Front</div></div>
    <div style="flex:1">${bmFigure('back',sbm)}<div class="bm-cap2">Back</div></div>
  </div>
  <div style="display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:9px;color:var(--muted);font-weight:600">
    <span><span class="bm-dot" style="background:var(--red)"></span>Under</span>
    <span><span class="bm-dot" style="background:var(--green)"></span>On target</span>
    <span><span class="bm-dot" style="background:var(--purple)"></span>Over</span>
    <span><span class="bm-dot" style="background:var(--bm-muscle)"></span>None</span>
  </div>
  <div style="text-align:center;font-size:10px;color:var(--muted2);margin-top:3px">Tap a muscle for its trend</div></div>`;
}
function showMuscleDetail(m){
  const mm=MEV_MAV[m];if(!mm)return;
  const now=Date.now(),DAY=86400000;
  const weeks=[0,1,2,3,4,5].map(i=>muscleSetsInRange(now-(i+1)*7*DAY,now-i*7*DAY)[m]||0);
  const cur=weeks[0];
  const status=cur===0?'none':cur<mm.mev?'low':cur<=mm.mav?'ok':'high';
  const col={none:'var(--muted)',low:'var(--red)',ok:'var(--green)',high:'var(--purple)'}[status];
  const lbl={none:'No volume logged this week',low:'Below MEV — add work',ok:'In the productive range',high:'Above MAV — consider trimming'}[status];
  const maxv=Math.max(mm.mav,...weeks,1);
  const bars=weeks.map((v,i)=>{
    const h=Math.round((v/maxv)*100);
    const c=v===0?'var(--bm-muscle)':v<mm.mev?'var(--red)':v<=mm.mav?'var(--green)':'var(--purple)';
    return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="width:100%;height:78px;display:flex;align-items:flex-end"><div style="width:100%;height:${h}%;min-height:3px;background:${c};border-radius:4px 4px 0 0"></div></div>
      <div style="font-size:8px;color:var(--muted);font-family:'IBM Plex Mono',monospace">${fmtSets(v)}</div>
      <div style="font-size:8px;color:var(--muted2)">${i===0?'now':'-'+i+'w'}</div>
    </div>`;
  }).reverse().join('');
  const ov=makeOv('musc-ov');
  ov.innerHTML=`<div class="modal"><div class="mh"></div>
    <div class="mt" style="margin-bottom:1px">${mm.lbl}</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:13px">${m}</div>
    <div style="display:flex;gap:10px;margin-bottom:13px">
      <div style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px;text-align:center"><div style="font-size:24px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:${col};line-height:1.1">${fmtSets(cur)}</div><div style="font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:3px">Sets this week</div></div>
      <div style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px;text-align:center"><div style="font-size:24px;font-weight:600;font-family:'IBM Plex Mono',monospace;line-height:1.1">${mm.mev}–${mm.mav}</div><div style="font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:3px">Target range</div></div>
    </div>
    <div style="font-size:12px;font-weight:600;color:${col};margin-bottom:12px">${lbl}</div>
    <div style="font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2);font-weight:700;margin-bottom:7px">6-week trend</div>
    <div style="display:flex;gap:5px;align-items:flex-end;margin-bottom:14px">${bars}</div>
    <button class="btn btg bfw" onclick="dismissOv(document.getElementById('musc-ov'))">Close</button>
  </div>`;
  document.body.appendChild(ov);attachSwipeDown(ov);
}
function renderVolumeBody(){
  const ago7=Date.now()-7*86400000;const sbm=muscleSetsInRange(ago7,Date.now()+1);
  const muscles=Object.entries(MEV_MAV);
  let html=renderBodyMap(sbm)+`<div style="padding:8px 13px 5px;font-size:10px;color:var(--muted2);font-weight:500;letter-spacing:.04em;text-transform:uppercase">This week · target: MEV–MAV sets</div>`;
  html+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border)">`;
  muscles.forEach(([m,mm])=>{
    const s=sbm[m]||0;
    const status=s===0?'none':s<mm.mev?'low':s<=mm.mav?'ok':'high';
    const bg={'none':'var(--card)','low':'var(--rdim)','ok':'var(--grdim)','high':'var(--pdim)'}[status];
    const col={'none':'var(--muted2)','low':'var(--red)','ok':'var(--green)','high':'var(--purple)'}[status];
    const lbl={'none':'–','low':'Below','ok':'On Track','high':'Above Max'}[status];
    const pct=Math.min(100,Math.round((s/mm.mav)*100));
    html+=`<div style="background:${bg};padding:10px 8px;text-align:center">
      <div style="font-size:8px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px">${mm.lbl}</div>
      <div style="font-size:22px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:${col};line-height:1.1">${fmtSets(s)}</div>

      <div style="height:3px;background:var(--border);border-radius:2px;margin-top:5px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${col};border-radius:2px"></div></div>
    </div>`;
  });
  html+=`</div><div style="padding:8px 13px;display:flex;gap:12px;font-size:10px;font-weight:600;border-top:1px solid var(--border)">

  return html;
}

}
function allFoods(){return[...QUICK_FOODS,...(S.customFoods||[])];}
function searchFoods(q){

}

function toggleStar(id){

function getMacroStreak(){
  let n=0;const dt=new Date();dt.setDate(dt.getDate()-1);
  while(n<365){
    const ds=dt.toISOString().split('T')[0];
    const todayMeals=(S.meals||[]).filter(m=>m.date===ds);
    const ml=S.macroLogs[ds];
    const hasMeals=todayMeals.some(m=>m.protein||m.carbs||m.fat||m.cals);
    const hasLog=ml&&(ml.protein||ml.carbs||ml.fat||ml.cals);
    if(!hasMeals&&!hasLog)break;
    n++;dt.setDate(dt.getDate()-1);
  }
  return n;
}
function getDayTotals(ds){
  const meals=(S.meals||[]).filter(m=>m.date===ds);
  const ml=S.macroLogs[ds]||{};
  if(meals.length){
    return{
      protein:meals.reduce((t,m)=>t+(parseFloat(m.protein)||0),0),
      carbs:meals.reduce((t,m)=>t+(parseFloat(m.carbs)||0),0),
      fat:meals.reduce((t,m)=>t+(parseFloat(m.fat)||0),0),
      cals:meals.reduce((t,m)=>t+(parseFloat(m.cals)||0),0),
      fromMeals:true
    };
  }
  return{...ml,fromMeals:false};
}
// Analyze bodyweight log: rate of change (lbs/week) over recent entries.
function weightTrend(){
  const log=(S.bodyweightLog||[]).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(log.length<2)return null;
  const newest=log[0],oldest=log[log.length-1];
  const days=(new Date(newest.date)-new Date(oldest.date))/86400000;
  if(days<1)return null;
  const deltaLb=newest.weight-oldest.weight;
  const perWeek=(deltaLb/days)*7;
  return{current:newest.weight,deltaLb,days:Math.round(days),perWeek:r1(perWeek)};
}
// Average daily calorie intake over the last N logged days.
function avgDailyIntake(n){
  n=n||7;const vals=[];
  for(let i=0;i<n;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=d.toISOString().split('T')[0];
    const cals=getDayTotals(ds).cals||0;
    if(cals>0)vals.push(cals);
  }
  if(!vals.length)return 0;
  return Math.round(vals.reduce((t,v)=>t+v,0)/vals.length);
}
function weightGoalCard(){
  if(!S.weightGoal||!S.bodyweight)return '';
  const cur=(S.bodyweightLog&&S.bodyweightLog[0]&&S.bodyweightLog[0].weight)||S.bodyweight;
  const goal=S.weightGoal;const dir=S.weightGoalDir;
  const diff=r1(cur-goal);const u=S.unit||'lbs';
  const trend=weightTrend();
  const tdee=baselineBurn();
  const avgIn=avgDailyIntake(7);
  let headline,sub,color,icon,bg,border;
  // Determine if eating more or less is needed
  if(Math.abs(diff)<0.5){
    headline=`At your goal weight (${fmt1(cur)} ${u})`;
    sub=avgIn?`Maintenance ≈ ${tdee} kcal/day. You're averaging ${avgIn}.`:`Maintenance ≈ ${tdee} kcal/day.`;
    color='var(--green)';icon='🎯';bg='var(--grdim)';border='rgba(45,122,82,.2)';
  }else if(cur<goal){
    // Below goal — need to gain (eat more)
    headline=`${fmt1(Math.abs(diff))} ${u} below your goal`;
    const surplus=avgIn?(avgIn-tdee):null;
    if(surplus!=null){
      if(surplus>0)sub=`Eat more to reach ${fmt1(goal)} ${u}. You're at +${surplus} kcal/day over maintenance — on the right track.`;
      else sub=`Eat more to reach ${fmt1(goal)} ${u}. You're ${Math.abs(surplus)} kcal/day under maintenance (${tdee}), which moves you away from your goal.`;
    }else sub=`Eat above ${tdee} kcal/day to gain toward ${fmt1(goal)} ${u}.`;
    color='var(--gold)';icon='⬆️';bg='var(--gdim)';border='rgba(184,124,42,.28)';
  }else{
    // Above goal — need to lose (eat less)
    headline=`${fmt1(Math.abs(diff))} ${u} above your goal`;
    const deficit=avgIn?(tdee-avgIn):null;
    if(deficit!=null){
      if(deficit>0)sub=`Eat less to reach ${fmt1(goal)} ${u}. You're at −${deficit} kcal/day under maintenance — on the right track.`;
      else sub=`Eat less to reach ${fmt1(goal)} ${u}. You're ${Math.abs(deficit)} kcal/day over maintenance (${tdee}), which moves you away from your goal.`;
    }else sub=`Eat below ${tdee} kcal/day to lose toward ${fmt1(goal)} ${u}.`;
    color='var(--navy)';icon='⬇️';bg='var(--ndim)';border='var(--nbright)';
  }
  // Trend line
  let trendLine='';
  if(trend&&Math.abs(trend.perWeek)>=0.1){
    const movingToward=(cur<goal&&trend.perWeek>0)||(cur>goal&&trend.perWeek<0)||(Math.abs(diff)<0.5&&Math.abs(trend.perWeek)<0.3);
    const arrow=trend.perWeek>0?'gaining':'losing';
    trendLine=`<div style="font-size:11px;color:var(--muted);margin-top:4px">Trend: ${arrow} ${fmt1(Math.abs(trend.perWeek))} ${u}/week over ${trend.days}d · ${movingToward?'<span style="color:var(--green);font-weight:600">moving toward goal</span>':'<span style="color:var(--red);font-weight:600">moving away from goal</span>'}</div>`;
  }else if(trend){
    trendLine=`<div style="font-size:11px;color:var(--muted);margin-top:4px">Weight stable over ${trend.days}d. Adjust intake to drive change.</div>`;
  }else{
    trendLine=`<div style="font-size:11px;color:var(--muted);margin-top:4px">Log your weight regularly to track progress.</div>`;
  }
  return`<div style="margin:0 13px 10px;padding:12px 13px;background:${bg};border:1px solid ${border};border-radius:10px">
    <div style="display:flex;align-items:flex-start;gap:10px">
      <div style="font-size:18px">${icon}</div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600;color:${color}">${headline}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45">${sub}</div>
        ${trendLine}
      </div>
    </div>
  </div>`;
}

    const hasMeals=meals.some(m=>m.protein||m.carbs||m.fat||m.cals);
    const ml2=S.macroLogs[ds];
    const hasLog=ml2&&(ml2.protein||ml2.carbs||ml2.fat||ml2.cals);
    return hasMeals||hasLog;
  });
  if(recentDates.length){
    html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 13px 6px;margin-top:4px">

      </div><div class="mono" style="font-size:12px;color:var(--muted);flex-shrink:0">${tot.cals||0}kcal</div></div>`;
    });
    html+=`</div>`;
  }else{
    html+=`<div style="padding:0 13px 2px;display:flex;justify-content:flex-end"><button class="btn bxs bts" onclick="showRetroMacros()">+ Past Date</button></div>`;
  }

  // Supplements
  const logs=S.suppLogs[td]||{};const done=S.supps.filter(s=>logs[s.id]).length;
  html+=`<div style="margin-top:6px;padding:14px 13px 6px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border)">
    <div style="font-size:16px;font-weight:600;letter-spacing:-.01em">Supplements</div>
    <div style="display:flex;align-items:center;gap:9px">
      <div style="font-size:12px;font-weight:600;color:${done===S.supps.length&&S.supps.length>0?'var(--green)':'var(--muted)'}">${done}/${S.supps.length}</div>
      <button class="btn btp bsm" onclick="showAddSupp()">+ Add</button>
    </div>
  </div>`;
  if(!S.supps.length){html+=`<div class="empty" style="padding:24px 20px"><div style="margin-bottom:9px;color:var(--muted2)">${ICON('pill',30)}</div><div class="etit">No supplements</div><p style="font-size:12px">Track your stack</p></div>`;}
  else{
    html+=`<div class="card">`;
    S.supps.forEach(s=>{const on=!!logs[s.id];html+=`<div class="sui"><div style="flex:1"><div style="font-size:14px;font-weight:500">${s.name}</div><div style="font-size:11px;color:var(--muted);margin-top:1px">${s.dose||''}${s.timing?` · ${s.timing}`:''}</div></div><button class="ib delbtn" style="margin-right:9px;font-size:12px" onclick="delSupp('${s.id}')">✕</button><button class="tog${on?' on':''}" onclick="togSupp('${s.id}')"></button></div>`;});
    html+=`</div>`;
    html+=`<div class="sec-lbl">7-Day Compliance</div><div class="card"><div class="cb" style="display:flex;gap:5px">`;
    for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().split('T')[0];const dl=S.suppLogs[ds]||{};const dc=S.supps.filter(s=>dl[s.id]).length;const pct=S.supps.length?Math.round((dc/S.supps.length)*100):0;const col=pct===100?'var(--green)':pct>50?'var(--gold)':pct>0?'var(--navy)':'var(--border)';html+=`<div style="flex:1;text-align:center"><div style="width:100%;aspect-ratio:1;border-radius:5px;background:${col};margin-bottom:3px"></div><div style="font-size:9px;color:var(--muted);font-weight:500">${d.toLocaleDateString('en-US',{weekday:'narrow'})}</div></div>`;}
    html+=`</div></div>`;
  }
  c.innerHTML=html;
}

function doQuickLog(mealType){
  dismissOv(document.getElementById('mtype-ov'));
  const q=window._pendingQuickLog;if(!q)return;
  if(!S.meals)S.meals=[];
  if(q.type==='food'){
    const f=q.food;
    trackRecent(f.id);
    S.meals.push({id:uid(),date:today(),type:mealType,name:mealType,
      items:[{foodId:f.id,name:f.name,qty:1,serving:f.serving,protein:f.protein,carbs:f.carbs,fat:f.fat,cals:f.cals}],
      protein:f.protein,carbs:f.carbs,fat:f.fat,cals:f.cals});
    toast(f.name+' → '+mealType,'green');
  }else if(q.type==='combo'){
    const c=q.combo;
    trackRecentMeal(c.id);
    let tp=0,tc=0,tf=0,tk=0;
    const items=c.items.map(it=>{
      const ip=r1(it.protein*it.qty),ic=r1(it.carbs*it.qty),ifat=r1(it.fat*it.qty),ik=Math.round(it.cals*it.qty);
      tp+=ip;tc+=ic;tf+=ifat;tk+=ik;
      return{...it,protein:ip,carbs:ic,fat:ifat,cals:ik};
    });
    S.meals.push({id:uid(),date:today(),type:mealType,name:mealType,savedMealName:c.name,
      items,protein:r1(tp),carbs:r1(tc),fat:r1(tf),cals:Math.round(tk)});
    toast(c.name+' → '+mealType,'green');
  }
  save();renderNutrition(document.getElementById('content'));
  window._pendingQuickLog=null;
}

function renderFoodTab(query){
  const el=document.getElementById('food-list');if(!el)return;
  const tab=window._mealFoodTab||'starred';
  let foods=[];let savedMealMatches=[];
  if(query){
    foods=searchFoods(query);
    const lc=query.toLowerCase();
    savedMealMatches=(S.savedMeals||[]).filter(c=>c.name.toLowerCase().includes(lc));
  }else if(tab==='starred'){
    foods=getStarredFoods();
    if(!foods.length){el.innerHTML=`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">No starred foods yet.<br>Tap ★ on any food to star it.</div>`;return;}
  }else if(tab==='recent'){
    // Merge recent foods + recent saved meals
    const recentFoods=getRecentFoods();
    const recentMeals=(S.recentSavedMeals||[]).map(id=>(S.savedMeals||[]).find(c=>c.id===id)).filter(Boolean);
    let html='';
    if(recentMeals.length){
      html+=recentMeals.map(c=>{
        const totCals=c.items.reduce((t,it)=>t+((it.cals||0)*it.qty),0);
        return`<div class="hi" style="cursor:pointer" onclick="addComboToMeal('${c.id}')">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${c.name} <span style="font-size:10px;color:var(--green);font-weight:700">MEAL</span></div>
            <div style="font-size:11px;color:var(--muted)">${c.items.map(it=>it.name).join(', ')}</div>
          </div>
          <div class="mono" style="font-size:12px;font-weight:600;color:var(--navy);flex-shrink:0">${Math.round(totCals)}kcal</div>
        </div>`;
      }).join('');
    }
    html+=recentFoods.map(f=>renderFoodRow(f)).join('');
    if(!html)html=`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">No recent items.<br>Foods you log will appear here.</div>`;
    el.innerHTML=html;return;
  }else if(tab==='all'){
    foods=allFoods();
  }else if(tab==='combos'){
    renderComboList(el);return;
  }
  // Render saved meal matches first (from search), then foods
  let html='';
  if(savedMealMatches.length){
    html+=savedMealMatches.map(c=>{
      const totCals=c.items.reduce((t,it)=>t+((it.cals||0)*it.qty),0);
      return`<div class="hi" style="cursor:pointer" onclick="addComboToMeal('${c.id}')">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">${c.name} <span style="font-size:10px;color:var(--green);font-weight:700">MEAL</span></div>
          <div style="font-size:11px;color:var(--muted)">${c.items.map(it=>it.name).join(', ')}</div>
        </div>
        <div class="mono" style="font-size:12px;font-weight:600;color:var(--navy);flex-shrink:0">${Math.round(totCals)}kcal</div>
      </div>`;
    }).join('');
  }
  html+=foods.map(f=>renderFoodRow(f)).join('');
  el.innerHTML=html;
}
function renderFoodRow(f){
  return`<div class="hi" style="cursor:pointer" onclick="addFoodToMeal('${f.id}')">
    <button class="ib" style="font-size:14px;flex-shrink:0;margin-right:6px;color:${isStarred(f.id)?'var(--gold)':'var(--muted2)'}" onclick="event.stopPropagation();toggleStar('${f.id}');renderFoodTab()">★</button>

// ─── Barcode scanner state ───
let _zxingReader=null,_scanStream=null,_scanLoopActive=false,_torchTrack=null,_torchOn=false;
function loadScannerLib(){
  return new Promise((resolve,reject)=>{
    if(window.ZXing&&makeZxingReader.ok!==false){resolve();return;}
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('lib load failed'));
    document.head.appendChild(s);
  });
}
function makeZxingReader(){
  const Z=window.ZXing;if(!Z)return null;
  const Reader=Z.BrowserMultiFormatReader||Z.BrowserBarcodeReader||Z.BrowserCodeReader;
  if(!Reader){makeZxingReader.ok=false;return null;}
  try{
    // Hint the formats we care about (1D product codes) for speed
    let hints=null;
    if(Z.DecodeHintType&&Z.BarcodeFormat){
      hints=new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[
        Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,
        Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,
        Z.BarcodeFormat.ITF,Z.BarcodeFormat.CODABAR
      ]);
      hints.set(Z.DecodeHintType.TRY_HARDER,true);
    }
    return new Reader(hints);
  }catch(e){return new Reader();}
}
function setScanStatus(msg,color){
  const el=document.getElementById('scan-status');if(!el)return;
  el.innerHTML=color?`<div style="color:${color};font-weight:600">${msg}</div>`:msg;
}
function showBarcodeScanner(){

  ov.innerHTML=`<div class="modal" style="max-height:96vh;padding-bottom:calc(30px + var(--sb))">
    <div class="mh"></div>
    <div class="mt">Scan Barcode</div>

      <video id="scan-video" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover;display:block"></video>
      <div style="position:absolute;left:8%;right:8%;top:42%;height:16%;border:2px solid rgba(255,255,255,.85);border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.22);pointer-events:none"></div>
      <div style="position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--red);box-shadow:0 0 8px var(--red);pointer-events:none"></div>
      <button id="torch-btn" onclick="toggleTorch()" style="display:none;position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(0,0,0,.5);color:#fff;font-size:18px;cursor:pointer">🔦</button>
    </div>
    <div id="scan-status" style="text-align:center;padding:12px;font-size:13px;color:var(--muted)">Starting camera…</div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn btp" style="flex:1;gap:6px" onclick="captureAndScan()"><span style="font-size:14px">⎙</span> Freeze + Scan</button>
    </div>

    </div>
  </div>`;
  document.body.appendChild(ov);attachSwipeDown(ov);
