async function startScanner(){
  const video=document.getElementById('scan-video');
  if(!video)return;
  // Defensive: clear any stale state from a previous session
  _zxingReader=null;_scanLoopActive=false;
  if(_scanStream){_scanStream.getTracks().forEach(t=>t.stop());_scanStream=null;}
  // Brief delay lets iOS Safari fully release the camera from a prior session
  await new Promise(r=>setTimeout(r,150));
  try{
    setScanStatus('Requesting camera…');
    _scanStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false
    });
    video.srcObject=_scanStream;
    setScanStatus('Starting video…');
    try{
      await video.play();
    }catch(playErr){
      // iOS autoplay blocked — offer explicit tap-to-start
      setScanStatus('<button class="btn btp bsm" onclick="tapStartCamera()">Tap to start camera</button>');
      setupTorch();
      return;
    }
    setupTorch();
    beginDecode();
  }catch(e){
    console.error('Camera error:',e);
    const msg=e&&e.name==='NotAllowedError'?'Camera permission denied — enable it in Settings, or enter the code manually'
      :e&&e.name==='NotFoundError'?'No camera found — enter the code manually'
      :'Camera unavailable — enter the code manually';
    setScanStatus(msg,'var(--red)');
  }
}
async function tapStartCamera(){
  const v=document.getElementById('scan-video');if(!v)return;
  try{await v.play();beginDecode();}
  catch(e){setScanStatus('Could not start camera — enter the code manually','var(--red)');}
}
async function beginDecode(){
  const video=document.getElementById('scan-video');
  if(!video)return;
  setScanStatus('Point camera at a barcode…');
  try{
    await loadScannerLib();
    _zxingReader=makeZxingReader();
    if(!_zxingReader){setScanStatus('Scanner library unavailable — use Freeze + Scan or enter code','var(--red)');return;}
    _scanLoopActive=true;
    _zxingReader.decodeFromVideoElementContinuously(video,(result)=>{
      if(result&&_scanLoopActive){_scanLoopActive=false;onBarcodeDetected(result.getText());}
    });
  }catch(e){
    setScanStatus('Live scan unavailable — use Freeze + Scan','var(--red)');
  }
}
function setupTorch(){
  try{
    const track=_scanStream&&_scanStream.getVideoTracks()[0];
    if(!track)return;
    const caps=track.getCapabilities?track.getCapabilities():{};
    if(caps&&'torch' in caps&&caps.torch){
      _torchTrack=track;
      const btn=document.getElementById('torch-btn');if(btn)btn.style.display='block';
    }else{
      _torchTrack=null; // iOS Safari lands here — torch not exposed to web
    }
  }catch(e){_torchTrack=null;}
}
async function toggleTorch(){
  if(!_torchTrack)return;
  _torchOn=!_torchOn;
  try{
    await _torchTrack.applyConstraints({advanced:[{torch:_torchOn}]});
    const btn=document.getElementById('torch-btn');
    if(btn)btn.style.background=_torchOn?'var(--gold)':'rgba(0,0,0,.5)';
  }catch(e){_torchOn=!_torchOn;}
}
function teardownScanner(){
  _scanLoopActive=false;
  if(_torchTrack&&_torchOn){try{_torchTrack.applyConstraints({advanced:[{torch:false}]});}catch(e){}}
  _torchTrack=null;_torchOn=false;
  // Stop the decode loop WITHOUT touching the stream (reset() kills the stream on iOS).
  if(_zxingReader){try{_zxingReader.stopContinuousDecode();}catch(e){}}_zxingReader=null;
  // Explicitly detach srcObject before stopping tracks — iOS needs this sequence.
  const vid=document.getElementById('scan-video');
  if(vid)vid.srcObject=null;
  if(_scanStream){_scanStream.getTracks().forEach(t=>t.stop());_scanStream=null;}
}
function stopScanner(){
  teardownScanner();
  const ov=document.getElementById('scan-ov');
  if(ov)dismissOv(ov);
}
async function captureAndScan(){
  const video=document.getElementById('scan-video');
  if(!video||!video.videoWidth){setScanStatus('No camera feed yet — wait a moment','var(--red)');return;}
  _scanLoopActive=false;
  const canvas=document.createElement('canvas');
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  setScanStatus('Analyzing frame…','var(--navy)');
  try{
    await loadScannerLib();
    const reader=makeZxingReader();
    if(!reader)throw new Error('no reader');
    const dataUrl=canvas.toDataURL('image/png');
    const result=await reader.decodeFromImageUrl(dataUrl);
    onBarcodeDetected(result.getText());
  }catch(e){
    setScanStatus('No barcode detected — center it in the box, hold steady, try again','var(--red)');
    // The original continuous loop from beginDecode is still running —
    // it just ignores results when _scanLoopActive is false.
    // Re-enable it. Do NOT re-call decodeFromVideoElementContinuously
    // because ZXing internally calls reset() which kills the stream.
    _scanLoopActive=true;
  }
}

async function onBarcodeDetected(barcode){
  teardownScanner();

  if(statusEl)statusEl.innerHTML=`<div style="font-weight:600;color:var(--navy)">Found: ${barcode}</div><div style="margin-top:4px;font-size:12px">Looking up product…</div>`;

      const product={
        name:pr.product_name||'Unknown Product',
        brand:pr.brands||'',

        servingG:parseFloat(pr.serving_quantity)||0,
        per100:{protein:r1(n.proteins_100g||0),carbs:r1(n.carbohydrates_100g||0),fat:r1(n.fat_100g||0),cals:Math.round(n['energy-kcal_100g']||0)},
        perServing:{protein:r1(n.proteins_serving||0),carbs:r1(n.carbohydrates_serving||0),fat:r1(n.fat_serving||0),cals:Math.round(n['energy-kcal_serving']||0)}
      };

function doCreateCustomFood(barcode){
  const name=document.getElementById('cf-name')?.value?.trim();
  if(!name){toast('Enter a name');return;}

function scanQtyAdj(d){

function r1(v){return Math.round(v*10)/10;}
function fmt1(v){const n=Math.round((parseFloat(v)||0)*10)/10;return n%1===0?String(n):n.toFixed(1);}
function calcScanMacros(){
  const p=window._scanProduct;if(!p)return null;
  const mode=window._scanMode;const qty=parseFloat(document.getElementById('scan-qty')?.value)||1;
  let base;
  if(mode==='serving'){
    base=p.perServing;
    if((!base.cals&&!base.protein)&&p.servingG&&p.per100.cals){
      const mult=p.servingG/100;
      base={protein:p.per100.protein*mult,carbs:p.per100.carbs*mult,fat:p.per100.fat*mult,cals:p.per100.cals*mult};
    }
    return{protein:r1(base.protein*qty),carbs:r1(base.carbs*qty),fat:r1(base.fat*qty),cals:Math.round(base.cals*qty)};
  }else if(mode==='custom'){
    const g=parseFloat(document.getElementById('scan-grams')?.value)||0;
    const mult=g/100;
    return{protein:r1(p.per100.protein*mult),carbs:r1(p.per100.carbs*mult),fat:r1(p.per100.fat*mult),cals:Math.round(p.per100.cals*mult)};
  }else{
    return{protein:r1(p.per100.protein*qty),carbs:r1(p.per100.carbs*qty),fat:r1(p.per100.fat*qty),cals:Math.round(p.per100.cals*qty)};
  }
}
function updateScanMacros(){
  const m=calcScanMacros();if(!m)return;

}
function addScannedFood(){
  const p=window._scanProduct,m=window._scanMacros,barcode=window._scanBarcode;
  if(!p||!m){toast('No product data');return;}
  if(!m.protein&&!m.carbs&&!m.fat&&!m.cals){toast('No nutrition data for this product');return;}
  // Save to customFoods for future use
  const cfId='cf_'+barcode;
  if(!S.customFoods)S.customFoods=[];
  if(!S.customFoods.find(f=>f.id===cfId)){
    S.customFoods.push({id:cfId,name:p.name+(p.brand?' ('+p.brand+')':''),
      serving:p.serving||'1 serving',barcode,
      protein:p.perServing.protein||p.per100.protein,carbs:p.perServing.carbs||p.per100.carbs,
      fat:p.perServing.fat||p.per100.fat,cals:p.perServing.cals||p.per100.cals});
  }
  trackRecent(cfId);
  dismissOv(document.getElementById('serving-ov'));
  // If returning to meal builder, add as item
  if(window._scanReturnToMeal){
    const scannedItem={foodId:cfId,name:p.name+(p.brand?' ('+p.brand+')':''),qty:1,
      serving:p.serving||'1 serving',protein:m.protein,carbs:m.carbs,fat:m.fat,cals:m.cals};

    showAddMeal(window._scanMealDate||today(),true); // keepItems=true (though showAddMeal won't clear)
    _mealItems=[...kept,scannedItem];

  }else{
    // Direct scan from nutrition page — show type picker before logging
    window._pendingScanMeal={cfId,name:p.brand?p.name+' ('+p.brand+')':p.name,
      serving:p.serving||'1 serving',protein:m.protein,carbs:m.carbs,fat:m.fat,cals:m.cals};
    const ov2=makeOv('mtype-ov');
    ov2.innerHTML=`<div class="modal" style="max-height:320px"><div class="mh"></div>
      <div style="font-size:15px;font-weight:600;margin-bottom:12px;text-align:center">What meal is this?</div>

    </div>`;
    document.body.appendChild(ov2);attachSwipeDown(ov2);
  }
  save();window._scanProduct=null;window._scanMacros=null;
}

function parseImport(d){
  const warnings=[];
  // Fix #3: Support both {group, routines} and {groups: [{name, mode, routines}]}
  let groupDefs=[];let allRoutines=[];
  if(d.groups&&Array.isArray(d.groups)){
    d.groups.forEach(g=>{
      const rStart=allRoutines.length;
      const rtns=(g.routines||[]).map(r=>parseRoutine(r,warnings));
      allRoutines.push(...rtns);
      groupDefs.push({name:g.name||'Imported Group',mode:g.mode||'rotation',routineCount:rtns.length,_start:rStart,_count:rtns.length});
    });
  }else if(d.routines&&Array.isArray(d.routines)){
    allRoutines=d.routines.map(r=>parseRoutine(r,warnings));
    if(d.group)groupDefs.push({name:d.group.name||'Imported Group',mode:d.group.mode||'rotation',routineCount:allRoutines.length,_start:0,_count:allRoutines.length});
  }else{return{error:'JSON must have "routines" or "groups" array.'};}
  if(!allRoutines.length)return{error:'No routines found.'};
  return{routines:allRoutines,groups:groupDefs,warnings};
}
function parseRoutine(r,warnings){
  if(!r.name)r.name='Imported Routine';
  const exercises=(r.exercises||[]).map(e=>{
    const matched=matchExercise(e.name||e.id||'');
    let exId;let isNew=false;
    if(matched){exId=matched.id;}
    else{
      exId=`custom-${uid()}`;isNew=true;
      const cat=guessCat(e.name||'');const eq=guessEq(e.equipment||e.eq||'');const muscle=e.muscle||guessMuscle(cat);
      if(!S.custom)S.custom=[];
      const secs=(e.secondaryMuscles||[]).filter(m=>MEV_MAV[m]&&m!==muscle);
      S.custom.push({id:exId,name:e.name||'Unknown',cat,eq,muscle,sec:secs});
      if(secs.length)SEC_MUSCLE[exId]=secs;
      warnings.push(`"${esc(e.name||'?')}" → new custom`);
    }
    return{exId,sets:parseInt(e.sets)||3,w:e.weight||'',r:String(e.reps||''),type:e.type||'flat',rest:e.rest!=null?parseInt(e.rest):null,link:e.link||null,_isNew:isNew};
  });
  return{name:r.name,notes:r.notes||'',exercises};
}
// Fix #2: Score-based matching, no greedy contains
function matchExercise(name){
  if(!name)return null;
  const lower=name.toLowerCase().trim();
  const all=allEx();
  // 1. Exact name match
  let m=all.find(e=>e.name.toLowerCase()===lower);if(m)return m;
  // 2. Exact id match
  m=all.find(e=>e.id===lower);if(m)return m;
  // 3. Score-based: tokenize, compute overlap ratio, require high precision
  const stops=new Set(['the','and','with','for','set','on','of','to','in','a','w']);
  const inToks=lower.split(/[\s\-_\/\(\)]+/).filter(t=>t.length>1&&!stops.has(t));
  if(!inToks.length)return null;
  let best=null,bestScore=0;
  all.forEach(e=>{
    const eToks=e.name.toLowerCase().split(/[\s\-_\/\(\)]+/).filter(t=>t.length>1&&!stops.has(t));
    if(!eToks.length)return;
    // How many catalog tokens appear in input (forward match)
    const fwd=eToks.filter(ct=>inToks.some(it=>it===ct)).length;
    const fwdRatio=fwd/eToks.length;
    // Length similarity bonus
    const lenRatio=Math.min(inToks.length,eToks.length)/Math.max(inToks.length,eToks.length);
    // Require ALL catalog tokens present in input
    if(fwdRatio<1)return;
    // Score favors similar-length names (penalizes "Leg Curl" matching "Seated Leg Curl")
    const score=fwdRatio*0.6+lenRatio*0.4;
    if(score>bestScore){bestScore=score;best=e;}
  });
  // Require length ratio ≥ 0.5 to avoid "Leg Curl" matching "Seated Lying Leg Curl Machine"
  if(best&&bestScore>=0.9)return best;
  return null;
}
function guessCat(name){
  const n=name.toLowerCase();
  if(/bench|chest|fly|push.?up|pec/i.test(n))return'Chest';
  if(/row|pull|lat|back|deadlift/i.test(n))return'Back';
  if(/shoulder|press|lateral|ohp|delt|raise/i.test(n))return'Shoulders';
  if(/curl|bicep/i.test(n))return'Biceps';
  if(/tricep|skull|pushdown|extension/i.test(n))return'Triceps';
  if(/squat|leg|lunge|calf|ham|glute|rdl|hip/i.test(n))return'Legs';
  if(/crunch|plank|ab|core|russian|sit.?up/i.test(n))return'Core';
  return'Full Body';
}
function guessEq(eq){
  const map={'barbell':'Barbell','dumbbell':'Dumbbell','db':'Dumbbell','cable':'Cable','machine':'Machine','bodyweight':'Bodyweight','bw':'Bodyweight','kettlebell':'Kettlebell','kb':'Kettlebell','band':'Other','smith':'Machine'};
  return map[(eq||'').toLowerCase()]||'Other';

function ssLabel(count){return count===2?'Superset':count===3?'Triset':'Giant Set';}
// Get superset groups from an exercise array as [{link,start,end}]
function ssGroups(exercises){
  const groups=[];let i=0;
  while(i<exercises.length){
    const lk=exercises[i].link;
    if(lk){
      let j=i+1;while(j<exercises.length&&exercises[j].link===lk)j++;
      if(j-i>=2)groups.push({link:lk,start:i,end:j-1});
      i=j;
    }else{i++;}
  }
  return groups;
}
// Toggle link between exercise i and i+1 in a routine
function toggleRtnLink(rid,i){
  const L=rtnList(rid);if(!L)return;
  const arr=L.arr;if(i>=arr.length-1)return;
  const a=arr[i],b=arr[i+1];
  if(a.link&&a.link===b.link){
    // Unlink: if group has >2 members, only remove a from the group
    const members=arr.filter(e=>e.link===a.link);
    if(members.length>2){a.link=null;}
    else{a.link=null;b.link=null;}
  }else{
    // Link: if b already has a link, join that group; else if a has a link, extend; else new
    if(b.link){a.link=b.link;}
    else if(a.link){b.link=a.link;}
    else{const lk='ss-'+uid();a.link=lk;b.link=lk;}
  }
  if(L.persist)save();rtnRerender(rid);
}
// Toggle link between exercise ei and ei+1 in active workout
function toggleSessionLink(ei){
  if(!S.activeWorkout)return;
  const arr=S.activeWorkout.exercises;if(ei>=arr.length-1)return;
  const a=arr[ei],b=arr[ei+1];
  if(a.link&&a.link===b.link){
    const members=arr.filter(e=>e.link===a.link);
    if(members.length>2){a.link=null;}
    else{a.link=null;b.link=null;}
  }else{
    if(b.link){a.link=b.link;}
    else if(a.link){b.link=a.link;}
    else{const lk='ss-'+uid();a.link=lk;b.link=lk;}
  }
  save();renderSession(document.getElementById('content'));
}
// Check if exercise at index ei is the last in its superset group
function isLastInSuperset(ei){
  if(!S.activeWorkout)return true;
  const arr=S.activeWorkout.exercises;
  const lk=arr[ei]?.link;if(!lk)return true;
  // Find the last exercise in this link group
  let lastIdx=ei;
  for(let j=ei+1;j<arr.length;j++){if(arr[j].link===lk)lastIdx=j;else break;}
  return ei===lastIdx;
}

function rtnRerender(rid){

function attachRoutineDrag(rid){
  const list=document.getElementById('rd-ex-list');if(!list)return;
  const r=S.routines.find(x=>x.id===rid);if(!r)return;
  let dragIdx=null,overIdx=null,startY=0,ph=null;
  function getRows(){return Array.from(list.querySelectorAll('.rd-ex-row'));}
  list.addEventListener('pointerdown',e=>{
    const handle=e.target.closest('[data-drag]');if(!handle)return;
    dragIdx=parseInt(handle.dataset.drag);
    const row=getRows()[dragIdx];if(!row)return;
    startY=e.clientY;
    row.style.opacity='.4';
    ph=document.createElement('div');ph.className='drag-placeholder';
    ph.style.height=row.offsetHeight+'px';
    e.target.setPointerCapture(e.pointerId);
    list.addEventListener('pointermove',onMove);
    list.addEventListener('pointerup',onUp,{once:true});
    list.addEventListener('pointercancel',onUp,{once:true});
  });
  function onMove(e){
    if(dragIdx===null)return;
    const rows=getRows();const row=rows[dragIdx];if(!row)return;
    const dy=e.clientY-startY;
    row.style.transform=`translateY(${dy}px)`;row.style.position='relative';row.style.zIndex='10';
    // Find which slot we're hovering
    rows.forEach((r,i)=>{
      if(i===dragIdx)return;
      const rect=r.getBoundingClientRect();
      if(e.clientY>rect.top&&e.clientY<rect.bottom){overIdx=i;}
    });
  }
  function onUp(){
    list.removeEventListener('pointermove',onMove);
    const rows=getRows();const row=rows[dragIdx];
    if(row){row.style.opacity='';row.style.transform='';row.style.position='';row.style.zIndex='';}
    if(dragIdx!==null&&overIdx!==null&&dragIdx!==overIdx){
      const exs=r.exercises;const [moved]=exs.splice(dragIdx,1);exs.splice(overIdx,0,moved);
      save();
      rtnRerender(rid);
    }
    dragIdx=null;overIdx=null;
  }
}

function exportData(){

  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`lahwe-backup-${today()}.json`;

function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(typeof data!=='object'||(!data.workouts&&!data.routines))throw new Error('Invalid');
        S=data;
        if(!S.schedule)S.schedule={type:'weekly',weeklyDays:[1,2,4,5],cycleOn:2,cycleOff:1,cycleStart:today(),overrides:{},routineOverrides:{}};
        if(!S.schedule.routineOverrides)S.schedule.routineOverrides={};
        if(!S.meals)S.meals=[];
        if(!S.customFoods)S.customFoods=[];
        if(!S.savedMeals)S.savedMeals=[];
        if(!S.starredFoods)S.starredFoods=[];
        if(!S.recentFoods)S.recentFoods=[];
        if(!S.recentSavedMeals)S.recentSavedMeals=[];
        if(!S.foodCache)S.foodCache={};
        if(S.weightGoal===undefined)S.weightGoal=null;
        if(S.weightGoalDir===undefined)S.weightGoalDir=null;
        if(S.program===undefined)S.program=null;
        resolveProgramGroup();
        save();applyDark();
        document.getElementById('set-ov')?.remove();
        render();toast('Data imported!','green');
      }catch(err){toast('Invalid backup file');}
    };
    reader.readAsText(file);
  };
  inp.click();
}

function startCardDeck(){
  const suitIds=[...window._cdActiveSuits];
  for(const sid of suitIds){
    const sel=document.getElementById(`cd-ex-${sid}`);
    const val=(sel?.value||'').trim()||window._cdExMap[sid]||'';
    if(!val){toast(`Pick exercise for ${SUITS.find(s=>s.id===sid)?.label}`);return;}
    window._cdExMap[sid]=val;
  }
  const spr=Math.max(1,parseFloat(document.getElementById('cd-spr')?.value)||3);
  const buf=Math.max(0,parseInt(document.getElementById('cd-buf')?.value)||5);
  let deck=[];
  suitIds.forEach(sid=>{
    CARD_LABELS.forEach((lbl,i)=>{
      deck.push({suit:sid,label:lbl,value:CARD_VALUES[i],exId:window._cdExMap[sid]});
    });
  });
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  const repsByEx={};const cardsByEx={};
  suitIds.forEach(sid=>{const exId=window._cdExMap[sid];repsByEx[exId]=0;cardsByEx[exId]=[];});
  S.activeCardDeck={deck,cardIdx:0,startTime:Date.now(),secPerRep:spr,buffer:buf,
    suitMap:Object.fromEntries(suitIds.map(s=>[s,window._cdExMap[s]])),
    repsByEx,cardsByEx,_phaseStart:null,_phaseDur:null};
  save();dismissOv(document.getElementById('cd-setup-ov'));
  setTimeout(()=>{render();schedCDAutoFlip();},250);
}
function schedCDAutoFlip(){
  if(_cdTimer)clearTimeout(_cdTimer);
  if(window._cdCountInt)clearInterval(window._cdCountInt);
  const cd=S.activeCardDeck;if(!cd||cd.cardIdx>=cd.deck.length)return;
  const card=cd.deck[cd.cardIdx];
  const ms=Math.round((card.value*cd.secPerRep+cd.buffer)*1000);
  cd._phaseStart=Date.now();cd._phaseDur=ms;
  _cdTimer=setTimeout(()=>flipCard(true),ms);
  window._cdCountInt=setInterval(()=>{
    if(!S.activeCardDeck)return clearInterval(window._cdCountInt);
    const rem=Math.max(0,Math.ceil((ms-(Date.now()-cd._phaseStart))/1000));
    const el=document.getElementById('cd-countdown');if(el)el.textContent=fmtTimer(rem);
  },250);
}

  if(_cdTimer)clearTimeout(_cdTimer);

  cd.repsByEx[card.exId]=(cd.repsByEx[card.exId]||0)+card.value;
  if(!cd.cardsByEx[card.exId])cd.cardsByEx[card.exId]=[];
  cd.cardsByEx[card.exId].push(card.value);

  if(cd.cardIdx>=cd.deck.length){endCardDeck();return;}
  render();schedCDAutoFlip();

// SPRINT TIMER MODE
// ═══════════════════════════════════════════════════
let _sprintInt=null;

function showSprintSetup(){
  const ov=makeOv('sprint-setup-ov');
  ov.innerHTML=`<div class="modal"><div class="mh"></div>
    <div class="mt">Sprint Intervals</div>
    <div class="frow" style="gap:10px;margin-bottom:6px">
      <div style="flex:1"><label class="fl">Sprint (sec)</label><input type="number" inputmode="numeric" id="sp-sprint" value="60" min="5" max="600" placeholder="60"></div>
      <div style="flex:1"><label class="fl">Walk (sec)</label><input type="number" inputmode="numeric" id="sp-walk" value="120" min="5" max="600" placeholder="120"></div>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:18px;line-height:1.6">High beep = sprint. Low beep = walk. Keep your phone in your pocket — the audio cues fire through your headphones.</div>
    <button class="btn btp bfw" onclick="startSprintTimer()">Start</button>
    <button class="btn btg bfw" style="margin-top:8px" onclick="dismissOv(document.getElementById('sprint-setup-ov'))">Cancel</button>
  </div>`;
  document.body.appendChild(ov);attachSwipeDown(ov);
}
// One shared AudioContext for the whole app — creating a new one per beep
// leaks contexts (browsers cap ~6) and the cold-start glitches/pops.
let _audioCtx=null;
function getAudioCtx(){
  try{
    if(!_audioCtx)_audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(_audioCtx.state==='suspended')_audioCtx.resume();
    return _audioCtx;
  }catch(e){return null;}
}
// A single tone with a fast attack ramp + smooth decay. Starting the gain at
// full volume the instant the oscillator fires is what produced the click —
// ramping 0→peak over ~12ms removes it.
function _tone(freq,startOffset,dur,peak){
  const ctx=_audioCtx;if(!ctx)return;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine';o.frequency.value=freq;
  o.connect(g);g.connect(ctx.destination);
  const t=ctx.currentTime+startOffset;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t);o.stop(t+dur+0.03);
}
function playSprintBeep(type){
  const ctx=getAudioCtx();if(!ctx)return;
  if(type==='sprint'){_tone(880,0,0.16,0.4);_tone(880,0.22,0.16,0.4);}
  else{_tone(392,0,0.5,0.34);}
}
function startSprintTimer(){
  const sprintDur=Math.max(5,parseInt(document.getElementById('sp-sprint')?.value)||60);
  const walkDur=Math.max(5,parseInt(document.getElementById('sp-walk')?.value)||120);
  S.activeSprintTimer={sprintDur,walkDur,startTime:Date.now(),rounds:0,isSprintPhase:true,phaseStart:Date.now()};
  getAudioCtx(); // unlock audio within the user gesture so iOS will play cues
  save();dismissOv(document.getElementById('sprint-setup-ov'));
  setTimeout(()=>{render();startSprintLoop();playSprintBeep('sprint');},250);
}
function startSprintLoop(){
  if(_sprintInt)clearInterval(_sprintInt);
  _sprintInt=setInterval(()=>{
    const st=S.activeSprintTimer;if(!st){clearInterval(_sprintInt);return;}
    const dur=(st.isSprintPhase?st.sprintDur:st.walkDur)*1000;
    if(Date.now()-st.phaseStart>=dur){
      st.isSprintPhase=!st.isSprintPhase;
      if(st.isSprintPhase)st.rounds++;
      st.phaseStart=Date.now();save();
      playSprintBeep(st.isSprintPhase?'sprint':'walk');
      if(navigator.vibrate)navigator.vibrate(st.isSprintPhase?[150,80,150]:[300]);
    }
    updateSprintDisplay();
  },250);
}
function updateSprintDisplay(){
  const st=S.activeSprintTimer;if(!st)return;
  const phDur=(st.isSprintPhase?st.sprintDur:st.walkDur)*1000;
  const phRem=Math.max(0,Math.ceil((phDur-(Date.now()-st.phaseStart))/1000));
  const totalEl=Math.floor((Date.now()-st.startTime)/1000);
  const frac=Math.max(0,Math.min(1,(phDur-(Date.now()-st.phaseStart))/phDur));
  const circ=2*Math.PI*52;
  const offset=(circ*(1-frac)).toFixed(1);
  const phaseColor=st.isSprintPhase?'var(--red)':'var(--navy)';
  const el=id=>document.getElementById(id);
  if(el('sprint-phase')){el('sprint-phase').textContent=st.isSprintPhase?'SPRINT':'WALK';el('sprint-phase').style.color=phaseColor;}
  if(el('sprint-cd'))el('sprint-cd').textContent=fmtTimer(phRem);
  if(el('sprint-total'))el('sprint-total').textContent=fmtTimer(totalEl);
  if(el('sprint-rounds'))el('sprint-rounds').textContent=st.rounds;
  if(el('sprint-ring')){el('sprint-ring').style.strokeDashoffset=offset;el('sprint-ring').style.stroke=phaseColor;}
}
function renderSprintSession(c){
  const st=S.activeSprintTimer;if(!st)return;
  const phDur=(st.isSprintPhase?st.sprintDur:st.walkDur)*1000;
  const phRem=Math.max(0,Math.ceil((phDur-(Date.now()-st.phaseStart))/1000));
  const totalEl=Math.floor((Date.now()-st.startTime)/1000);
  const frac=Math.max(0,Math.min(1,(phDur-(Date.now()-st.phaseStart))/phDur));
  const circ=2*Math.PI*52;
  const offset=(circ*(1-frac)).toFixed(1);
  const phaseColor=st.isSprintPhase?'var(--red)':'var(--navy)';
  c.innerHTML=`<div class="fbar">
      <div class="fbar-name">Sprint Intervals</div>
      <span id="sprint-total" class="wt">${fmtTimer(totalEl)}</span>
      <button class="btn btd bsm" onclick="stopSprintTimer()">Stop</button>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 24px;gap:8px">
      <div id="sprint-phase" style="font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:${phaseColor};margin-bottom:16px">${st.isSprintPhase?'SPRINT':'WALK'}</div>
      <div style="position:relative;width:144px;height:144px;margin-bottom:24px">
        <svg width="144" height="144" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" stroke-width="6"/>
          <circle id="sprint-ring" cx="60" cy="60" r="52" fill="none" stroke="${phaseColor}" stroke-width="6"
            stroke-linecap="round" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset}"
            transform="rotate(-90 60 60)" style="transition:stroke-dashoffset .25s linear,stroke .2s"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
          <div id="sprint-cd" class="mono" style="font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1">${fmtTimer(phRem)}</div>
        </div>
      </div>
      <div style="display:flex;gap:48px;text-align:center;align-items:flex-start">
        <div>
          <div id="sprint-rounds" class="mono" style="font-size:36px;font-weight:600;line-height:1">${st.rounds}</div>
          <div style="font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:6px">Rounds Done</div>
        </div>
        <div style="width:1px;background:var(--border);height:48px;margin-top:4px"></div>
        <div>
          <div class="mono" style="font-size:18px;font-weight:600;line-height:1;color:var(--muted)">${st.sprintDur}s<span style="color:var(--muted2);font-size:14px"> / </span>${st.walkDur}s</div>
          <div style="font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:6px">Sprint / Walk</div>
        </div>
      </div>
    </div>`;
  startSprintLoop();
}
function stopSprintTimer(){
  if(_sprintInt)clearInterval(_sprintInt);_sprintInt=null;
  const st=S.activeSprintTimer;if(!st)return;
  const dur=Date.now()-st.startTime;
  const act={id:uid(),type:'sprint',date:today(),
    dur:Math.max(1,Math.round(dur/60000)),
    notes:`${st.rounds} rounds · ${st.sprintDur}s sprint / ${st.walkDur}s walk`,
    rounds:st.rounds,sprintDur:st.sprintDur,walkDur:st.walkDur,
    cals:Math.round(9*bwKg()*(dur/3600000))};
  S.activities.unshift(act);
  const snapshot={rounds:st.rounds,dur,sprintDur:st.sprintDur,walkDur:st.walkDur,cals:act.cals};
  S.activeSprintTimer=null;save();
  render();setTimeout(()=>showSprintSummary(snapshot),120);
}
function showSprintSummary(snap){
  const ov=makeOv('sp-sum-ov');
  ov.innerHTML=`<div class="modal"><div class="mh"></div>
    <div style="font-size:30px;text-align:center;margin-bottom:6px">⚡</div>
    <div class="mt" style="text-align:center">Session Complete</div>
    <div class="sgrid" style="border-radius:10px;overflow:hidden;border:1px solid var(--border);margin-bottom:14px">
      <div class="sc"><div class="sv">${snap.rounds}</div><div class="slb">Rounds</div></div>
      <div class="sc"><div class="sv">${fmtDur(snap.dur)}</div><div class="slb">Duration</div></div>
      <div class="sc"><div class="sv">${snap.sprintDur}s</div><div class="slb">Sprint</div></div>
      <div class="sc"><div class="sv">${snap.cals}</div><div class="slb">~kcal</div></div>
    </div>
    <button class="btn btp bfw" onclick="dismissOv(document.getElementById('sp-sum-ov'))">Done</button>
  </div>`;
  document.body.appendChild(ov);attachSwipeDown(ov);
}

// ═══════════════════════════════════════════════════
// PWA + INIT
// ═══════════════════════════════════════════════════
window.addEventListener('load',()=>{
  initState();load();
  // Ensure nav is visible if onboarded
  if(S.onboarded){document.getElementById('nav').style.display='flex';}else{document.getElementById('nav').style.display='none';}
  go(S.tab||'workout');
  // Resume active timers after reload
  if(S.activeSprintTimer)startSprintLoop();
  if(S.activeCardDeck)schedCDAutoFlip();
});
window.addEventListener('resize',()=>{
  if(S.tab==='progress'&&Object.values(S.expandedCards).some(Boolean)){setTimeout(()=>renderCharts(),100);}
});
</script>
