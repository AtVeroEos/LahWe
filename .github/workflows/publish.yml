# Checks every push and pull request (unit tests and browser tests); on main, and only when both
# pass, publishes dist/ to the gh-pages branch,
# which GitHub Pages serves at https://atveroeos.github.io/LahWe/
name: Check and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build
        run: node build.js
      - name: No credentials in the repository or the build
        run: node tools/check-secrets.js
      - name: Unit tests
        run: node --test test/unit/*.test.js
      - name: The committed build matches the source
        run: git diff --exit-code -- dist || (echo "dist/ is out of date - run 'npm run build' and commit the result" && exit 1)

  # The app in a real (headless) browser at iPhone size: every screen, the swipe card, the keyboard,
  # settings, upgrading old saves, hosting under a sub-path, the scanner, and the security walk (hostile
  # names, the content policy, no requests to unlisted hosts). A page that throws or a
  # flow that breaks stops the publish, not just a failing calculation.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright and Chromium
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Build
        run: node build.js
      - name: Browser tests
        env:
          TZ: America/New_York
        run: |
          node test/e2e/smoke.js
          node test/e2e/upgrade.js
          node test/e2e/subpath.js
          node test/e2e/scanner.js
          node test/e2e/settings.js
          node test/e2e/keyboard.js
          node test/e2e/swipe.js
          node test/e2e/security.js
          node test/e2e/flows.js
      - name: Screenshots when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test/e2e/out/*.png
          retention-days: 7

  # The same browser suites in WebKit, the engine every iPhone browser and the Capacitor app's WebView use,
  # on macOS (the closest WebKit build to Safari's). Not yet a gate on publishing: it reports, and becomes
  # one once it is green.
  webkit:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright and WebKit
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0 && npx playwright install webkit
      - name: Build
        run: node build.js
      - name: Browser tests in WebKit
        env:
          TZ: America/New_York
          LW_ENGINE: webkit
        run: node tools/run-e2e.js
      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-e2e
          path: |
            test/e2e/out/*.png
            test/e2e/out/*.log
          retention-days: 14

  # The app in real Mobile Safari on a simulated iPhone (Xcode's iOS Simulator on the macOS runner):
  # every tab and the main sheets, storage, the share sheet and service worker as iOS has them, and the
  # data coming back after Safari is quit. Screenshots of each screen are uploaded. Reports only for now.
  ios-safari:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build
        run: node build.js
      - name: Simulators available
        run: xcrun simctl list devices available | grep -E "iPhone|-- iOS" | head -20
      - name: Mobile Safari walk-through
        run: node tools/ios-probe/run.js
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-safari
          path: test/e2e/out/ios/
          retention-days: 14

  publish:
    needs: [check, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build
        run: node build.js
      - name: Publish dist/ to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
