// ─── Calendar ───
function groupName(gid){return esc(((S.groups||[]).find(g=>g.id===gid)||{}).name||'(deleted group)');} // returns escaped text
function programBanner(){
  const p=S.program;
  if(!p||!p.active||!p.phases||!p.phases.length){
    return`<div style="padding:9px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:12px;color:var(--muted)">No timed program running</div>
      <button class="btn bts bxs" onclick="showProgramEditor()">Set Up Program</button>
    </div>`;
  }
  const wins=programPhaseWindows();
  const td=today();
  const phase=currentProgramPhase(td);
  const lastEnd=wins.length?wins[wins.length-1].end:td;
  const ended=td>=lastEnd;
  let body;
  if(ended){
    body=`<div style="font-size:13px;font-weight:600;color:var(--muted)">Program complete</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">Ended ${fmtDay(lastEnd)}</div>`;
  }else if(phase){
    const idx=wins.indexOf(phase);
    const daysLeft=daysBetween(td,phase.end);
    const total=daysBetween(phase.start,phase.end);
    const dayIn=total-daysLeft;
    const pct=Math.min(100,Math.round((dayIn/total)*100));
    const nextPhase=wins[idx+1];
    body=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
        <div style="font-size:13px;font-weight:600">Phase ${idx+1}/${wins.length}: ${groupName(phase.groupId)}</div>
        <div style="font-size:11px;color:var(--muted)">${daysLeft}d left</div>
      </div>
      <div style="height:5px;background:var(--border);border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--navy)"></div></div>
      <div style="font-size:10px;color:var(--muted);margin-top:4px">${fmtDay(phase.start)} → ${fmtDay(addDays(phase.end,-1))}${nextPhase?` · next: ${groupName(nextPhase.groupId)}`:' · final phase'}</div>`;
  }else{
    // Program starts in the future
    const firstStart=wins[0].start;
    body=`<div style="font-size:13px;font-weight:600">Program starts ${fmtDay(firstStart)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">${wins.length} phases queued</div>`;
  }
  return`<div style="padding:11px 13px;border-bottom:1px solid var(--border);background:var(--ndim)">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
      <div style="flex:1">${body}</div>
      <button class="btn btg bxs" onclick="showProgramEditor()" style="flex-shrink:0">Edit</button>
    </div>
  </div>`;
}
let _progDraft=null;
function showProgramEditor(){
  // Load existing program into a draft, or start a fresh one
  _progDraft=S.program?JSON.parse(JSON.stringify(S.program)):{active:true,startDate:today(),phases:[]};
  if(!_progDraft.startDate)_progDraft.startDate=today();
  if(!_progDraft.phases)_progDraft.phases=[];
  renderProgramEditor();
}
function renderProgramEditor(){
  let ov=document.getElementById('prog-ov');
  if(!ov){ov=makeOv('prog-ov');document.body.appendChild(ov);attachSwipeDown(ov);}
  const groups=S.groups||[];
  if(!groups.length){
    ov.innerHTML=`<div class="modal"><div class="mh"></div><div class="mt">Timed Program</div>
      <div class="empty" style="padding:24px"><div style="font-size:30px;margin-bottom:8px">📋</div><div class="etit" style="font-size:14px">No groups yet</div><p style="font-size:12px">Create routine groups first, then chain them into a timed program.</p></div>
      <button class="btn btg bfw" style="margin-top:9px" onclick="closeOv('prog-ov')">Close</button></div>`;
    return;
  }
  const wins=programPhaseWindows(_progDraft);
  let phaseRows='';
  _progDraft.phases.forEach((ph,i)=>{
    const win=wins[i];
    const dateLbl=win?`${fmtDay(win.start)} → ${fmtDay(addDays(win.end,-1))}`:'';
    phaseRows+=`<div style="border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px">
        <div style="font-size:12px;font-weight:700;color:var(--muted)">PHASE ${i+1}</div>
        <div style="display:flex;gap:4px">
          <button class="ib" style="font-size:13px" onclick="moveProgPhase(${i},-1)">↑</button>
          <button class="ib" style="font-size:13px" onclick="moveProgPhase(${i},1)">↓</button>
          <button class="ib delbtn" style="font-size:11px" onclick="removeProgPhase(${i})">✕</button>
        </div>
      </div>
      <select onchange="setProgPhaseGroup(${i},this.value)" style="margin-bottom:7px">
        ${groups.map(g=>`<option value="${esc(g.id)}"${ph.groupId===g.id?' selected':''}>${esc(g.name)}</option>`).join('')}
      </select>
      <div style="display:flex;gap:6px;margin-bottom:7px">
        <button class="chip${ph.mode!=='until'?' on':''}" onclick="setProgPhaseMode(${i},'weeks')">For X weeks</button>
        <button class="chip${ph.mode==='until'?' on':''}" onclick="setProgPhaseMode(${i},'until')">Until date</button>
      </div>
      ${ph.mode==='until'
        ?`<input type="date" value="${ph.untilDate||''}" onchange="setProgPhaseUntil(${i},this.value)">`
        :`<div style="display:flex;align-items:center;gap:8px">
            <button class="btn bts bsm" onclick="adjProgWeeks(${i},-1)" style="width:36px">−</button>
            <div class="mono" style="font-size:15px;font-weight:600;width:64px;text-align:center">${ph.weeks||1} wk${(ph.weeks||1)>1?'s':''}</div>
            <button class="btn bts bsm" onclick="adjProgWeeks(${i},1)" style="width:36px">+</button>
          </div>`}
      ${dateLbl?`<div style="font-size:10px;color:var(--muted);margin-top:6px">${dateLbl}</div>`:''}
    </div>`;
  });
  ov.innerHTML=`<div class="modal" style="max-height:90vh;overflow-y:auto"><div class="mh"></div>
    <div class="mt">Timed Program</div>
    <div style="font-size:11px;color:var(--muted);margin:-8px 0 12px">Chain groups into phases. Each phase auto-activates its group for the set duration, then the next phase takes over.</div>
    <div class="fg"><label class="fl">Program Start</label><input type="date" id="prog-start" value="${_progDraft.startDate}" onchange="setProgStart(this.value)"></div>
    ${phaseRows||'<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px">No phases yet — add one below.</div>'}
    <button class="btn bts bfw" style="margin-top:4px" onclick="addProgPhase()">+ Add Phase</button>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btp" style="flex:1" onclick="saveProgram()">Save Program</button>
      ${S.program?`<button class="btn btd bsm" onclick="clearProgram()">Stop</button>`:''}
    </div>
    <button class="btn btg bfw" style="margin-top:7px" onclick="closeOv('prog-ov')">Cancel</button>
  </div>`;
}
function setProgStart(v){if(v)_progDraft.startDate=v;renderProgramEditor();}
function addProgPhase(){
  const firstGroup=(S.groups||[])[0];
  _progDraft.phases.push({groupId:firstGroup?firstGroup.id:null,mode:'weeks',weeks:4,untilDate:''});
  renderProgramEditor();
}
function removeProgPhase(i){_progDraft.phases.splice(i,1);renderProgramEditor();}
function moveProgPhase(i,dir){const j=i+dir;if(j<0||j>=_progDraft.phases.length)return;const p=_progDraft.phases;[p[i],p[j]]=[p[j],p[i]];renderProgramEditor();}
function setProgPhaseGroup(i,gid){_progDraft.phases[i].groupId=gid;renderProgramEditor();}
function setProgPhaseMode(i,m){_progDraft.phases[i].mode=m;if(m==='weeks'&&!_progDraft.phases[i].weeks)_progDraft.phases[i].weeks=4;renderProgramEditor();}
function setProgPhaseUntil(i,v){_progDraft.phases[i].untilDate=v;renderProgramEditor();}
function adjProgWeeks(i,d){_progDraft.phases[i].weeks=Math.max(1,(_progDraft.phases[i].weeks||1)+d);renderProgramEditor();}
function saveProgram(){
  if(!_progDraft.phases.length){toast('Add at least one phase');return;}
  if(_progDraft.phases.some(p=>!p.groupId)){toast('Every phase needs a group');return;}
  if(_progDraft.phases.some(p=>p.mode==='until'&&!p.untilDate)){toast('Set a date for each "until" phase');return;}
  _progDraft.active=true;
  S.program=_progDraft;
  resolveProgramGroup();
  save();closeOv('prog-ov');
  toast('Program saved','green');
  renderHistory(document.getElementById("content"));
}
function clearProgram(){
  customConfirm('Stop the timed program? Groups stay; they just stop auto-switching.','Stop',()=>{
    S.program=null;save();closeOv('prog-ov');
    toast('Program stopped','green');renderHistory(document.getElementById("content"));
  });
}
function renderCalendar(){
  const yr=S.calYear,mo=S.calMonth;
  const first=new Date(yr,mo,1).getDay();const days=new Date(yr,mo+1,0).getDate();
  const wkMap={};
  S.workouts.forEach(w=>{const ds=dayOf(w.started);if(!wkMap[ds])wkMap[ds]={w:0,a:0};wkMap[ds].w++;});
  S.activities.forEach(a=>{if(!wkMap[a.date])wkMap[a.date]={w:0,a:0};wkMap[a.date].a++;});
  const td=today();const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const calGoal=(S.macroGoals||{}).cals||0;
  // Planned routine dots for future days
  const routineDays={};
  (S.routines||[]).forEach(r=>{(r.days||[]).forEach(d=>{if(!routineDays[d])routineDays[d]=[];routineDays[d].push(r.name);});});

  let html=programBanner();
  html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--border)">
    <button class="btn btg bsm" onclick="adjCal(-1)">‹</button>
    <div style="font-size:15px;font-weight:600;letter-spacing:-.01em">${months[mo]} ${yr}</div>
    <button class="btn btg bsm" onclick="adjCal(1)">›</button>
  </div>
  <div class="cal-grid">
    ${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="cal-day-hdr">${d}</div>`).join('')}`;
  for(let i=0;i<first;i++)html+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=days;d++){

    const dow=dayDate(ds).getDay();const hasPlanned=((routineDays[dow]?.length>0)||plannedRoutinesForDow(dow).length>0)&&ds>=td&&!isRest;
    const ovRid=S.schedule.routineOverrides&&S.schedule.routineOverrides[ds];
    const hasRoutineOverride=ovRid&&ovRid!=='rest';
    const isRestOverride=ovRid==='rest';
    // Calorie goal indicator
    let goalTri='';

      const dayCals=getDayTotals(ds).cals||0;

      </div>
    </div>`;
  }
  html+=`</div>
  <div style="padding:10px 13px;display:flex;gap:14px;font-size:10px;font-weight:600;color:var(--muted)">
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--navy);margin-right:4px"></span>Workout</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:4px"></span>Activity</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:transparent;border:1px solid var(--navy);margin-right:4px"></span>Planned</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--border);margin-right:4px"></span>Rest</span>
  </div>
  ${calGoal?`<div style="padding:0 13px 10px;display:flex;gap:14px;font-size:10px;font-weight:600;color:var(--muted)">
    <span><span style="display:inline-block;width:8px;height:8px;background:var(--green);margin-right:4px"></span>On goal</span>
    <span><span style="display:inline-block;width:8px;height:8px;background:var(--navy);margin-right:4px"></span>Under</span>
    <span><span style="display:inline-block;width:8px;height:8px;background:var(--red);margin-right:4px"></span>Over</span>
  </div>`:''}`;
  return html;
}

function renderProgress(c){
  const gl=S.goal||'general';
  // Open this goal's key cards the first time it's viewed; respect manual changes thereafter.
  if(!S.progSeeded)S.progSeeded={};
  if(!S.progSeeded[gl]){(GOAL_OPEN[gl]||[]).forEach(id=>{S.expandedCards[id]=true;});S.progSeeded[gl]=true;save();}
  const order=GOAL_ORDER[gl]||GOAL_ORDER.general;
  const sorted=order.map(id=>DASH_CARDS.find(d=>d.id===id)).filter(Boolean);
  let html=`<div class="ph"><div class="page-title">Progress</div></div>`;
  sorted.forEach(card=>{
    const open=S.expandedCards[card.id];const sub=getDashSub(card.id);
    html+=`<div class="dash-card"><div class="dash-hdr" onclick="toggleCard('${card.id}')">
      <div class="dash-icon">${ICON(card.icon,18)}</div>
      <div class="dash-info"><div class="dash-title">${card.title}</div>${sub?`<div class="dash-sub">${sub}</div>`:''}</div>
      <div class="dash-chev${open?' open':''}">›</div>
    </div>${open?`<div class="dash-body" id="card-${card.id}">${getDashBody(card.id)}</div>`:''}</div>`;
  });
  c.innerHTML=html;if(Object.values(S.expandedCards).some(Boolean))setTimeout(()=>{try{renderCharts();}catch(e){logError(e,'charts');}},60);
}
function toggleCard(id){S.expandedCards[id]=!S.expandedCards[id];renderProgress(document.getElementById('content'));}
function getDashSub(id){
  if(id==='energy'){const eb=energyBalance(today());const net=eb.net;return`${net<=0?'−':'+'}${Math.abs(Math.round(net)).toLocaleString()} kcal so far today`;}
  if(id==='weekly'){const n=S.workouts.filter(w=>w.started>=Date.now()-7*86400000).length;return`${n} session${n!==1?'s':''} this week`;}
  if(id==='strength'){const n=getExsWithHist().length;return n?`${n} exercise${n===1?'':'s'} tracked`:'No history yet';}
  if(id==='prs'){const n=Object.keys(S.prs).length;return n?`${n} PR${n!==1?'s':''} recorded`:'None yet';}
  if(id==='volume'){const n=S.workouts.filter(w=>w.started>=Date.now()-7*86400000).reduce((t,wk)=>t+doneSetCnt(wk),0);return`${n} sets this week`;}
  if(id==='bodyweight'){const bwl=S.bodyweightLog||[];return bwl.length?`${bwl[0].weight}${S.unit} current`:'No logs yet';}
  if(id==='measurements'){const m=S.measurements||[];return m.length?`Last: ${fmtDay(m[0].date)}`:'No measurements yet';}
  if(id==='standards'){const lvs=getStdLevels();const p=lvs.filter(l=>l.level>0).length;return p?`${p}/${lvs.length} graded`:'No lift data yet';}
  if(id==='aft'){const a=aftSummary(S.aftCurrent);if(!a.n)return'No scores entered';return a.complete?`${a.total} / 500 · ${a.pass?'pass':'below standard'}`:`${a.total} pts from ${a.n}/5 events`;}
  if(id==='consistency'){const n=getStreak();return`${n}-session streak`;}
  if(id==='recovery'){const{warnings}=getRecoveryData();return warnings.length?`⚠ ${warnings.length} muscle${warnings.length>1?'s':''} at risk`:'Fatigue normal';}
  if(id==='rucking'){const n=S.activities.filter(a=>['ruck','run','hike','bike','swim','walk'].includes(a.type)).length;return n?`${n} cardio sessions`:'None logged';}
  if(id==='wilks'){const w=getWilksData();return w?`Wilks ${w.wilks} · DOTS ${w.dots}`:'Need squat, bench, deadlift PRs';}
  return'';
}
function getDashBody(id){

  if(id==='prs')return renderPRsBody();if(id==='volume')return renderVolumeBody();

// Time events are entered as minutes + seconds and stored as seconds.
function aftTimeInputs(kind,ev,val){
  const v=parseFloat(val);const has=!isNaN(v)&&val!=='';
  const m=has?Math.floor(v/60):'';const s=has?Math.round(v%60):'';
  return`<div class="aft-time"><input type="number" inputmode="numeric" id="aft-${kind}-${ev}-m" value="${m}" placeholder="min" onchange="setAftTime('${kind}','${ev}')"><span>:</span><input type="number" inputmode="numeric" id="aft-${kind}-${ev}-s" value="${has?pad2(s):''}" placeholder="sec" onchange="setAftTime('${kind}','${ev}')"></div>`;
}
function aftEventMeta(e,col){
  const lo=aftNeed(e.id,60,col),hi=aftNeed(e.id,100,col);
  return`${e.desc} · 60 pts: ${aftFmtRaw(e.id,lo)} · 100 pts: ${aftFmtRaw(e.id,hi)}`;
}
function aftVerdictHTML(a){
  if(!a.n)return'Enter your results below';
  if(!a.complete)return`${a.n}/5 events entered`;
  if(a.pass)return`<strong>PASS</strong> · needs ${a.need} total and 60 in every event`;
  const why=a.minEv<60?'an event is under 60':`total is under ${a.need}`;
  return`<strong>BELOW STANDARD</strong> · ${why}`;
}
function renderAFTBody(){
  const gn=S.aftGender||'male';const combat=aftIsCombat();const col=aftColumn();
  const a=aftSummary(S.aftCurrent,col);
  const tog=(on,label,js)=>`<button class="btn ${on?'btp':'bts'} bsm" onclick="${js}">${label}</button>`;
  let html=`<div class="aft-total"><div style="font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-bottom:6px">Total Score</div>
    <div style="font-size:40px;font-weight:500;font-family:var(--mono);line-height:1"><span id="aft-total">${a.n?a.total:'–'}</span><span style="font-size:15px;opacity:.55"> / 500</span></div>
    <div id="aft-verdict" style="font-size:12px;opacity:.85;margin-top:6px">${aftVerdictHTML(a)}</div>
    <div style="font-size:11px;opacity:.6;margin-top:4px">${combat?'Combat standard (sex-neutral)':(gn==='male'?'Male':'Female')} · age group ${aftAgeBracket()} (age ${userAge()})</div>
  </div>
  <div style="padding:8px 13px 4px;display:grid;grid-template-columns:1fr 1fr;gap:7px">
    ${tog(!combat,'General · 300',"setAftStandard('general')")}${tog(combat,'Combat · 350',"setAftStandard('combat')")}
    ${combat?'':tog(gn==='male','Male',"setAftGender('male')")+tog(gn==='female','Female',"setAftGender('female')")}
  </div>
  <div style="padding:2px 13px 8px;font-size:10px;color:var(--muted);line-height:1.45">${combat?'The combat standard applies to the designated combat MOSs. It is scored on one table for everyone and needs 350 total with 60 in each event.':'The general standard is scored by age and sex and needs 300 total with 60 in each event.'} Age group comes from your birthday in Settings.</div>`;
  AFT_EVENTS.forEach(e=>{
    const sc=a.scores[e.id];const gsc=aftScore(e.id,S.aftGoals[e.id],col);
    const time=e.unit==='time';
    html+=`<div class="aft-row"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px"><div style="font-size:13px;font-weight:600">${e.name}</div><div class="mono" style="font-size:13px;font-weight:600;color:var(--navy)"><span id="aft-pts-${e.id}">${sc==null?'–':sc}</span> pts</div></div>
      <div class="aft-bar-track"><div class="aft-bar-fill" id="aft-bar-${e.id}" style="width:${sc||0}%;background:${sc==null?'transparent':sc>=60?'var(--green)':'var(--red)'}"></div><div class="aft-bar-min"></div>${gsc?`<div class="aft-bar-goal" style="left:${gsc}%"></div>`:''}</div>
      <div style="display:flex;gap:10px;margin-top:7px">
        <div style="flex:1"><div class="rtn-lbl" style="margin-bottom:3px">Current${time?'':` (${e.unit})`}</div>${time?aftTimeInputs('cur',e.id,S.aftCurrent[e.id]):`<input type="number" inputmode="decimal" value="${esc(S.aftCurrent[e.id]||'')}" placeholder="–" class="aft-inp" onchange="setAftVal('cur','${e.id}',this.value)">`}</div>
        <div style="flex:1"><div class="rtn-lbl" style="margin-bottom:3px">Goal${time?'':` (${e.unit})`}</div>${time?aftTimeInputs('goal',e.id,S.aftGoals[e.id]):`<input type="number" inputmode="decimal" value="${esc(S.aftGoals[e.id]||'')}" placeholder="–" class="aft-inp" onchange="setAftVal('goal','${e.id}',this.value)">`}</div>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-top:5px">${aftEventMeta(e,col)}</div>
    </div>`;
  });
  html+=`<div style="padding:10px 13px;display:flex;gap:8px"><button class="btn btp bsm" onclick="saveAFTHistory()">Save Snapshot</button>${S.aftHistory.length?`<button class="btn bts bsm" onclick="showAFTHistory()">History</button>`:''}</div>
  <div style="padding:0 13px 10px;font-size:10px;color:var(--muted2);line-height:1.45">Scored from the Army's AFT score tables (effective 1 June 2025). A result between two rows earns the lower row.</div>`;
  return html;
}
function setAftStandard(v){S.aftStandard=v;save();renderProgress(document.getElementById('content'));}
function setAftGender(v){S.aftGender=v;save();renderProgress(document.getElementById('content'));}
function setAftVal(kind,ev,v){(kind==='goal'?S.aftGoals:S.aftCurrent)[ev]=v;save();refreshAft();}
function setAftTime(kind,ev){
  const m=document.getElementById(`aft-${kind}-${ev}-m`)?.value,s=document.getElementById(`aft-${kind}-${ev}-s`)?.value;
  const blank=(m===''||m==null)&&(s===''||s==null);
  setAftVal(kind,ev,blank?'':String((parseInt(m)||0)*60+(parseInt(s)||0)));
}
// Update the scores in place so typing in the next field isn't interrupted by a redraw.
function refreshAft(){
  const a=aftSummary(S.aftCurrent);
  AFT_EVENTS.forEach(e=>{
    const sc=a.scores[e.id];
    const p=document.getElementById('aft-pts-'+e.id);if(p)p.textContent=sc==null?'–':sc;
    const b=document.getElementById('aft-bar-'+e.id);if(b){b.style.width=(sc||0)+'%';b.style.background=sc==null?'transparent':sc>=60?'var(--green)':'var(--red)';}
  });
  const t=document.getElementById('aft-total');if(t)t.textContent=a.n?a.total:'–';
  const v=document.getElementById('aft-verdict');if(v)v.innerHTML=aftVerdictHTML(a);
}
function saveAFTHistory(){
  const col=aftColumn();const a=aftSummary(S.aftCurrent,col);
  if(!a.n){toast('Enter at least one result');return;}
  S.aftHistory=[{date:today(),scores:Object.assign({},S.aftCurrent),pts:a.scores,total:a.total,complete:a.complete,pass:a.pass,std:aftIsCombat()?'combat':'general',col},...(S.aftHistory||[])];
  save();toast('Snapshot saved!','green');renderProgress(document.getElementById('content'));
}
function showAFTHistory(){
  const ov=makeOv('afth-ov');
  ov.innerHTML=`<div class="modal" style="max-height:75vh"><div class="mh"></div><div class="mt">AFT History</div>${S.aftHistory.map(h=>{
    // Snapshots saved before the official tables were added are re-scored from their raw results.
    const a=h.pts?{total:h.total,complete:h.complete,pass:h.pass,scores:h.pts}:aftSummary(h.scores||{});
    return`<div style="padding:10px 0;border-bottom:1px solid var(--border)"><div style="display:flex;justify-content:space-between"><div style="font-size:13px;font-weight:600">${fmtDay(h.date)}${h.std==='combat'?' · combat':''}</div><div class="mono" style="font-size:13px;font-weight:600;color:${a.complete?(a.pass?'var(--green)':'var(--red)'):'var(--navy)'}">${a.total}${a.complete?' / 500':' pts'}</div></div><div style="font-size:10px;color:var(--muted);margin-top:3px">${AFT_EVENTS.map(e=>`${e.id} ${aftFmtRaw(e.id,(h.scores||{})[e.id])}${a.scores&&a.scores[e.id]!=null?` (${a.scores[e.id]})`:''}`).join(' · ')}</div></div>`;}).join('')}<button class="btn btg bfw" style="margin-top:12px" onclick="closeOv('afth-ov')">Close</button></div>`;
  document.body.appendChild(ov);attachSwipeDown(ov);
}
function renderConsistencyBody(){return`<div style="padding:10px 13px 4px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)"><span>12-Week Activity</span><span>Streak: ${getStreak()} session${getStreak()===1?'':'s'}</span></div><div style="font-size:10px;color:var(--muted2);margin-top:4px">${hasFixedSchedule()?'Counts training days in a row without missing a planned one. Rest days don’t break it.':'Counts training days with no more than two idle days between them.'}</div></div><div class="chart-wrap"><canvas id="ch-cons"></canvas></div>`;}
function renderConsistencyChart(){const data=getWeeklyActivity(12);mkChart('ch-cons',{type:'bar',data:{labels:Array.from({length:12},(_,i)=>`W-${11-i}`),datasets:[{data,backgroundColor:data.map(v=>v>0?cv('--ndim'):'transparent'),borderColor:data.map(v=>v>0?cv('--navy'):cv('--border')),borderWidth:1.5,borderRadius:4}]},options:{...baseOpts(),scales:{x:{ticks:{color:cv('--muted'),font:{size:9}},grid:{display:false}},y:{ticks:{color:cv('--muted'),font:{size:10},stepSize:1},grid:{color:cv('--border')},beginAtZero:true}}}});}
function renderRuckingBody(){const acts=S.activities.filter(a=>['ruck','run','hike','walk','bike','swim'].includes(a.type)).slice(0,10);if(!acts.length)return`<div class="empty" style="padding:24px"><div style="margin-bottom:9px;color:var(--muted2)">${ICON('backpack',30)}</div><div class="etit" style="font-size:14px">No cardio logged</div></div>`;const totalMi=acts.filter(a=>a.dist).reduce((t,a)=>t+(parseFloat(a.dist)||0),0);const totalCal=acts.reduce((t,a)=>t+(a.cals||0),0);return`<div class="sgrid"><div class="sc"><div class="sv">${acts.length}</div><div class="slb">Sessions</div></div><div class="sc"><div class="sv">${totalMi.toFixed(1)}</div><div class="slb">Miles</div></div><div class="sc"><div class="sv">${totalCal.toLocaleString()}</div><div class="slb">~kcal</div></div><div class="sc"><div class="sv">${acts.filter(a=>a.type==='ruck').length}</div><div class="slb">Rucks</div></div></div><div class="chart-wrap"><canvas id="ch-ruck"></canvas></div><div>${acts.map(a=>{const t=ACT_TYPES.find(x=>x.id===a.type)||{icon:'⚡',label:'Activity'};return`<div class="mvrow"><div class="act-icon" style="width:26px;height:26px;margin-right:9px;font-size:13px;color:var(--muted)">${ICON(t.icon,14)}</div><div class="mvname">${t.label}${a.dist?` · ${a.dist}mi`:''} · ${a.dur||'?'}min</div><div class="mono" style="font-size:11px;color:var(--muted)">${a.cals||0}kcal</div></div>`;}).join('')}</div>`;}
function renderRuckingChart(){const acts=S.activities.filter(a=>['ruck','run','hike','walk','bike','swim'].includes(a.type)).slice(0,8).reverse();if(acts.length<2)return;mkChart('ch-ruck',{type:'bar',data:{labels:acts.map(a=>fmtDay(a.date)),datasets:[{data:acts.map(a=>a.cals||0),backgroundColor:cv('--ndim'),borderColor:cv('--navy'),borderWidth:1.5,borderRadius:4}]},options:{...baseOpts(),plugins:{legend:{display:false}},scales:{x:{ticks:{color:cv('--muted'),font:{size:9}},grid:{display:false}},y:{ticks:{color:cv('--muted'),font:{size:10}},grid:{color:cv('--border')},beginAtZero:true}}}});}

function findFood(id){
  return QUICK_FOODS.find(f=>f.id===id)||(S.customFoods||[]).find(f=>f.id===id)||null;
}
function allFoods(){return[...QUICK_FOODS,...(S.customFoods||[])];}
// Every word typed must appear in the name ("chicken grilled" finds "Grilled Chicken Breast").
// Names that START with the query rank first.
function searchFoods(q){
  const words=String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
  if(!words.length)return[];
  const lc=words.join(' ');
  return allFoods().map(f=>({f,n:String(f.name||'').toLowerCase()}))
    .filter(x=>words.every(w=>x.n.includes(w)))
    .sort((a,b)=>(b.n.startsWith(lc)-a.n.startsWith(lc))||(a.n.length-b.n.length))
    .slice(0,25).map(x=>x.f);
}
function getStarredFoods(){return(S.starredFoods||[]).map(findFood).filter(Boolean);}
function getRecentFoods(){return(S.recentFoods||[]).map(findFood).filter(Boolean).slice(0,20);}
function toggleStar(id){
  if(!S.starredFoods)S.starredFoods=[];
  const idx=S.starredFoods.indexOf(id);
  if(idx>=0)S.starredFoods.splice(idx,1);else S.starredFoods.push(id);
  save();
}
function isStarred(id){return(S.starredFoods||[]).includes(id);}
function trackRecent(id){
  if(!S.recentFoods)S.recentFoods=[];
  S.recentFoods=S.recentFoods.filter(x=>x!==id);
  S.recentFoods.unshift(id);
  if(S.recentFoods.length>30)S.recentFoods.length=30;
}
function trackRecentMeal(savedMealId){
  if(!S.recentSavedMeals)S.recentSavedMeals=[];
  S.recentSavedMeals=S.recentSavedMeals.filter(x=>x!==savedMealId);
  S.recentSavedMeals.unshift(savedMealId);
  if(S.recentSavedMeals.length>15)S.recentSavedMeals.length=15;
}

function dayHasIntake(ds){
  const t=getDayTotals(ds);
  return !!(t.protein||t.carbs||t.fat||t.cals);
}
function getMacroStreak(){
  let n=0;
  // Today counts once something is logged, but an empty today doesn't break the run.
  if(dayHasIntake(today()))n++;
  for(let i=1;i<=365;i++){if(!dayHasIntake(daysAgoStr(i)))break;n++;}
  return n;
}
// A day's intake = every logged meal PLUS the Quick Log entry for that day.
// (Quick Log used to be dropped the moment a single meal was logged on the same day.)
function getDayTotals(ds){
  {
    const meals=(S.meals||[]).filter(m=>m.date===ds);
    const ml=S.macroLogs[ds];
    const n=v=>parseFloat(v)||0;
    const q=ml?{protein:n(ml.protein),carbs:n(ml.carbs),fat:n(ml.fat),cals:n(ml.cals)}:null;
    const hasQuick=!!(q&&(q.protein||q.carbs||q.fat||q.cals));
    const t={protein:0,carbs:0,fat:0,cals:0};
    meals.forEach(m=>{t.protein+=n(m.protein);t.carbs+=n(m.carbs);t.fat+=n(m.fat);t.cals+=n(m.cals);});
    if(hasQuick){t.protein+=q.protein;t.carbs+=q.carbs;t.fat+=q.fat;t.cals+=q.cals;}
    return{protein:r1(t.protein),carbs:r1(t.carbs),fat:r1(t.fat),cals:Math.round(t.cals),
      fromMeals:meals.length>0,mealCount:meals.length,quick:hasQuick?q:null};
  }
}
// Analyze bodyweight log: rate of change (lbs/week) over recent entries.
// Rate of bodyweight change over the last four weeks, from a least-squares fit through every
// weigh-in in that window (two readings a year apart are not a "trend").
function weightTrend(){
  const from=daysAgoStr(28);
  const pts=(S.bodyweightLog||[]).filter(b=>b.date>=from).map(b=>({x:-daysBetween(b.date,today()),y:parseFloat(b.weight)})).filter(p=>p.y>0);
  if(pts.length<2)return null;
  const xs=pts.map(p=>p.x);const span=Math.max(...xs)-Math.min(...xs);
  if(span<3)return null;
  const mx=xs.reduce((a,b)=>a+b,0)/pts.length,my=pts.reduce((a,p)=>a+p.y,0)/pts.length;
  let num=0,den=0;pts.forEach(p=>{num+=(p.x-mx)*(p.y-my);den+=(p.x-mx)*(p.x-mx);});
  if(!den)return null;
  const perDay=num/den;
  const newest=(S.bodyweightLog||[])[0];
  return{current:newest?newest.weight:pts[pts.length-1].y,deltaLb:r1(perDay*span),days:span,perWeek:r1(perDay*7),n:pts.length};
}
// Average daily calorie intake over the last N logged days.
// Average intake over the logged days among the last N COMPLETED days (today is still in progress).
function avgDailyIntake(n){
  n=n||7;const vals=[];
  for(let i=1;i<=n;i++){const cals=getDayTotals(daysAgoStr(i)).cals||0;if(cals>0)vals.push(cals);}
  if(!vals.length)return 0;
  return Math.round(vals.reduce((t,v)=>t+v,0)/vals.length);
}
// Estimated maintenance: sedentary baseline plus the exercise actually logged over the same days.
function maintenanceKcal(n){
  n=n||7;let ex=0;
  for(let i=1;i<=n;i++)ex+=dayExerciseCals(daysAgoStr(i));
  return baselineBurn()+Math.round(ex/n);

function weightGoalCard(){
  if(!S.weightGoal||!S.bodyweight)return '';
  const cur=(S.bodyweightLog&&S.bodyweightLog[0]&&S.bodyweightLog[0].weight)||S.bodyweight;
  const goal=S.weightGoal;const dir=S.weightGoalDir;
  const diff=r1(cur-goal);const u=S.unit||'lbs';
  const trend=weightTrend();
  const tdee=maintenanceKcal(7);
  const avgIn=avgDailyIntake(7);
  let headline,sub,color,icon,bg,border;
  // Determine if eating more or less is needed
  if(Math.abs(diff)<0.5){
    headline=`At your goal weight (${fmt1(cur)} ${u})`;
    sub=avgIn?`Maintenance ≈ ${tdee} kcal/day. You're averaging ${avgIn}.`:`Maintenance ≈ ${tdee} kcal/day.`;
    color='var(--green)';icon='🎯';bg='var(--grdim)';border='rgba(45,122,82,.2)';
  }else if(cur<goal){
    // Below goal — need to gain (eat more)
    headline=`${fmt1(Math.abs(diff))} ${u} below your goal`;
    const surplus=avgIn?(avgIn-tdee):null;
    if(surplus!=null){
      if(surplus>0)sub=`Eat more to reach ${fmt1(goal)} ${u}. You're at +${surplus} kcal/day over maintenance — on the right track.`;
      else sub=`Eat more to reach ${fmt1(goal)} ${u}. You're ${Math.abs(surplus)} kcal/day under maintenance (${tdee}), which moves you away from your goal.`;
    }else sub=`Eat above ${tdee} kcal/day to gain toward ${fmt1(goal)} ${u}.`;
    color='var(--gold)';icon='⬆️';bg='var(--gdim)';border='rgba(184,124,42,.28)';
  }else{
    // Above goal — need to lose (eat less)
    headline=`${fmt1(Math.abs(diff))} ${u} above your goal`;
    const deficit=avgIn?(tdee-avgIn):null;
    if(deficit!=null){
      if(deficit>0)sub=`Eat less to reach ${fmt1(goal)} ${u}. You're at −${deficit} kcal/day under maintenance — on the right track.`;
      else sub=`Eat less to reach ${fmt1(goal)} ${u}. You're ${Math.abs(deficit)} kcal/day over maintenance (${tdee}), which moves you away from your goal.`;
    }else sub=`Eat below ${tdee} kcal/day to lose toward ${fmt1(goal)} ${u}.`;
    color='var(--navy)';icon='⬇️';bg='var(--ndim)';border='var(--nbright)';
  }
  // Trend line
  let trendLine='';
  if(trend&&Math.abs(trend.perWeek)>=0.1){
    const movingToward=(cur<goal&&trend.perWeek>0)||(cur>goal&&trend.perWeek<0)||(Math.abs(diff)<0.5&&Math.abs(trend.perWeek)<0.3);
    const arrow=trend.perWeek>0?'gaining':'losing';
    trendLine=`<div style="font-size:11px;color:var(--muted);margin-top:4px">Trend: ${arrow} ${fmt1(Math.abs(trend.perWeek))} ${u}/week over ${trend.days}d · ${movingToward?'<span style="color:var(--green);font-weight:600">moving toward goal</span>':'<span style="color:var(--red);font-weight:600">moving away from goal</span>'}</div>`;
  }else if(trend){
    trendLine=`<div style="font-size:11px;color:var(--muted);margin-top:4px">Weight stable over ${trend.days}d. Adjust intake to drive change.</div>`;
  }else{
    trendLine=`<div style="font-size:11px;color:var(--muted);margin-top:4px">Log your weight regularly to track progress.</div>`;
  }
  return`<div style="margin:0 13px 10px;padding:12px 13px;background:${bg};border:1px solid ${border};border-radius:10px">
    <div style="display:flex;align-items:flex-start;gap:10px">
      <div style="font-size:18px">${icon}</div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600;color:${color}">${headline}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45">${sub}</div>
        ${trendLine}
      </div>
    </div>
  </div>`;
}

    html+=`</div></div>`;
  }
  c.innerHTML=html;
}

    <div class="fg"><label class="fl">Calories <span style="font-size:9px;font-weight:500;color:var(--muted)">(auto if blank)</span></label><input type="number" inputmode="numeric" id="m-cal" placeholder="Auto"></div>
    <button class="btn btp bfw" onclick="saveMacros()">Save</button>
    <button class="btn bts bfw" id="macro-clear" style="margin-top:7px;display:none" onclick="clearMacros()">Clear this day's Quick Log</button>
    <button class="btn btg bfw" style="margin-top:7px" onclick="closeOv('macro-ov')">Cancel</button>
  </div>`;
  document.body.appendChild(ov);attachSwipeDown(ov);
  fillLogMacros();
}
function fillLogMacros(){
  const date=document.getElementById('macro-date')?.value||today();
  const log=S.macroLogs[date]||{};
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.value=v?v:'';};
  set('m-pro',log.protein);set('m-carb',log.carbs);set('m-fat',log.fat);set('m-cal',log.cals);
  const tot=getDayTotals(date);
  const note=document.getElementById('macro-meals-note');
  if(note){
    const mc=(S.meals||[]).filter(m=>m.date===date).reduce((t,m)=>t+(parseFloat(m.cals)||0),0);
    note.innerHTML=tot.mealCount?`<div style="font-size:11px;color:var(--muted);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:12px">${tot.mealCount} meal${tot.mealCount===1?'':'s'} already logged this day (${Math.round(mc)} kcal). Enter only what's missing.</div>`:'';
  }
  const clr=document.getElementById('macro-clear');if(clr)clr.style.display=tot.quick?'':'none';
}
function clearMacros(){
  const date=document.getElementById('macro-date')?.value||today();
  delete S.macroLogs[date];
  save();closeOv('macro-ov');toast('Quick Log cleared','green');renderNutrition(document.getElementById('content'));
}
function showRetroMacros(){showLogMacros();}
function saveMacros(){
  const date=document.getElementById('macro-date')?.value||today();
  if(date>today()){toast('That date is in the future');return;}
  const num=id=>Math.max(0,parseFloat(document.getElementById(id)?.value)||0);
  const p=num('m-pro'),carb=num('m-carb'),f=num('m-fat');
  const calTxt=document.getElementById('m-cal')?.value;
  const cals=calTxt?Math.max(0,parseFloat(calTxt)||0):Math.round(p*4+carb*4+f*9);
  if(!p&&!carb&&!f&&!cals)delete S.macroLogs[date];
  else S.macroLogs[date]={protein:p,carbs:carb,fat:f,cals};
  save();closeOv('macro-ov');toast('Saved','green');renderNutrition(document.getElementById('content'));
}
function showMacroGoals(){

    <div class="fg"><label class="fl">Protein (g)</label><input type="number" inputmode="decimal" id="mg-pro" value="${g.protein}"></div>
    <div class="fg"><label class="fl">Carbs (g)</label><input type="number" inputmode="decimal" id="mg-carb" value="${g.carbs}"></div>

    <div class="fg"><label class="fl">Calories</label><input type="number" inputmode="numeric" id="mg-cal" value="${g.cals}"></div>
    <div style="border-top:1px solid var(--border);margin:14px -16px;padding:14px 16px 0">
      <div class="ct" style="margin-bottom:10px">Weight Goal</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
        <div class="fg" style="margin-bottom:0"><label class="fl">Target (${S.unit||'lbs'})</label><input type="number" inputmode="decimal" id="mg-wgoal" value="${S.weightGoal||''}" placeholder="e.g. 180"></div>
        <div class="fg" style="margin-bottom:0"><label class="fl">Current</label><input type="number" inputmode="decimal" id="mg-wcur" value="${curW}" data-orig="${curW}" placeholder="${curW||'185'}"></div>

  document.body.appendChild(ov);attachSwipeDown(ov);

function selWeightDir(d){

}

// ──────── src/js/52-meal-builder.js ────────
// ═══════════════════════════════════════════════════
// MEAL BUILDER (multi-item)
// ═══════════════════════════════════════════════════
let _mealItems=[];
const MEAL_TYPES=['Breakfast','Lunch','Dinner','Snack','Pre-workout','Post-workout'];
// One place that scales an item by its quantity, so totals can't drift between screens.
function mealItemTotals(it){
  const q=parseFloat(it.qty)||0;const n=v=>parseFloat(v)||0;
  return{protein:r1(n(it.protein)*q),carbs:r1(n(it.carbs)*q),fat:r1(n(it.fat)*q),cals:Math.round(n(it.cals)*q)};
}
function savedMealCals(c){return Math.round((c.items||[]).reduce((t,it)=>t+mealItemTotals(it).cals,0));}
function mealTypeSheet(title,fnName,backLabel){
  const ov=makeOv('mtype-ov');
  ov.innerHTML=`<div class="modal" style="max-height:340px"><div class="mh"></div>
    <div style="font-size:15px;font-weight:600;margin-bottom:12px;text-align:center">${title}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${MEAL_TYPES.map(t=>`<button class="btn bts" style="padding:14px;font-size:14px;font-weight:600" onclick="${fnName}('${t}')">${t}</button>`).join('')}
    </div>
    <button class="btn btg bfw" style="margin-top:10px" onclick="closeOv('mtype-ov')">${backLabel||'Cancel'}</button>
  </div>`;
  document.body.appendChild(ov);attachSwipeDown(ov);
}
function quickLogFood(foodId){
  const f=findFood(foodId);if(!f)return;
  window._pendingQuickLog={type:'food',food:f};
  mealTypeSheet('Log as…','doQuickLog');
}
function quickLogCombo(comboId){
  const combo=(S.savedMeals||[]).find(c=>c.id===comboId);if(!combo)return;
  window._pendingQuickLog={type:'combo',combo};
  mealTypeSheet('Log as…','doQuickLog');
}
function doQuickLog(mealType){
  closeOv('mtype-ov');
  const q=window._pendingQuickLog;if(!q)return;
  if(!S.meals)S.meals=[];
  if(q.type==='food'){
    const f=q.food;
    trackRecent(f.id);
    S.meals.push({id:uid(),date:today(),type:mealType,name:mealType,
      items:[{foodId:f.id,name:f.name,qty:1,serving:f.serving,protein:f.protein,carbs:f.carbs,fat:f.fat,cals:f.cals}],
      protein:f.protein,carbs:f.carbs,fat:f.fat,cals:f.cals});
    toast(f.name+' → '+mealType,'green');
  }else if(q.type==='combo'){
    const c=q.combo;
    trackRecentMeal(c.id);
    let tp=0,tc=0,tf=0,tk=0;
    const items=c.items.map(it=>{
      const t=mealItemTotals(it);
      tp+=t.protein;tc+=t.carbs;tf+=t.fat;tk+=t.cals;
      return{...it,...t};
    });
    S.meals.push({id:uid(),date:today(),type:mealType,name:mealType,savedMealName:c.name,
      items,protein:r1(tp),carbs:r1(tc),fat:r1(tf),cals:Math.round(tk)});
    toast(c.name+' → '+mealType,'green');
  }
  save();renderNutrition(document.getElementById('content'));
  window._pendingQuickLog=null;
}
function showAddMeal(ds,keepItems){
  const date=ds||today();
  if(!keepItems){_mealItems=[];window._loggedSavedMealId=null;}
  const ov=makeOv('meal-ov');
  ov.innerHTML=buildMealModalHTML(date);
  document.body.appendChild(ov);attachSwipeDown(ov);
  window._mealType=0;window._mealFoodTab='starred';
  renderFoodTab();
  setTimeout(()=>document.getElementById('food-search')?.focus(),200);
}
function buildMealModalHTML(date){
  return`<div class="modal"><div class="mh"></div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input type="text" id="food-search" placeholder="Search foods and meals…" oninput="onFoodSearch()" style="flex:1">
      <button class="btn btp bsm" onclick="showBarcodeScanner()" style="gap:5px;flex-shrink:0"><span style="font-size:14px">📷</span> Scan</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--muted)">
      <label for="meal-date" style="font-weight:600">Date</label>
      <input type="date" id="meal-date" value="${esc(date)}" max="${today()}" style="flex:1;padding:7px 10px;font-size:13px">
    </div>
    <div style="display:flex;gap:0;border-bottom:1px solid var(--border);margin:0 -16px;padding:0 16px">
      <button class="ptab on" id="ftab-starred" onclick="setFoodTab('starred')">★ Starred</button>
      <button class="ptab" id="ftab-recent" onclick="setFoodTab('recent')">Recent</button>
      <button class="ptab" id="ftab-all" onclick="setFoodTab('all')">Foods</button>
      <button class="ptab" id="ftab-combos" onclick="setFoodTab('combos')">Saved Meals</button>
    </div>
    <div id="food-list" style="max-height:200px;overflow-y:auto;margin:0 -16px;padding:0 16px"></div>
    <div id="meal-items-section" style="display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div class="ct">Meal Items</div>
        <div id="meal-total" class="mono" style="font-size:13px;font-weight:600;color:var(--navy)"></div>
      </div>
      <div id="meal-items-list"></div>
    </div>
    <div id="manual-entry-toggle" style="margin-top:10px">
      <button class="btn btg bfw" style="font-size:12px" onclick="toggleManualEntry()">Enter macros manually ▾</button>
    </div>
    <div id="manual-entry" style="display:none;margin-top:8px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px">
        <div class="fg" style="margin-bottom:0"><label class="fl">Protein (g)</label><input type="number" inputmode="decimal" id="meal-pro" placeholder="0" oninput="autoCalcMeal()"></div>
        <div class="fg" style="margin-bottom:0"><label class="fl">Carbs (g)</label><input type="number" inputmode="decimal" id="meal-carb" placeholder="0" oninput="autoCalcMeal()"></div>
        <div class="fg" style="margin-bottom:0"><label class="fl">Fat (g)</label><input type="number" inputmode="decimal" id="meal-fat" placeholder="0" oninput="autoCalcMeal()"></div>
        <div class="fg" style="margin-bottom:0"><label class="fl">Calories</label><input type="number" inputmode="numeric" id="meal-cal" placeholder="Auto"></div>
      </div>
    </div>
    <div style="margin-top:12px">
      <button class="btn btp bfw" onclick="saveMeal()">Log Meal</button>
      <button class="btn bts bfw" style="margin-top:8px;display:none" id="save-combo-btn" onclick="saveAsCombo()">💾 Save as Reusable Meal</button>
    </div>
    <button class="btn btg bfw" style="margin-top:7px" onclick="closeOv('meal-ov')">Cancel</button>
  </div>`;
}
function selMealType(i){window._mealType=i;}
function toggleManualEntry(){
  const el=document.getElementById('manual-entry');
  const btn=document.getElementById('manual-entry-toggle');
  if(!el)return;
  const show=el.style.display==='none';
  el.style.display=show?'block':'none';
  if(btn)btn.innerHTML=`<button class="btn btg bfw" style="font-size:12px" onclick="toggleManualEntry()">Enter macros manually ${show?'▴':'▾'}</button>`;
}
function autoCalcMeal(){
  const p=parseFloat(document.getElementById('meal-pro')?.value)||0;
  const c=parseFloat(document.getElementById('meal-carb')?.value)||0;
  const f=parseFloat(document.getElementById('meal-fat')?.value)||0;
  const calEl=document.getElementById('meal-cal');
  if(calEl&&!calEl.value)calEl.placeholder=Math.round(p*4+c*4+f*9)||'Auto';
}
function setFoodTab(tab){
  window._mealFoodTab=tab;
  document.querySelectorAll('#meal-ov .ptab').forEach(t=>t.classList.remove('on'));
  const el=document.getElementById('ftab-'+tab);if(el)el.classList.add('on');
  document.getElementById('food-search').value='';
  renderFoodTab();
}
function onFoodSearch(){
  const q=document.getElementById('food-search')?.value?.trim()||'';
  renderFoodTab(q);
}
function renderFoodTab(query){
  const el=document.getElementById('food-list');if(!el)return;
  const tab=window._mealFoodTab||'starred';
  let foods=[];let savedMealMatches=[];
  if(query){
    foods=searchFoods(query);
    const lc=query.toLowerCase();
    savedMealMatches=(S.savedMeals||[]).filter(c=>String(c.name||'').toLowerCase().includes(lc));
  }else if(tab==='starred'){
    foods=getStarredFoods();
    if(!foods.length){el.innerHTML=`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">No starred foods yet.<br>Tap ★ on any food to star it.</div>`;return;}
  }else if(tab==='recent'){
    // Merge recent foods + recent saved meals
    const recentFoods=getRecentFoods();
    const recentMeals=(S.recentSavedMeals||[]).map(id=>(S.savedMeals||[]).find(c=>c.id===id)).filter(Boolean);
    let html='';
    if(recentMeals.length){
      html+=recentMeals.map(c=>{
        return savedMealRow(c);
      }).join('');
    }
    html+=recentFoods.map(f=>renderFoodRow(f)).join('');
    if(!html)html=`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">No recent items.<br>Foods you log will appear here.</div>`;
    el.innerHTML=html;return;
  }else if(tab==='all'){
    foods=allFoods();
  }else if(tab==='combos'){
    renderComboList(el);return;
  }
  // Render saved meal matches first (from search), then foods
  let html='';
  if(savedMealMatches.length){
    html+=savedMealMatches.map(c=>{
      return savedMealRow(c);
    }).join('');
  }
  html+=foods.map(f=>renderFoodRow(f)).join('');
  el.innerHTML=html;
}
function savedMealRow(c){
  return`<div class="hi" style="cursor:pointer" onclick="addComboToMeal(${jsq(c.id)})">
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;font-weight:600">${esc(c.name)} <span style="font-size:10px;color:var(--green);font-weight:700">MEAL</span></div>
      <div style="font-size:11px;color:var(--muted)">${esc(c.items.map(it=>it.name).join(', '))}</div>
    </div>
    <div class="mono" style="font-size:12px;font-weight:600;color:var(--navy);flex-shrink:0">${savedMealCals(c)}kcal</div>
  </div>`;
}
function renderFoodRow(f){
  return`<div class="hi" style="cursor:pointer" onclick="addFoodToMeal(${jsq(f.id)})">
    <button class="ib" style="font-size:16px;flex-shrink:0;margin-right:6px;color:${isStarred(f.id)?'var(--gold)':'var(--muted2)'}" onclick="event.stopPropagation();toggleStar(${jsq(f.id)});onFoodSearch()" aria-label="Star">★</button>
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(f.name)}</div>
      <div style="font-size:11px;color:var(--muted)">P${fmt1(f.protein)}g · C${fmt1(f.carbs)}g · F${fmt1(f.fat)}g</div>
    </div>
    <div style="flex-shrink:0;text-align:right">
      <div class="mono" style="font-size:12px;font-weight:600;color:var(--navy)">${Math.round(f.cals||0)}kcal</div>
      <div style="font-size:10px;color:var(--muted)">${esc(f.serving)}</div>
    </div>
  </div>`;
}
function renderComboList(el){
  const combos=S.savedMeals||[];
  if(!combos.length){el.innerHTML=`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">No saved meals yet.<br>Build a meal and tap "Save as Reusable Meal" to save it.</div>`;return;}
  el.innerHTML=combos.map(c=>{
    return`<div class="hi" style="cursor:pointer" onclick="addComboToMeal(${jsq(c.id)})">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600">${esc(c.name)}</div>
        <div style="font-size:11px;color:var(--muted)">${c.items.length} items · ${savedMealCals(c)}kcal</div>
      </div>
      <button class="ib delbtn" style="flex-shrink:0" onclick="event.stopPropagation();deleteCombo(${jsq(c.id)})" aria-label="Delete saved meal">✕</button>
    </div>`;
  }).join('');
}
function addFoodToMeal(foodId){
  const f=findFood(foodId);if(!f)return;
  const existing=_mealItems.find(it=>it.foodId===foodId);
  if(existing){existing.qty=r1((parseFloat(existing.qty)||0)+1);updateMealItems();return;}
  _mealItems.push({foodId:f.id,name:f.name,qty:1,serving:f.serving,protein:f.protein,carbs:f.carbs,fat:f.fat,cals:f.cals});
  updateMealItems();
}
function addComboToMeal(comboId){
  const combo=(S.savedMeals||[]).find(c=>c.id===comboId);if(!combo)return;
  window._loggedSavedMealId=comboId;
  combo.items.forEach(it=>{
    const existing=_mealItems.find(x=>x.foodId===it.foodId);
    if(existing){existing.qty=r1((parseFloat(existing.qty)||0)+(parseFloat(it.qty)||1));}
    else{_mealItems.push({...it});}
  });
  updateMealItems();
}
function deleteCombo(id){
  const idx=(S.savedMeals||[]).findIndex(c=>c.id===id);if(idx<0)return;
  const gone=S.savedMeals.splice(idx,1)[0];
  S.recentSavedMeals=(S.recentSavedMeals||[]).filter(x=>x!==id);
  save();renderFoodTab();
  toast('Saved meal deleted','',{action:'Undo',onAction:()=>{S.savedMeals.splice(Math.min(idx,S.savedMeals.length),0,gone);save();renderFoodTab();}});
}
function adjMealItem(idx,d){
  if(!_mealItems[idx])return;
  _mealItems[idx].qty=Math.max(0.5,r1((parseFloat(_mealItems[idx].qty)||0)+d));
  updateMealItems();
}
function removeMealItem(idx){_mealItems.splice(idx,1);if(!_mealItems.length)window._loggedSavedMealId=null;updateMealItems();}
function updateMealItems(){
  const sec=document.getElementById('meal-items-section');
  const list=document.getElementById('meal-items-list');
  const total=document.getElementById('meal-total');
  const comboBtn=document.getElementById('save-combo-btn');
  if(!sec||!list)return;
  if(!_mealItems.length){sec.style.display='none';if(comboBtn)comboBtn.style.display='none';return;}
  sec.style.display='block';
  if(comboBtn)comboBtn.style.display=_mealItems.length>=2?'block':'none';
  let tp=0,tc=0,tf=0,tk=0;
  list.innerHTML=_mealItems.map((it,i)=>{
    const t=mealItemTotals(it);const ip=t.protein,ic=t.carbs,ifat=t.fat,ik=t.cals;
    tp+=ip;tc+=ic;tf+=ifat;tk+=ik;
    return`<div style="display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--hair)">
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.name)}</div>
        <div style="font-size:10px;color:var(--muted)">${esc(it.serving||'')} · P${fmt1(ip)} C${fmt1(ic)} F${fmt1(ifat)}</div>
      </div>
      <button class="ib" style="font-size:16px;font-weight:700" onclick="adjMealItem(${i},-0.5)" aria-label="Less">−</button>
      <div class="mono" style="font-size:13px;font-weight:600;width:26px;text-align:center">${fmt1(it.qty)}</div>
      <button class="ib" style="font-size:16px;font-weight:700" onclick="adjMealItem(${i},0.5)" aria-label="More">+</button>
      <div class="mono" style="font-size:11px;color:var(--muted);width:48px;text-align:right">${ik}kcal</div>
      <button class="ib delbtn" onclick="removeMealItem(${i})" aria-label="Remove">✕</button>
    </div>`;
  }).join('');
  if(total)total.textContent=`${Math.round(tk)} kcal`;
}
function saveMeal(){
  const mp=parseFloat(document.getElementById('meal-pro')?.value)||0;
  const mc=parseFloat(document.getElementById('meal-carb')?.value)||0;
  const mf=parseFloat(document.getElementById('meal-fat')?.value)||0;
  const mcEl=document.getElementById('meal-cal');
  const mCals=mcEl?.value?parseFloat(mcEl.value):0;
  const hasManual=!!(mp||mc||mf||mCals);
  if(!_mealItems.length&&!hasManual){toast('Add foods or enter macros');return;}
  mealTypeSheet('What meal is this?','doSaveMealWithType','Back');
}
function doSaveMealWithType(mealType){
  closeOv('mtype-ov');
  let date=document.getElementById('meal-date')?.value||today();
  if(date>today())date=today();

  const mcEl=document.getElementById('meal-cal');
  const mCals=mcEl?.value?parseFloat(mcEl.value):0;
  const hasManual=!!(mp||mc||mf||mCals);

    const items=_mealItems.map(it=>{
      const t=mealItemTotals(it);const ip=t.protein,ic=t.carbs,ifat=t.fat,ik=t.cals;

      const sm=(S.savedMeals||[]).find(c=>c.id===window._loggedSavedMealId);

    S.meals.push({id:uid(),date,type:mealType,name:mealType,protein:mp,carbs:mc,fat:mf,cals});
  }
  _mealItems=[];save();closeOv('meal-ov');

// BARCODE SCANNER + OPEN FOOD FACTS
// ═══════════════════════════════════════════════════
// ─── Barcode scanner state ───
let _zxingReader=null,_scanStream=null,_scanLoopActive=false,_torchTrack=null,_torchOn=false;
function loadScannerLib(){
  return new Promise((resolve,reject)=>{
    if(window.ZXing&&makeZxingReader.ok!==false){resolve();return;}
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('lib load failed'));
    document.head.appendChild(s);
  });
}
function makeZxingReader(){
  const Z=window.ZXing;if(!Z)return null;
  const Reader=Z.BrowserMultiFormatReader||Z.BrowserBarcodeReader||Z.BrowserCodeReader;
  if(!Reader){makeZxingReader.ok=false;return null;}
  try{
    // Hint the formats we care about (1D product codes) for speed
    let hints=null;
    if(Z.DecodeHintType&&Z.BarcodeFormat){
      hints=new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[
        Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,
        Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,
        Z.BarcodeFormat.ITF,Z.BarcodeFormat.CODABAR
      ]);
      hints.set(Z.DecodeHintType.TRY_HARDER,true);
    }
    return new Reader(hints);
  }catch(e){return new Reader();}
}
function setScanStatus(msg,color){
  const el=document.getElementById('scan-status');if(!el)return;
  el.innerHTML=color?`<div style="color:${color};font-weight:600">${msg}</div>`:msg; // callers pass fixed strings only
}
function showBarcodeScanner(){

  }else{window._scanReturnToMeal=false;}

  ov.innerHTML=`<div class="modal" style="max-height:96vh;padding-bottom:calc(30px + var(--sb))">

      <div style="position:absolute;left:8%;right:8%;top:42%;height:16%;border:2px solid rgba(255,255,255,.85);border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.22);pointer-events:none"></div>

      <button id="torch-btn" onclick="toggleTorch()" style="display:none;position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(0,0,0,.5);color:#fff;font-size:18px;cursor:pointer">🔦</button>

    <div id="scan-status" style="text-align:center;padding:12px;font-size:13px;color:var(--muted)">Starting camera…</div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn btp" style="flex:1;gap:6px" onclick="captureAndScan()"><span style="font-size:14px">⎙</span> Freeze + Scan</button>
    </div>

      <button class="btn btg" style="flex:1" onclick="stopScanner()">Cancel</button>
    </div>
  </div>`;
  document.body.appendChild(ov);attachSwipeDown(ov);
  startScanner();
}
async function startScanner(){
  const video=document.getElementById('scan-video');
  if(!video)return;
  // Defensive: clear any stale state from a previous session
  _zxingReader=null;_scanLoopActive=false;
  if(_scanStream){_scanStream.getTracks().forEach(t=>t.stop());_scanStream=null;}
  // Brief delay lets iOS Safari fully release the camera from a prior session
  await new Promise(r=>setTimeout(r,150));
  try{
    setScanStatus('Requesting camera…');
    _scanStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false
    });
    video.srcObject=_scanStream;
    setScanStatus('Starting video…');
    try{
      await video.play();
    }catch(playErr){
      // iOS autoplay blocked — offer explicit tap-to-start
      setScanStatus('<button class="btn btp bsm" onclick="tapStartCamera()">Tap to start camera</button>');
      setupTorch();
      return;
    }
    setupTorch();
    beginDecode();
  }catch(e){
    const msg=e&&e.name==='NotAllowedError'?'Camera permission denied — enable it in Settings, or enter the code manually'
      :e&&e.name==='NotFoundError'?'No camera found — enter the code manually'
      :'Camera unavailable — enter the code manually';
    setScanStatus(msg,'var(--red)');
  }
}
async function tapStartCamera(){
  const v=document.getElementById('scan-video');if(!v)return;
  try{await v.play();beginDecode();}
  catch(e){setScanStatus('Could not start camera — enter the code manually','var(--red)');}
}
async function beginDecode(){
  const video=document.getElementById('scan-video');
  if(!video)return;
  setScanStatus('Point camera at a barcode…');
  try{
    await loadScannerLib();
    _zxingReader=makeZxingReader();
    if(!_zxingReader){setScanStatus('Scanner library unavailable — use Freeze + Scan or enter code','var(--red)');return;}
    _scanLoopActive=true;
    _zxingReader.decodeFromVideoElementContinuously(video,(result)=>{
      if(result&&_scanLoopActive){_scanLoopActive=false;onBarcodeDetected(result.getText());}
    });
  }catch(e){
    setScanStatus('Live scan unavailable — use Freeze + Scan','var(--red)');
  }
}
function setupTorch(){
  try{
    const track=_scanStream&&_scanStream.getVideoTracks()[0];
    if(!track)return;
    const caps=track.getCapabilities?track.getCapabilities():{};
    if(caps&&'torch' in caps&&caps.torch){
      _torchTrack=track;
      const btn=document.getElementById('torch-btn');if(btn)btn.style.display='block';
    }else{
      _torchTrack=null; // iOS Safari lands here — torch not exposed to web
    }
  }catch(e){_torchTrack=null;}
}
async function toggleTorch(){
  if(!_torchTrack)return;
  _torchOn=!_torchOn;
  try{
    await _torchTrack.applyConstraints({advanced:[{torch:_torchOn}]});
    const btn=document.getElementById('torch-btn');
    if(btn)btn.style.background=_torchOn?'var(--gold)':'rgba(0,0,0,.5)';
  }catch(e){_torchOn=!_torchOn;}
}
function teardownScanner(){
  _scanLoopActive=false;
  if(_torchTrack&&_torchOn){try{_torchTrack.applyConstraints({advanced:[{torch:false}]});}catch(e){}}
  _torchTrack=null;_torchOn=false;
  // Stop the decode loop WITHOUT touching the stream (reset() kills the stream on iOS).
  if(_zxingReader){try{_zxingReader.stopContinuousDecode();}catch(e){}}_zxingReader=null;
  // Explicitly detach srcObject before stopping tracks — iOS needs this sequence.
  const vid=document.getElementById('scan-video');
  if(vid)vid.srcObject=null;
  if(_scanStream){_scanStream.getTracks().forEach(t=>t.stop());_scanStream=null;}
}
function stopScanner(){
  teardownScanner();
  closeOv('scan-ov');
}
async function captureAndScan(){
  const video=document.getElementById('scan-video');
  if(!video||!video.videoWidth){setScanStatus('No camera feed yet — wait a moment','var(--red)');return;}
  _scanLoopActive=false;
  const canvas=document.createElement('canvas');
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  setScanStatus('Analyzing frame…','var(--navy)');
  try{
    await loadScannerLib();
    const reader=makeZxingReader();
    if(!reader)throw new Error('no reader');
    const dataUrl=canvas.toDataURL('image/png');
    const result=await reader.decodeFromImageUrl(dataUrl);
    onBarcodeDetected(result.getText());
  }catch(e){
    setScanStatus('No barcode detected — center it in the box, hold steady, try again','var(--red)');
    // The original continuous loop from beginDecode is still running —
    // it just ignores results when _scanLoopActive is false.
    // Re-enable it. Do NOT re-call decodeFromVideoElementContinuously
    // because ZXing internally calls reset() which kills the stream.
    _scanLoopActive=true;
  }
}
function showManualBarcode(){
  const statusEl=document.getElementById('scan-status');if(!statusEl)return;
  _scanLoopActive=false;
  statusEl.innerHTML=`<div style="display:flex;gap:8px;margin-top:4px">
    <input type="text" id="manual-barcode" inputmode="numeric" placeholder="Enter barcode number" style="flex:1;font-size:15px">
    <button class="btn btp bsm" onclick="submitManualBarcode()">Look up</button>
  </div>`;
  setTimeout(()=>document.getElementById('manual-barcode')?.focus(),100);
}
// A barcode ends up in element ids, a URL and storage keys: keep only what a barcode can contain.
function cleanBarcode(code){return String(code==null?'':code).replace(/[^0-9A-Za-z_\-]/g,'').slice(0,32);}
function submitManualBarcode(){
  const code=cleanBarcode(document.getElementById('manual-barcode')?.value);
  if(!code){toast('Enter the numbers under the barcode');return;}
  onBarcodeDetected(code);
}
const FOOD_CACHE_MAX=300;
function cacheProduct(barcode,product){
  if(!isObj(S.foodCache))S.foodCache={};
  delete S.foodCache[barcode];           // re-insert so the newest entry is last
  S.foodCache[barcode]=product;
  const keys=Object.keys(S.foodCache);
  for(let i=0;i<keys.length-FOOD_CACHE_MAX;i++)delete S.foodCache[keys[i]];
}
// Open Food Facts → the small shape the app keeps. Energy falls back from kcal to kJ.
function offToProduct(pr){
  const n=pr.nutriments||{};const num=v=>{const x=parseFloat(v);return x>0?x:0;};
  const kcal=suffix=>{
    const k=num(n['energy-kcal_'+suffix]);if(k)return Math.round(k);
    const kj=num(n['energy-kj_'+suffix])||num(n['energy_'+suffix]);
    return kj?Math.round(kj/4.184):0;
  };
  const block=suffix=>({protein:r1(num(n['proteins_'+suffix])),carbs:r1(num(n['carbohydrates_'+suffix])),fat:r1(num(n['fat_'+suffix])),cals:kcal(suffix)});
  return{
    name:String(pr.product_name||pr.product_name_en||pr.generic_name||'Unknown product').slice(0,120),
    brand:String(pr.brands||'').split(',')[0].trim().slice(0,60),
    serving:String(pr.serving_size||'').slice(0,40),
    servingG:num(pr.serving_quantity),
    per100:block('100g'),perServing:block('serving')
  };
}
function validProduct(p){
  const ok=b=>isObj(b)&&['protein','carbs','fat','cals'].every(k=>typeof b[k]==='number'&&isFinite(b[k]));
  return isObj(p)&&ok(p.per100)&&ok(p.perServing);
}
function scanFailHTML(title,barcode,retry){
  return`<div style="color:var(--red);font-weight:600">${title}</div>
    <div style="font-size:12px;margin-top:4px;color:var(--muted)">Barcode: ${esc(barcode)}</div>
    ${retry?`<button class="btn bts bfw" style="margin-top:10px" onclick="onBarcodeDetected(${jsq(barcode)})">Try again</button>`:''}
    <button class="btn btp bfw" style="margin-top:8px" onclick="showCreateCustomFood(${jsq(barcode)})">Enter it yourself</button>`;
}
async function onBarcodeDetected(raw){
  teardownScanner();
  const barcode=cleanBarcode(raw);
  const statusEl=document.getElementById('scan-status');
  if(!barcode){if(statusEl)statusEl.innerHTML='<div style="color:var(--red);font-weight:600">That code could not be read</div>';return;}
  if(statusEl)statusEl.innerHTML=`<div style="font-weight:600;color:var(--navy)">Found: ${esc(barcode)}</div><div style="margin-top:4px;font-size:12px">Looking up product…</div>`;
  const cached=S.foodCache&&S.foodCache[barcode];
  if(validProduct(cached)){showServingPicker(cached,barcode);return;}
  const ctl=typeof AbortController!=='undefined'?new AbortController():null;
  const timer=setTimeout(()=>{if(ctl)ctl.abort();},10000);
  try{
    const res=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(barcode)+'.json?fields=product_name,product_name_en,generic_name,brands,serving_size,serving_quantity,nutriments',ctl?{signal:ctl.signal}:undefined);
    if(res.status===404){if(statusEl)statusEl.innerHTML=scanFailHTML('Product not found',barcode,false);return;}
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(data&&data.status===1&&data.product){
      const product=offToProduct(data.product);
      cacheProduct(barcode,product);save();
      showServingPicker(product,barcode);
    }else if(statusEl)statusEl.innerHTML=scanFailHTML('Product not found',barcode,false);
  }catch(e){
    const offline=typeof navigator!=='undefined'&&navigator.onLine===false;
    if(statusEl)statusEl.innerHTML=scanFailHTML(offline?'You are offline':'Lookup failed — the food database did not answer',barcode,true);
  }finally{clearTimeout(timer);}
}

function scanServingMode(mode){
  window._scanMode=mode;
  document.querySelectorAll('#serving-ov .chip').forEach(c=>c.classList.remove('on'));
  const el=document.getElementById('sv-'+mode);if(el)el.classList.add('on');
  const cg=document.getElementById('scan-custom-g');if(cg)cg.style.display=mode==='custom'?'block':'none';
  const qr=document.getElementById('scan-qty-row');if(qr)qr.style.display=mode==='custom'?'none':'block';
  updateScanMacros();
}
function scanQtyAdj(d){
  const el=document.getElementById('scan-qty');if(!el)return;
  el.value=Math.max(0.5,Math.round(((parseFloat(el.value)||1)+d)*10)/10);
  updateScanMacros();
}
function scanHas(b){return !!(b&&(b.cals||b.protein||b.carbs||b.fat));}
// Per-serving figures as ONE consistent block: the label's own serving numbers if it has them,
// otherwise per-100g scaled by the serving weight. Never a field-by-field mix of the two.
function scanServingBase(p){
  if(scanHas(p.perServing))return p.perServing;
  if(p.servingG>0&&scanHas(p.per100)){const k=p.servingG/100;return{protein:p.per100.protein*k,carbs:p.per100.carbs*k,fat:p.per100.fat*k,cals:p.per100.cals*k};}
  return null;
}
function scaleMacros(b,k){return{protein:r1(b.protein*k),carbs:r1(b.carbs*k),fat:r1(b.fat*k),cals:Math.round(b.cals*k)};}
function calcScanMacros(){
  const p=window._scanProduct;if(!p)return null;
  const mode=window._scanMode;
  const qv=parseFloat(document.getElementById('scan-qty')?.value);const qty=qv>0?qv:0;
  if(mode==='serving'){const b=scanServingBase(p);return b?scaleMacros(b,qty):null;}
  if(mode==='custom'){const g=Math.max(0,parseFloat(document.getElementById('scan-grams')?.value)||0);return scaleMacros(p.per100,g/100);}
  return scaleMacros(p.per100,qty);
}
// What one logged unit of this scan is, in words.
function scanServingText(){
  const p=window._scanProduct,mode=window._scanMode;if(!p)return'1 serving';
  if(mode==='custom')return fmt1(parseFloat(document.getElementById('scan-grams')?.value)||0)+'g';
  const q=parseFloat(document.getElementById('scan-qty')?.value)||1;
  if(mode==='100g')return fmt1(q*100)+'g';
  return(q!==1?fmt1(q)+' × ':'')+(p.serving||'1 serving');
}
function updateScanMacros(){
  const m=calcScanMacros();if(!m)return;
  window._scanMacros=m;
  const el=document.getElementById('scan-macros');if(!el)return;
  el.innerHTML=`
    <div><div style="font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Protein</div>
      <div class="mono" style="font-size:20px;font-weight:600;color:var(--navy)">${fmt1(m.protein)}<span style="font-size:10px;opacity:.5">g</span></div></div>
    <div><div style="font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Carbs</div>
      <div class="mono" style="font-size:20px;font-weight:600;color:var(--gold)">${fmt1(m.carbs)}<span style="font-size:10px;opacity:.5">g</span></div></div>
    <div><div style="font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Fat</div>
      <div class="mono" style="font-size:20px;font-weight:600;color:var(--red)">${fmt1(m.fat)}<span style="font-size:10px;opacity:.5">g</span></div></div>
    <div><div style="font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Calories</div>
      <div class="mono" style="font-size:20px;font-weight:600;color:var(--green)">${m.cals}<span style="font-size:10px;opacity:.5">kcal</span></div></div>`;
}
function addScannedFood(){
  const p=window._scanProduct,m=window._scanMacros,barcode=cleanBarcode(window._scanBarcode);
  if(!p||!m){toast('No product data');return;}
  if(!m.protein&&!m.carbs&&!m.fat&&!m.cals){toast(window._scanMode==='custom'?'Enter the weight in grams':'Nothing to log at that amount');return;}
  const fullName=p.name+(p.brand?' ('+p.brand+')':'');
  // Remember the product as a food: one serving if the label has one, otherwise 100 g.
  const cfId='cf_'+barcode;
  const base=scanServingBase(p);
  const one=base?scaleMacros(base,1):scaleMacros(p.per100,1);
  const food={id:cfId,name:fullName,serving:base?(p.serving||(p.servingG?fmt1(p.servingG)+'g':'1 serving')):'100g',barcode,...one};
  const at=S.customFoods.findIndex(f=>f.id===cfId);
  if(at>=0)S.customFoods[at]=food;else S.customFoods.push(food);
  trackRecent(cfId);
  const item={foodId:cfId,name:fullName,qty:1,serving:scanServingText(),protein:m.protein,carbs:m.carbs,fat:m.fat,cals:m.cals};
  closeOv('serving-ov');
  if(window._scanReturnToMeal){
    const kept=[..._mealItems];
    showAddMeal(window._scanMealDate||today(),true);
    _mealItems=[...kept,item];
    updateMealItems();
  }else{
    window._pendingScanMeal=item;
    mealTypeSheet('What meal is this?','logQuickScanMeal');
  }
  save();window._scanProduct=null;window._scanMacros=null;
}
function logQuickScanMeal(mealType){
  closeOv('mtype-ov');
  const s=window._pendingScanMeal;if(!s)return;
  S.meals.push({id:uid(),date:today(),type:mealType,name:mealType,items:[s],protein:s.protein,carbs:s.carbs,fat:s.fat,cals:s.cals});
  save();toast(s.name+' logged as '+mealType,'green');
  if(S.tab==='nutrition')renderNutrition(document.getElementById('content'));
  window._pendingScanMeal=null;
}

// Deleting an exercise that is referenced elsewhere used to leave "undefined" rows behind.
//  - in workout history → it is archived: hidden from lists and pickers, old sessions keep the name;
//  - only in routines   → removed from those routines too.
function delCustomEx(id){
  const ex=(S.custom||[]).find(c=>c.id===id);if(!ex)return;
  const inHist=S.workouts.filter(w=>w.exercises.some(e=>e.exId===id)).length;
  const inRtn=S.routines.filter(r=>r.exercises.some(e=>e.exId===id)).length;
  const live=S.activeWorkout&&S.activeWorkout.exercises.some(e=>e.exId===id);
  if(live){toast('That exercise is in the workout you have open');return;}
  const parts=[];
  if(inRtn)parts.push(`It will be removed from ${inRtn} routine${inRtn===1?'':'s'}.`);
  if(inHist)parts.push(`${inHist} logged workout${inHist===1?'':'s'} keep their sets and the name.`);
  customConfirm(`Delete <b>${esc(ex.name)}</b>?${parts.length?'<br>'+parts.join(' '):''}`,'Delete',()=>{
    S.routines.forEach(r=>{r.exercises=r.exercises.filter(e=>e.exId!==id);});
    if(inHist)ex.archived=true;
    else{S.custom=S.custom.filter(c=>c.id!==id);delete SEC_MUSCLE[id];delete S.prsManual[id];if(S.exRest)delete S.exRest[id];}
    _exIdx=null;rebuildPRs();save();
    closeOv('exd-ov');renderLibrary(document.getElementById('content'));toast('Exercise deleted','green');
  });
}

function saveCustomEx(){

  const dupe=exIndex().all.find(e=>e.name.toLowerCase()===name.toLowerCase());

  const muscle=document.getElementById('cex-m')?.value||'';
  const secs=[...document.querySelectorAll('#cex-sec .mchip.on')].map(el=>el.dataset.m).filter(m=>m!==muscle);
  const cat=document.getElementById('cex-c')?.value||'Other',eq=document.getElementById('cex-e')?.value||'Other';

     .replace(/\bmed(icine)?[\s\-]?ball\b/g,'medball').replace(/\bbody[\s\-]weight\b/g,'bodyweight')

     .replace(/\bclose[\s\-]grip\b/g,'close grip').replace(/\bpull[\s\-]?downs?\b/g,'pulldown').replace(/\bpush[\s\-]?downs?\b/g,'pushdown')
