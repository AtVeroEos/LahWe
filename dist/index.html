</script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f1ec;--bg2:#eae5dd;--card:#fffefb;--border:#e8e3d9;--hair:#efeae1;
  --shadow:0 1px 2px rgba(28,24,16,.05);
  --shadow-md:0 10px 30px -8px rgba(28,24,16,.14),0 2px 6px rgba(28,24,16,.05);
  /* --navy / --ndim / --nbright injected by applyTheme() */
  --navy:#373f8f;--ndim:rgba(55,63,143,.07);--nbright:rgba(55,63,143,.16);
  --gold:#9b6f24;--gdim:rgba(155,111,36,.1);
  --green:#2f7350;--grdim:rgba(47,115,80,.08);--grbright:rgba(47,115,80,.16);
  --red:#bd4040;--rdim:rgba(189,64,64,.08);
  --blue:#2e6db2;--bdim:rgba(46,109,178,.08);
  --purple:#6a4eb2;--pdim:rgba(106,78,178,.08);
  --text:#1b1813;--muted:#7e7669;--muted2:#bcb5a9;
  --bm-body:#e4ded3;--bm-muscle:#cdc5b6;--bm-line:#c7c2b8;
  --nh:56px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--r:16px;--rm:11px;
  /* Web fonts load without blocking; these stacks are what shows offline or before they arrive. */
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-dark="true"]{
  color-scheme:dark;
  --bg:#100f0d;--bg2:#1a1916;--card:#1b1a16;--border:#2d2a25;--hair:#242220;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 16px 36px -10px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.4);
  /* --navy / --ndim / --nbright injected by applyTheme() for dark */
  --navy:#4d56c4;--ndim:rgba(125,134,240,.15);--nbright:rgba(125,134,240,.32);
  --gold:#cf9844;--gdim:rgba(207,152,68,.16);
  --green:#4caf80;--grdim:rgba(76,175,128,.15);--grbright:rgba(76,175,128,.26);
  --red:#e06a6a;--rdim:rgba(224,106,106,.15);
  --blue:#5b9fe0;--bdim:rgba(91,159,224,.15);
  --purple:#9b80e0;--pdim:rgba(155,128,224,.15);
  --text:#efebe3;--muted:#968d80;--muted2:#615a50;
  --bm-body:#2b2823;--bm-muscle:#3a352d;--bm-line:#45413a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;overflow:hidden;transition:background .2s,color .2s;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.01em}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nh) + var(--sb) + 56px);scroll-behavior:smooth}

/* ── NAV ── */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--card);border-top:1px solid var(--border);display:flex;align-items:flex-start;
  padding-top:8px;padding-bottom:calc(var(--sb) + 12px);padding-left:12px;padding-right:12px;z-index:100;
  box-shadow:0 -0.5px 0 var(--border)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;
  color:var(--muted2);cursor:pointer;padding:2px 0;transition:color .15s;touch-action:manipulation}
.nb.on{color:var(--navy)}
.nb-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.nb.on .nb-icon{background:var(--ndim)}
.nb svg{width:18px;height:18px;transition:transform .15s}
.nb.on svg{transform:scale(1.05)}
.nb span{font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}

/* ── REST TIMER ── */
.bm-blob{position:absolute;width:16%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);filter:blur(8px);opacity:.5;mix-blend-mode:multiply;pointer-events:none}
#rest-pill{font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;background:var(--red);padding:4px 9px;border-radius:6px;letter-spacing:.02em;cursor:pointer;touch-action:manipulation;white-space:nowrap;display:none;align-items:center;gap:5px;animation:popin .2s ease}
#rest-pill.on{display:inline-flex}
#rest-pill .rp-x{font-size:10px;opacity:.7;font-weight:700}
@keyframes popin{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin:0 13px 10px;overflow:hidden;box-shadow:var(--shadow)}
.ch{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ct{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cb{padding:14px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 17px;
  border-radius:10px;border:none;font-family:var(--sans);font-size:14px;font-weight:600;
  cursor:pointer;transition:transform .08s,opacity .08s,background .1s;user-select:none;
  letter-spacing:-.01em;touch-action:manipulation;-webkit-user-select:none}
.btn:active{opacity:.78;transform:scale(.96)}
.btn:disabled{opacity:.45;pointer-events:none}
.btp{background:var(--navy);color:#fff;box-shadow:0 1px 2px rgba(28,24,16,.16)}
.btp:active{filter:brightness(.92)}
.bts{background:var(--card);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow)}
.btg{background:transparent;color:var(--muted);border:none;box-shadow:none}
.btd{background:var(--red);color:#fff;box-shadow:0 1px 3px rgba(176,53,53,.25)}
.btok{background:var(--green);color:#fff;box-shadow:0 1px 3px rgba(39,114,74,.25)}
.btb{background:var(--bdim);color:var(--blue);border:1px solid rgba(36,104,184,.2)}
.bfw{width:100%}.bsm{padding:7px 13px;font-size:13px}.bxs{padding:4px 9px;font-size:11px}
.delbtn{background:transparent;border:1px solid var(--border);color:var(--red);box-shadow:none}
.delbtn:active{background:var(--rdim)}

/* ── INPUTS ── */
input,select,textarea{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;
  color:var(--text);font-family:var(--sans);font-size:15px;padding:10px 12px;
  width:100%;outline:none;transition:border-color .15s,box-shadow .15s;
  -webkit-appearance:none;-moz-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--navy);background:var(--card);
  box-shadow:0 0 0 3px var(--ndim)}
input[type=number]{font-family:var(--mono);text-align:center;font-size:16px}
input[type=date]{font-family:var(--sans);font-size:14px}
select option{background:var(--card)}
textarea{resize:none;line-height:1.6}

/* ── OVERLAYS & MODALS ── */
.ov{position:fixed;inset:0;background:rgba(8,6,4,.55);z-index:200;display:flex;align-items:flex-end;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{background:var(--card);border-top:1px solid var(--border);border-radius:22px 22px 0 0;
  width:100%;max-height:93vh;overflow-y:auto;padding:10px 16px calc(22px + var(--sb));
  animation:su .18s cubic-bezier(.22,.61,.36,1);-webkit-overflow-scrolling:touch;touch-action:pan-y;
  box-shadow:0 -4px 24px rgba(0,0,0,.12)}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mh{width:40px;height:4px;background:var(--muted2);border-radius:2px;margin:0 auto 16px;opacity:.5;cursor:grab;touch-action:none}
.mh:active{cursor:grabbing;opacity:.8}
.mt{font-size:19px;font-weight:700;margin-bottom:16px;letter-spacing:-.03em}
.page-title{font-size:25px;font-weight:700;letter-spacing:-.04em}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 13px 6px}
.mono{font-family:var(--mono)}

/* ── PAGE HEADER ── */
.ph{padding:16px 14px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}

/* ── WORKOUT SESSION BAR ── */
.fbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--border);
  padding:10px 14px;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow)}
.fbar-name{flex:1;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.wt{font-family:var(--mono);font-size:12px;color:var(--navy);background:var(--ndim);
  padding:4px 8px;border-radius:6px;letter-spacing:.02em;font-weight:500}

/* ── EXERCISE BLOCKS ── */
.exb{margin:0 13px 10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.exbh{padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--border)}
.exbn{font-size:14px;font-weight:700;letter-spacing:-.02em}
.exbc{font-size:11px;color:var(--muted);margin-top:2px}
.ex-last{font-size:11px;color:var(--green);font-weight:600;margin-top:2px}
.slbls{display:grid;grid-template-columns:20px 1fr 1fr 46px 40px 34px;gap:5px;padding:5px 10px;background:var(--bg)}
.sl{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);text-align:center}
.srow{display:grid;grid-template-columns:20px 1fr 1fr 46px 40px 34px;gap:5px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:none}.srow.done{background:rgba(39,114,74,.05)}
.srow.warm{background:rgba(176,120,40,.045)}
.srow.warm .sinp{opacity:.75}
.srow.warm .snum{color:var(--gold);font-weight:700}
.snum{font-family:var(--mono);font-size:11px;color:var(--muted2);text-align:center}
.sinp{padding:9px 3px;font-size:16px;border-radius:8px;touch-action:manipulation;min-width:0}
.sinp:disabled{background:transparent;border-color:transparent;color:var(--text)}
.e1rm-cell{display:flex;align-items:center;justify-content:center}
.e1rm-badge{font-family:var(--mono);font-size:9px;padding:2px 5px;border-radius:4px;
  background:var(--bg2);color:var(--muted);border:1px solid var(--border);text-align:center;white-space:nowrap}
.e1rm-badge.pr{color:var(--gold);border-color:rgba(176,120,40,.3);background:var(--gdim)}
.chk{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--border);background:transparent;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .1s;
  color:transparent;font-size:18px;flex-shrink:0;touch-action:manipulation}
.chk.done{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 1px 3px rgba(39,114,74,.3)}
.tag-btn{width:34px;height:40px;border-radius:8px;border:1px solid var(--border);background:transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;
  color:var(--muted2);flex-shrink:0;transition:all .1s;touch-action:manipulation}
.tag-btn.tagged{border-color:var(--gold);color:var(--gold)}
.tag-row{display:flex;gap:5px;padding:6px 10px 8px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.tag-chip{padding:8px 13px;border-radius:20px;border:1px solid var(--border);background:var(--bg);
  font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .1s;touch-action:manipulation}
.tag-chip.on{border-color:var(--navy);background:var(--ndim);color:var(--navy)}
.tag-chip.pain{border-color:var(--red);background:var(--rdim);color:var(--red)}

/* ── STAT GRIDS ── */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair)}
.sc{background:var(--card);padding:12px 14px}
.sv{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.03em}
.slb{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:3px}

/* ── LIST ITEMS ── */
.hi{display:flex;align-items:center;padding:13px 14px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .08s;touch-action:manipulation}
.hi:last-child{border-bottom:none}
.hi:active{background:var(--bg)}
.hn{font-size:14px;font-weight:600;letter-spacing:-.01em}
.hm{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.sui{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.sui:last-child{border-bottom:none}
.tog{width:46px;height:27px;border-radius:14px;border:1.5px solid var(--border);background:var(--bg2);
  cursor:pointer;position:relative;transition:all .18s;flex-shrink:0;touch-action:manipulation}
.tog::after{content:'';position:absolute;width:19px;height:19px;border-radius:50%;
  background:var(--card);top:3px;left:3px;transition:all .18s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tog.on{border-color:var(--green);background:var(--green)}
.tog.on::after{transform:translateX(19px)}
.exi{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .08s;touch-action:manipulation}
.exi:last-child{border-bottom:none}
.exi:active{background:var(--bg)}
.exin{font-size:14px;font-weight:500;flex:1;letter-spacing:-.01em}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.02em}
.bg{background:var(--gdim);color:var(--gold)}
.ba{background:var(--ndim);color:var(--navy)}
.bp{background:var(--navy);color:#fff}
.exmus{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:13px}
.exmus-k{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2)}
.exmus-k:not(:first-child){margin-left:6px}
.bm-cap2{text-align:center;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-top:1px}
.bm-mw-rg{cursor:pointer;transition:opacity .14s}
.bm-mw-rg:active{opacity:.55}

/* ── FILTER BARS ── */
.sw{padding:10px 13px;border-bottom:1px solid var(--border)}
.fr{display:flex;gap:6px;padding:8px 13px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.fr::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:20px;border:1px solid var(--border);
  background:var(--bg);color:var(--muted);font-size:11px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .1s;touch-action:manipulation}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
/* ── BARCODE SCANNER ── */
#scan-video{background:#000}
.ptabs{display:flex;border-bottom:1px solid var(--border);padding:0 14px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex-shrink:0;padding:11px 12px;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;
  cursor:pointer;transition:all .1s;background:none;border-top:none;border-left:none;
  border-right:none;margin-bottom:-1px;touch-action:manipulation}
.ptab.on{color:var(--navy);border-bottom-color:var(--navy)}

/* ── FORMS ── */
.fg{margin-bottom:14px}
.fl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;display:block}
.frow{display:flex;align-items:center;gap:8px}
.ib{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--card);
  color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;font-size:14px;transition:all .1s;touch-action:manipulation;box-shadow:var(--shadow)}
.ib:active{background:var(--bg);transform:scale(.94)}
.ib-wide{width:auto;padding:0 11px;gap:5px;font-family:var(--mono);font-size:12px;font-weight:600}

/* ── MISC ── */
.empty{text-align:center;padding:52px 24px;color:var(--muted)}
.etit{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;letter-spacing:-.02em}
.chart-wrap{padding:12px;position:relative;height:200px}
.toast{position:fixed;top:calc(var(--st) + 14px);left:50%;transform:translateX(-50%);background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:9px 18px;font-size:13px;font-weight:600;
  z-index:999;animation:tin .16s ease,tout .2s ease 2s both;color:var(--text);
  box-shadow:var(--shadow-md);width:max-content;max-width:calc(100vw - 28px);text-align:center;line-height:1.35}
.toast-act{display:flex;align-items:center;gap:12px;text-align:left;padding:7px 7px 7px 16px}
.toast-btn{flex-shrink:0;border:none;border-radius:9px;background:var(--navy);color:#fff;font:inherit;font-weight:700;padding:9px 14px;cursor:pointer}
#save-warn{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:998;background:var(--red);color:#fff;
  display:flex;gap:10px;align-items:center;padding:calc(var(--st) + 9px) 12px 9px;font-size:12px;line-height:1.4}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes tout{to{opacity:0;transform:translateX(-50%) translateY(-5px)}}
.wsr{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.wsr:last-child{border-bottom:none}
.afill-tag{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--green);background:var(--grdim);border-radius:4px;padding:1px 6px;margin-left:5px}
/* ── DRAG HANDLE ── */
.drag-handle{width:32px;height:44px;display:flex;align-items:center;justify-content:center;
  color:var(--muted2);cursor:grab;flex-shrink:0;touch-action:none;font-size:14px;letter-spacing:.5px}
.drag-handle:active{cursor:grabbing;color:var(--muted)}
.drag-placeholder{background:var(--ndim);border:2px dashed var(--navy);border-radius:10px;margin-bottom:5px;transition:height .1s}
/* ── COLOR SWATCHES ── */
.color-swatch{width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid transparent;
  transition:transform .1s,border-color .1s;flex-shrink:0;touch-action:manipulation}
.color-swatch.on{border-color:var(--text);transform:scale(1.12)}
.color-swatch:active{transform:scale(.93)}
.rtn-ex{padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:7px}
.rtn-ctl{display:flex;align-items:flex-end;gap:12px;margin-top:9px;flex-wrap:wrap}
.rtn-grp{display:flex;flex-direction:column;gap:3px}
.rtn-grp-row{display:flex;align-items:center;gap:4px}
.rtn-lbl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2)}
.rtn-stepbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--navy);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.rtn-stepbtn:active{transform:scale(.92)}
.rtn-val{font-family:var(--mono);font-size:12px;font-weight:600;min-width:40px;text-align:center}
.rtn-reps{width:58px;padding:7px 4px;font-size:15px;text-align:center}
input.rtn-reps[type=number]{font-size:15px}
.rtn-dash,.rtn-unit{font-size:11px;color:var(--muted);font-weight:600}
.rtn-sum{font-family:var(--mono);font-size:11px;color:var(--navy);font-weight:600;margin-top:1px;min-height:13px}
.rtn-note{margin-top:9px;font-size:13px;padding:8px 10px}
.rtn-type{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.rtn-type button{padding:9px 11px;font-size:11px;font-weight:600;background:var(--card);color:var(--muted);border:none;border-right:1px solid var(--border);cursor:pointer;white-space:nowrap}
.rtn-type button:last-child{border-right:none}
.rtn-type button.on{background:var(--ndim);color:var(--navy)}
/* ── Superset brackets ── */
.ss-wrap{position:relative;margin-left:6px;padding-left:10px;border-left:3px solid var(--navy);border-radius:0}
.ss-wrap .exb:first-child{margin-top:0}.ss-wrap .exb:last-child{margin-bottom:0}
.ss-lbl{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);padding:2px 8px 4px 10px;margin:0 13px}
.ss-link-btn{font-size:11px;font-weight:700;color:var(--navy);background:var(--ndim);border:1px solid var(--nbright);border-radius:8px;padding:9px 11px;cursor:pointer;white-space:nowrap}
.ss-link-btn.linked{background:var(--navy);color:#fff;border-color:var(--navy)}
.ss-link-btn:active{transform:scale(.95)}
/* Muscle chip picker (secondary muscle selection) */
.mchip-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.mchip{font-size:12px;font-weight:600;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;transition:all .15s}
.mchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.mchip:active{transform:scale(.95)}
/* Routine editor superset visual */
.rtn-ss-wrap{border-left:3px solid var(--navy);margin-left:4px;padding-left:6px;border-radius:0}
.rtn-ss-lbl{font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);padding:3px 0 2px 2px}
/* Import modal */
.import-ta{width:100%;min-height:120px;font-family:var(--mono);font-size:11px;line-height:1.5;padding:10px;border:1px solid var(--border);border-radius:var(--rm);background:var(--bg);color:var(--text);resize:vertical}
.import-preview{border:1px solid var(--border);border-radius:var(--rm);overflow:hidden;margin:10px 0}
.import-row{padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px}
.import-row:last-child{border-bottom:none}
.ir-name{font-weight:600;font-size:13px}.ir-meta{font-size:10px;color:var(--muted);margin-top:2px}
.import-warn{font-size:11px;color:var(--gold);background:var(--gdim);border-radius:7px;padding:7px 10px;margin:8px 0}
.bm-svg{width:100%;height:auto;display:block}
.bm-rg{cursor:pointer;stroke:var(--card);stroke-width:1;transition:opacity .12s}
.bm-rg:active{opacity:.55}
.bm-cap{fill:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;font-family:var(--sans)}
.bm-dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:3px}
.ol-badge{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--blue);background:var(--bdim);border-radius:4px;padding:1px 6px;margin-left:5px;
  border:1px solid rgba(36,104,184,.18)}
.pain-banner{margin:8px 13px;padding:10px 14px;background:var(--rdim);border:1px solid rgba(176,53,53,.22);
  border-radius:10px;font-size:12px;color:var(--red);font-weight:600}
.plate-visual{display:flex;flex-wrap:wrap;gap:5px;padding:12px;background:var(--bg);
  border-radius:10px;margin-bottom:10px;align-items:center;justify-content:center;min-height:52px}
.plate{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;
  font-family:var(--mono);font-weight:700;font-size:11px;padding:7px 10px;border:2px solid}
.p45{background:#1b3353;color:#fff;border-color:#1b3353}.p35{background:#b07828;color:#fff;border-color:#b07828}
.p25{background:#27724a;color:#fff;border-color:#27724a}.p10{background:#2468b8;color:#fff;border-color:#2468b8}
.p5{background:#b03535;color:#fff;border-color:#b03535}.p2{background:var(--bg2);color:var(--text);border-color:var(--border)}
.macro-bar-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:5px 0 2px}
.macro-bar-fill{height:100%;border-radius:3px;transition:width .4s ease}
.sched-day{width:38px;height:42px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all .1s;font-size:9px;font-weight:700;letter-spacing:.03em;
  text-transform:uppercase;color:var(--muted);gap:2px;touch-action:manipulation}
.sched-day.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(27,51,83,.25)}
.eq-preset{border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;
  transition:all .1s;background:var(--card);display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow);touch-action:manipulation}
.eq-preset:active{background:var(--bg);transform:scale(.98)}
.eq-preset.on{border-color:var(--navy);background:var(--ndim)}
.insight-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;margin-bottom:10px;cursor:pointer;transition:all .1s;box-shadow:var(--shadow);touch-action:manipulation}
.insight-card:active{background:var(--bg)}

/* ── PROGRESS DASH ── */
.dash-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  margin:0 13px 8px;overflow:hidden;box-shadow:var(--shadow)}
.dash-hdr{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;
  user-select:none;transition:background .08s;touch-action:manipulation}
.dash-hdr:active{background:var(--bg)}
.dash-icon{font-size:15px;flex-shrink:0;width:34px;height:34px;display:flex;align-items:center;
  justify-content:center;background:var(--bg2);border-radius:10px}
.dash-info{flex:1;min-width:0}
.dash-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.dash-sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-chev{color:var(--muted2);font-size:16px;transition:transform .2s;line-height:1;flex-shrink:0}
.dash-chev.open{transform:rotate(90deg)}
.dash-body{border-top:1px solid var(--border)}

/* ── CALENDAR ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border)}
.cal-day-hdr{background:var(--bg);padding:6px 0;text-align:center;font-size:9px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cal-cell{background:var(--card);padding:5px 3px;min-height:50px;cursor:pointer;transition:background .08s;touch-action:manipulation;position:relative}
.cal-goal-tri{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 9px 9px 0}
.cal-cell:active{background:var(--bg2)}.cal-cell.empty{background:var(--bg);cursor:default}
.cal-cell.today .cal-date{background:var(--navy);color:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(27,51,83,.3)}
.cal-cell.rest-day{background:rgba(27,51,83,.02)}
.cal-date{width:25px;height:25px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;margin:0 auto 3px}
.cal-dots{display:flex;justify-content:center;gap:2px;flex-wrap:wrap;min-height:7px}
.cal-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.act-icon{width:34px;height:34px;border-radius:9px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-right:10px}
.mvrow{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
.mvrow:last-child{border-bottom:none}
.mvname{flex:1;font-size:12px;font-weight:500}
.aft-total{background:var(--navy);color:#fff;margin:0 13px 10px;border-radius:var(--r);padding:16px;box-shadow:var(--shadow-md)}
.aft-bar-track{height:7px;background:var(--bg2);border-radius:4px;margin:7px 0 4px;position:relative}
.aft-bar-fill{height:100%;border-radius:3px;transition:width .35s ease}
.aft-bar-goal{position:absolute;top:-4px;width:3px;height:15px;background:var(--navy);border-radius:2px;transform:translateX(-50%)}
.aft-bar-min{position:absolute;left:60%;top:-2px;width:1.5px;height:11px;background:var(--muted);opacity:.7}
.aft-time{display:flex;align-items:center;gap:4px}
.aft-time span{font-weight:700;color:var(--muted)}
.aft-time input,.aft-inp{padding:8px 4px;font-size:16px;text-align:center;min-width:0}
.aft-row{padding:11px 14px;border-bottom:1px solid var(--border)}
.aft-row:last-child{border-bottom:none}
.meas-chg{font-size:10px;font-weight:600;margin-left:6px}

/* ── HOME CARDS ── */
.hype-section{margin:0 13px 10px}
.routine-today{background:var(--navy);border-radius:var(--r);padding:18px;color:#fff;
  position:relative;overflow:hidden;box-shadow:var(--shadow-md)}
.routine-today::before{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;
  border-radius:50%;background:rgba(255,255,255,.05)}
.routine-today::after{content:'';position:absolute;right:10px;bottom:-40px;width:100px;height:100px;
  border-radius:50%;background:rgba(255,255,255,.03)}
.stat-mini{background:var(--card);border:1px solid var(--border);border-radius:11px;
  padding:11px 10px;text-align:center;box-shadow:var(--shadow)}
.stat-mini-val{font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:-.02em}
.stat-mini-lbl{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:3px}

/* ── MODES ── */
.mode-card{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);
  padding:18px 16px;cursor:pointer;transition:all .12s;touch-action:manipulation}
.mode-card:active{background:var(--bg2);transform:scale(.98)}

/* ── CARD DECK ── */
.cd-card{width:200px;height:300px;background:var(--card);border-radius:18px;position:relative;
  box-shadow:0 8px 32px rgba(0,0,0,.13),0 2px 8px rgba(0,0,0,.08);
  cursor:pointer;user-select:none;touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .1s;-webkit-user-select:none}
.cd-card:active{transform:scale(.96)}
.cd-corner-tl{position:absolute;top:14px;left:16px;text-align:left;line-height:1.15}
.cd-corner-br{position:absolute;bottom:14px;right:16px;text-align:right;transform:rotate(180deg);line-height:1.15}
.cd-corner-val{font-size:20px;font-weight:700;font-family:var(--mono);line-height:1}
.cd-corner-sym{font-size:15px;line-height:1.2}
.cd-main-sym{font-size:62px;line-height:1}
.cd-main-val{font-size:38px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em;line-height:1}
.cd-reps-lbl{font-size:13px;margin-top:6px;font-family:var(--mono);font-weight:500;color:var(--muted)}

/* ── SESSION: header actions + footer ── */
.exb-acts{display:flex;align-items:center;gap:7px;margin-top:10px}
.exb-foot{display:flex;gap:7px;padding:9px 10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--border)}
.ex-target{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--navy);margin-top:3px}
.ex-note{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}

/* ── HISTORY: per-set chips (tap to leave a set out of records) ── */
.set-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.set-chip{font-family:var(--mono);font-size:11px;padding:5px 8px;border-radius:7px;background:var(--bg);border:1px solid var(--border);color:var(--text);cursor:pointer;touch-action:manipulation}
.set-chip.warm{color:var(--gold);border-color:rgba(176,120,40,.25);cursor:default}
.set-chip.excl{text-decoration:line-through;color:var(--muted2);background:transparent}

/* ── IMPORT / AI PREVIEW ── */
.ip-g{padding:8px 12px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);background:var(--ndim);border-bottom:1px solid var(--border)}
.ip-g span{font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:6px}
.ip-r{border-bottom:1px solid var(--border);padding:0 12px}
.ip-r:last-child{border-bottom:none}
.ip-r summary{display:flex;align-items:center;gap:8px;padding:11px 0;cursor:pointer;list-style:none}
.ip-r summary::-webkit-details-marker{display:none}
.ip-chev{color:var(--muted2);font-size:16px;transition:transform .15s}
.ip-r[open] .ip-chev{transform:rotate(90deg)}
.ip-ex{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px solid var(--hair)}
.import-preview>.ip-ex{padding:7px 12px}
.ip-exn{font-size:12px;font-weight:600}
.ip-exs{font-size:10px;color:var(--muted);margin-top:1px;line-height:1.4}
.ip-tgt{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--navy);flex-shrink:0;text-align:right}
.ip-tgt span{color:var(--muted);font-weight:500}
.ip-opt{display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.45;padding:9px 2px;color:var(--text)}
.ip-opt input{width:22px;height:22px;flex-shrink:0;padding:0;-webkit-appearance:auto;appearance:auto;accent-color:var(--navy)}
.ai-note{font-size:12px;line-height:1.5;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:11px 12px;margin-bottom:12px}
.ai-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;background:var(--ndim);color:var(--navy);border-radius:8px;padding:5px 5px 5px 9px}
.ai-chip button{border:none;background:transparent;color:inherit;font-size:12px;width:26px;height:26px;cursor:pointer}
.ai-busy{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;color:var(--navy);margin-top:12px}
.ai-busy span:nth-child(2){flex:1}
.ai-spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--nbright);border-top-color:var(--navy);animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SETTINGS ── */
.set-sec{border-top:1px solid var(--border);padding-top:14px;margin-bottom:14px}
.set-row{margin-bottom:10px;min-height:34px}
.set-lbl{font-size:13px;font-weight:500;flex:1}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

function normMuscle(m){

function muscleContribs(exId){
  const info=getEx(exId);if(!info||!info.muscle)return[];
  const pm=normMuscle(info.muscle);

  (SEC_MUSCLE[exId]||[]).forEach(m=>{const mm=normMuscle(m);if(mm!==pm&&MEV_MAV[mm])out.push({muscle:mm,w:0.5});});

}
// Contribution-weighted working sets per muscle for completed workouts in [start,end).
function muscleSetsInRange(start,end){
  const m={};Object.keys(MEV_MAV).forEach(k=>m[k]=0);
  S.workouts.filter(w=>w.started>=start&&w.started<end).forEach(wk=>{
    wk.exercises.forEach(ex=>{
      const done=ex.sets.filter(setCounts).length;if(!done)return;
      muscleContribs(ex.exId).forEach(c=>{if(m[c.muscle]!==undefined)m[c.muscle]+=done*c.w;});

  });
  return m;
}

function inferDaysPerWeek(){const ago=Date.now()-28*86400000;const n=S.workouts.filter(w=>w.started>=ago).length;return n?Math.min(7,Math.max(1,Math.round(n/4))):4;}

function routineMuscleSets(routine){
  const m={};(routine.exercises||[]).forEach(ex=>{const n=parseInt(ex.sets)||0;if(!n)return;muscleContribs(ex.exId).forEach(c=>{m[c.muscle]=(m[c.muscle]||0)+n*c.w;});});
  return m;
}
// Projected contribution-weighted sets per muscle over a rolling 2 weeks for a group.
function groupProjection(g){
  const proj={};Object.keys(MEV_MAV).forEach(k=>proj[k]=0);
  const routines=(g.routineIds||[]).map(id=>(S.routines||[]).find(r=>r.id===id)).filter(Boolean);
  let sessions=0;
  if(g.mode==='daypicker'){
    routines.forEach(r=>{const days=((g.dayMap||{})[r.id]||[]).length;if(!days)return;sessions+=days*2;const ms=routineMuscleSets(r);Object.keys(ms).forEach(k=>{if(proj[k]!==undefined)proj[k]+=ms[k]*days*2;});});
  }else{
    const D=g.daysPerWeek||inferDaysPerWeek();const N=routines.length||1;sessions=Math.round(2*D);const runs=(2*D)/N;
    routines.forEach(r=>{const ms=routineMuscleSets(r);Object.keys(ms).forEach(k=>{if(proj[k]!==undefined)proj[k]+=ms[k]*runs;});});
  }
  return{proj,sessions,nRoutines:routines.length};

// ═══════════════════════════════════════════════════
const LIFT_MET=4.5;                    // gross METs for resistance training

  const r=S.aftAge||'22-26';const m=r.match(/^(\d+)/);const lo=m?parseInt(m[1]):24;

function userAge(){

    if(S.birthMonth&&now.getMonth()<(parseInt(S.birthMonth)-1))a--;

function estSpeedMph(type){

// ═══════════════════════════════════════════════════

// Per-day overrides set from the calendar still take precedence.

// (the calendar simply won't shade rest days in that case).
function isTrainingDay(ds){

  if(rovRid==='rest')return false;

    .map(id=>(S.routines||[]).find(r=>r.id===id)?.name).filter(Boolean);

//  - with a rotation (no fixed days), it ends after three idle days in a row.
// Today can't break a streak — the day isn't over yet.
function getStreak(){

    cursor=end;

function currentProgramPhase(ds){

function resolveProgramGroup(){

  if(phase&&phase.groupId){
    const target=(S.groups||[]).find(g=>g.id===phase.groupId);

  if(ovRid==='rest')return null;
  if(ovRid){const r=(S.routines||[]).find(x=>x.id===ovRid);if(r)return r;}
  const g=getActiveGroup();if(!g||!(g.routineIds||[]).length)return null;

// ─── Personal records ───
// PRs are DERIVED from logged sets, never stored incrementally. Unchecking a set, discarding a
// workout or deleting one removes its PR automatically. A set marked `excl` (a typo, a bad
// entry) is ignored. S.prsManual holds records carried over from before this was the case.
function prCandidate(ex,s){
  if(!setCounts(s)||s.excl||ex.timed)return null;
  const w=parseFloat(s.w),r=parseInt(s.r);
  if(!(w>0)||!(r>0))return null;
  return{w,r,est:e1rm(w,r)};
}
function betterPR(a,b){return !b||a.est>b.est||(a.est===b.est&&a.w>b.w);}
function computeHistoryPRs(workouts){
  const prs={};
  (workouts||[]).forEach(wk=>(wk.exercises||[]).forEach(ex=>(ex.sets||[]).forEach(s=>{
    const c=prCandidate(ex,s);if(!c)return;
    if(betterPR(c,prs[ex.exId]))prs[ex.exId]={w:c.w,r:c.r,est:c.est,date:dayOf(wk.started),wkId:wk.id};
  })));
  return prs;
}
function rebuildPRs(){
  const prs=computeHistoryPRs(S.workouts);
  const aw=S.activeWorkout;
  if(aw)(aw.exercises||[]).forEach(ex=>(ex.sets||[]).forEach(s=>{
    const c=prCandidate(ex,s);if(!c)return;
    if(betterPR(c,prs[ex.exId]))prs[ex.exId]={w:c.w,r:c.r,est:c.est,date:dayOf(aw.started),wkId:aw.id,live:true};
  }));
  Object.keys(S.prsManual||{}).forEach(id=>{
    const p=S.prsManual[id];if(!p||!(p.est>0))return;
    if(betterPR(p,prs[id]))prs[id]={w:p.w,r:p.r,est:p.est,date:p.date||null,manual:true};
  });
  S.prs=prs;
  return prs;
}
// Best record for an exercise NOT counting the workout in progress — what a new set has to beat.
function priorBest(exId){
  const h=memo('histPRs',()=>computeHistoryPRs(S.workouts))[exId];
  const m=(S.prsManual||{})[exId];
  if(h&&m)return betterPR(m,h)?m:h;
  return h||m||null;
}

// ─── Strength history ───
// One point per session, oldest first: the best estimated 1RM among working sets.
function getExStrData(exId){
  return memo('str:'+exId,()=>{
    const out=[];
    for(let i=S.workouts.length-1;i>=0;i--){
      const wk=S.workouts[i];
      let best=null,maxW=0,vol=0;
      wk.exercises.forEach(ex=>{
        if(ex.exId!==exId)return;
        ex.sets.forEach(s=>{
          const c=prCandidate(ex,s);if(!c)return;
          vol+=c.w*c.r;if(c.w>maxW)maxW=c.w;
          if(betterPR(c,best))best=c;
        });
      });
      if(best)out.push({label:fmtShort(wk.started),date:wk.started,maxW,vol,e1rm:best.est,w:best.w,r:best.r});
    }
    return out;
  });
}
function getExsWithHist(){
  return memo('exsHist',()=>{
    const ids=new Set();
    S.workouts.forEach(wk=>wk.exercises.forEach(ex=>{if(ex.sets.some(s=>prCandidate(ex,s)))ids.add(ex.exId);}));
    return[...ids];
  });
}
function getProgressWins(exIds){
  const wins=[];
  (exIds||getExsWithHist()).forEach(exId=>{
    const hist=getExStrData(exId);
    if(hist.length<3)return;
    const newest=hist[hist.length-1].e1rm;
    const oldest=hist[0].e1rm;
    const pct=oldest>0?Math.round((newest-oldest)/oldest*100):0;
    if(pct>=5)wins.push({exId,name:exName(exId),pct,sessions:hist.length});
  });
  return wins.sort((a,b)=>b.pct-a.pct).slice(0,2);
}
function getPRProximity(){
  const results=[];
  Object.entries(S.prs).forEach(([exId,pr])=>{
    const hist=getExStrData(exId);if(!hist.length)return;
    const recent=hist[hist.length-1];
    const gap=Math.round(pr.est-recent.e1rm);
    if(gap>0&&gap<=pr.est*0.08)results.push({exId,name:exName(exId),gap,prEst:pr.est});
  });
  return results.slice(0,1);
}
// Muscles whose weekly volume has risen for 2–3 weeks running. Uses the same weighted,
// warmup-excluding set count as the Volume and Fatigue cards.
function getVolumeMomentum(){
  const now=Date.now(),WK=7*86400000;

  const results=[];
  Object.keys(MEV_MAV).forEach(m=>{

    else if(a>0&&a>b&&b>0)results.push({muscle:MEV_MAV[m].lbl,weeks:2,val:a});

}
function getStagnantExercises(exIds){
  const stag=[];
  (exIds||[]).forEach(exId=>{
    const hist=getExStrData(exId);if(hist.length<3)return;
    const last3=hist.slice(-3).map(h=>h.e1rm);
    const mx=Math.max(...last3),mn=Math.min(...last3);
    if(mx-mn<=1)stag.push({exId,name:exName(exId),sessions:3});

// Wilks / DOTS from ESTIMATED 1RMs (a 225×10 PR is not a 225 squat). Front squat may stand in
// for the back squat and sumo for the deadlift; a hex-bar pull is not a squat and is not used.
function getWilksData(){
  const pr=S.prs;
  const pick=ids=>{for(const id of ids){if(pr[id])return{id,est:pr[id].est,sub:id!==ids[0]};}return null;};
  const sq=pick(['squat','front-squat']),bench=pick(['bb-bench']),dl=pick(['deadlift','sumo-dl']);
  if(!sq||!bench||!dl)return null;
  const total=sq.est+bench.est+dl.est;
  const gn=S.aftGender||'male';
  const bwK=bwKg(),totK=toKg(total);
  const aw=gn==='female'?[594.31747775582,-27.23842536447,0.82112226871,-0.00930733913,4.731582e-5,-9.054e-8]:[-216.0475144,16.2606339,-0.002388645,-0.00113732,7.01863e-6,-1.291e-8];
  const dw=aw[0]+aw[1]*bwK+aw[2]*bwK**2+aw[3]*bwK**3+aw[4]*bwK**4+aw[5]*bwK**5;
  const wilks=Math.round(500/dw*totK*10)/10;

  const dots=Math.round(500/ad*totK*10)/10;

}
// Strength standards compare an estimated 1RM against bodyweight multiples.
function getStdLevels(){

// ─── Army Fitness Test ───
function aftAgeIdx(age){const hi=[21,26,31,36,41,46,51,56,61];for(let i=0;i<hi.length;i++)if(age<=hi[i])return i;return 9;}
function aftAgeBracket(){return AFT_AGE_GROUPS[aftAgeIdx(userAge())];}
function aftIsCombat(){return S.aftStandard==='combat';}
// Column in the score tables: age group, then male-or-combat (0) / female (1).
// The combat standard is sex-neutral and scored on the male column.
function aftColumn(){return aftAgeIdx(userAge())*2+((S.aftGender==='female'&&!aftIsCombat())?1:0);}
function aftEvent(id){return AFT_EVENTS.find(e=>e.id===id);}
// Points (0–100) for a raw result, or null when nothing is entered. Results that fall between
// two rows earn the lower row; a result below the lowest row on the table earns 0.
function aftScore(evId,val,col){
  const t=AFT_TABLES[evId];if(!t||val===''||val==null)return null;
  const v=parseFloat(val);if(isNaN(v))return null;
  if(col==null)col=aftColumn();
  const high=aftEvent(evId).dir==='high';
  for(let p=100;p>=0;p--){
    const row=t[p];if(!row)continue;
    const req=row[col];if(req==null)continue;
    if(high?v>=req:v<=req)return p;
  }
  return 0;
}
// Raw result needed for a given number of points (nearest row at or above it).
function aftNeed(evId,points,col){
  const t=AFT_TABLES[evId];if(col==null)col=aftColumn();
  for(let p=points;p<=100;p++){const row=t[p];if(row&&row[col]!=null)return row[col];}
  return null;
}
function aftFmtRaw(evId,v){
  if(v==null||v==='')return'–';
  const e=aftEvent(evId);
  return e.unit==='time'?fmtMS(v):`${v} ${e.unit}`;
}
// Totals and pass/fail for a set of raw results {MDL:…, HRP:…}.
function aftSummary(raw,col){
  const scores={};let n=0,total=0,minEv=100;
  AFT_EVENTS.forEach(e=>{const s=aftScore(e.id,raw[e.id],col);scores[e.id]=s;if(s!==null){n++;total+=s;if(s<minEv)minEv=s;}});
  const need=aftIsCombat()?350:300;
  const complete=n===AFT_EVENTS.length;
  return{scores,n,total,complete,need,pass:complete?(minEv>=60&&total>=need):null,minEv:n?minEv:null};
}

function makeOv(id){
  if(id){const old=document.getElementById(id);if(old)old.remove();}
  const ov=document.createElement('div');ov.className='ov';if(id)ov.id=id;
  ov.addEventListener('click',e=>{if(e.target===ov)dismissOv(ov);});
  return ov;
}
function dismissOv(ov){
  if(!ov)return;
  const modal=ov.querySelector('.modal');
  if(modal){modal.style.transition='transform .22s cubic-bezier(.22,.61,.36,1)';modal.style.transform='translateY(100%)';}
  ov.style.pointerEvents='none';
  setTimeout(()=>ov.remove(),220);
}
function closeOv(id){dismissOv(document.getElementById(id));}
function attachSwipeDown(ov){
  const handle=ov.querySelector('.mh');const modal=ov.querySelector('.modal');
  if(!handle||!modal)return;
  let startY=0,startT=0,dragging=false;
  handle.style.touchAction='none';
  handle.addEventListener('pointerdown',e=>{
    startY=e.clientY;startT=Date.now();dragging=true;
    modal.style.transition='none';
    try{handle.setPointerCapture(e.pointerId);}catch(ex){}
  });
  handle.addEventListener('pointermove',e=>{
    if(!dragging)return;const dy=e.clientY-startY;
    if(dy>0)modal.style.transform=`translateY(${dy}px)`;
  });
  handle.addEventListener('pointerup',e=>{
    if(!dragging)return;dragging=false;
    const dy=e.clientY-startY,dt=Math.max(1,Date.now()-startT);
    if(dy>80||dy/dt>0.5)dismissOv(ov);
    else{modal.style.transition='transform .22s cubic-bezier(.22,.61,.36,1)';modal.style.transform='';}
  });
  handle.addEventListener('pointercancel',()=>{
    dragging=false;modal.style.transition='transform .22s cubic-bezier(.22,.61,.36,1)';modal.style.transform='';
  });
}
// toast(msg[, color[, {action,onAction,ms}]]) — msg is plain text. With an action it stays up

let _toastTimer=null;

// customConfirm(msgHtml,label,cb[,opts]) — msgHtml is trusted markup written in this codebase;

// ─── Rest timer ───
// Driven by an END TIMESTAMP (S.restTimer), not by counting ticks. iOS freezes timers when the
// phone locks or the app is backgrounded; on return the display is recomputed from the clock,

let rInt=null;

  if(rInt)clearInterval(rInt);rInt=null;

function tickRest(){

  const rem=restRemaining();

    const late=Math.round((Date.now()-t.end)/1000);

let wtInt=null;

// ─── Screen wake lock ───
// Keeps the display on while a session is running so the rest timer stays visible and audible.
// Not available everywhere; failures are silent and the timer still self-corrects on return.
let _wakeLock=null;
function sessionActive(){return !!(S.activeWorkout||S.activeCardDeck||S.activeSprintTimer);}
async function syncWakeLock(){
  const want=!!S.keepAwake&&sessionActive()&&document.visibilityState==='visible';
  try{
    if(want&&!_wakeLock&&navigator.wakeLock){
      _wakeLock=await navigator.wakeLock.request('screen');
      _wakeLock.addEventListener('release',()=>{_wakeLock=null;});
    }else if(!want&&_wakeLock){const w=_wakeLock;_wakeLock=null;await w.release();}
  }catch(e){_wakeLock=null;}
}

// ─── Save-failure banner ───
function showSaveWarning(on){
  let el=document.getElementById('save-warn');
  if(!on){if(el)el.remove();return;}
  if(el)return;
  el=document.createElement('div');el.id='save-warn';
  el.innerHTML=`<div style="flex:1"><b>Changes aren't being saved.</b> Storage is full or blocked on this device. Export a backup now so nothing is lost.</div><button class="btn bsm" style="background:#fff;color:var(--red);flex-shrink:0" onclick="exportData()">Export</button>`;
  document.body.appendChild(el);
}

// ─── Error boundary ───
// render() clears the screen before drawing, so an exception used to leave a blank page.
// Any render failure now lands on a recovery screen that can still export the data.
const _errLog=[];
let _lastErrToast=0;
function errText(e){return e&&e.message?e.message:String(e);}
function logError(e,where){
  try{console.error('[Lah We]',where||'',e);}catch(x){}
  _errLog.push({t:Date.now(),where:where||'',msg:errText(e),stack:String((e&&e.stack)||'').slice(0,1500)});
  if(_errLog.length>20)_errLog.shift();
  if(Date.now()-_lastErrToast>4000){
    _lastErrToast=Date.now();
    try{toast('Something went wrong: '+errText(e).slice(0,80),'red',{ms:4500});}catch(x){}
  }
}
function renderCrash(c,e,where){
  logError(e,where||'render');
  const nav=document.getElementById('nav');if(nav)nav.style.display='flex';
  c.innerHTML=`<div style="padding:40px 20px;text-align:center">
    <div style="color:var(--red);margin-bottom:12px">${ICON('alert',38)}</div>
    <div class="etit">This screen hit an error</div>
    <div style="font-size:12px;color:var(--muted);line-height:1.6;margin:6px 0 4px">Your data is still stored on this device. Export a backup first, then reload.</div>
    <div class="mono" style="font-size:10px;color:var(--muted2);background:var(--bg2);border-radius:8px;padding:8px 10px;margin:12px 0 18px;text-align:left;word-break:break-word">${esc(errText(e)).slice(0,400)}</div>
    <button class="btn btp bfw" style="margin-bottom:9px" onclick="exportData()">Export backup</button>
    <button class="btn bts bfw" style="margin-bottom:9px" onclick="location.reload()">Reload app</button>
    <button class="btn btg bfw" onclick="go('workout')">Go to home</button>
  </div>`;
}
// Stored data exists but can't be parsed. Nothing is overwritten until the user chooses.
function renderCorrupt(c){
  const nav=document.getElementById('nav');if(nav)nav.style.display='none';
  c.innerHTML=`<div style="padding:40px 20px;text-align:center">
    <div style="color:var(--red);margin-bottom:12px">${ICON('alert',38)}</div>
    <div class="etit">Saved data couldn't be read</div>
    <div style="font-size:12px;color:var(--muted);line-height:1.6;margin:6px 0 18px">The data stored on this device is damaged. It has NOT been deleted. Download it so it can be repaired, or restore from one of your backups.</div>
    <button class="btn btp bfw" style="margin-bottom:9px" onclick="downloadText('lahwe-unreadable-'+today()+'.txt',Store.corrupt||'')">Download the damaged data</button>
    <button class="btn bts bfw" style="margin-bottom:9px" onclick="importData()">Restore from a backup file</button>
    <button class="btn btg bfw" onclick="startFreshFromCorrupt()">Start fresh (keeps a copy of the old data)</button>
  </div>`;
}
function startFreshFromCorrupt(){
  customConfirm('The damaged data will be kept under a separate key on this device, and the app will start empty.','Start fresh',()=>{
    Store.lsSet(STORE_KEY+'_corrupt_'+Date.now(),Store.corrupt||'');
    replaceState(null);
    document.getElementById('nav').style.display='none';
    go('workout');
  });
}
if(typeof window!=='undefined'&&window.addEventListener){
  // "ResizeObserver loop…" is a harmless browser notice (Chart.js triggers it), not an app failure.
  window.addEventListener('error',ev=>{if(/ResizeObserver/.test(String(ev.message||'')))return;logError(ev.error||ev.message,'uncaught');});
  window.addEventListener('unhandledrejection',ev=>logError(ev.reason,'promise'));
}

// ═══════════════════════════════════════════════════
// NAV + RENDER
// ═══════════════════════════════════════════════════
const TABS=['workout','history','progress','nutrition','library'];
function go(tab){
  if(!TABS.includes(tab))tab='workout';
  S.tab=tab;killCharts();
  if(tab==='history'){S.calMonth=new Date().getMonth();S.calYear=new Date().getFullYear();}
  document.querySelectorAll('.nb').forEach((b,i)=>b.classList.toggle('on',TABS[i]===tab));
  render();
}
// Top-level render. It clears the screen first, so everything below runs inside a boundary:
// a failure shows a recovery screen instead of a blank page.
function render(){
  const c=document.getElementById('content');
  try{
    c.innerHTML='';c.scrollTop=0;
    if(Store.corrupt){renderCorrupt(c);return;}
    if(!S.onboarded){renderOnboarding(c);return;}
    if(S.tab==='workout')renderWorkout(c);
    else if(S.tab==='history')renderHistory(c);
    else if(S.tab==='progress')renderProgress(c);
    else if(S.tab==='nutrition')renderNutrition(c);
    else if(S.tab==='library')renderLibrary(c);
  }catch(e){renderCrash(c,e,'render:'+S.tab);}
  syncWakeLock();
}
// Re-draw whichever screen is showing (used after data changes made from a sheet).
function rerender(){render();}

// 7-day-average bodyweight trend (per week, in the user's unit) for home cards.
function bwRateInfo(){
  const bwl=S.bodyweightLog||[];if(bwl.length<2)return null;
  const now=Date.now();
  const within=(a,b)=>bwl.filter(e=>{const t=dayDate(e.date).getTime();return t>now-b*86400000&&t<=now-a*86400000;});
  const avg=arr=>arr.length?arr.reduce((t,e)=>t+e.weight,0)/arr.length:null;
  const recent=avg(within(0,7)),prior=avg(within(7,14));
  if(recent==null)return{rate:null,cur:bwl[0].weight};
  if(prior==null)return{rate:null,cur:recent};
  return{rate:recent-prior,cur:recent};
}
// Goal-specific priority cards for the home intelligence feed.
function goalFeedItems(){
  const items=[];const g=S.goal||'general';const td=today();
  if(g==='weightloss'||g==='recomp'){
    const hasIntake=(getDayTotals(td).cals||0)>0;

        title:`${def?'Deficit':'Surplus'} so far today: ${eb.net<0?'−':'+'}${Math.abs(Math.round(eb.net)).toLocaleString()} kcal`,
        sub:`${eb.intake.toLocaleString()} in · ${eb.burn.toLocaleString()} burned by now${eb.exercise?` (incl. ${eb.exercise} from training)`:''}. Full-day baseline: ${eb.fullBase.toLocaleString()}.`});
    }
    const bw=bwRateInfo();
    if(bw&&bw.rate!=null){
      const losing=bw.rate<0;
      items.push({icon:'⚖️',color:losing?'var(--green)':'var(--blue)',bg:losing?'var(--grdim)':'var(--bdim)',border:losing?'rgba(45,122,82,.2)':'rgba(36,104,184,.2)',
        title:`${bw.cur.toFixed(1)} ${S.unit} · ${bw.rate<0?'−':'+'}${Math.abs(bw.rate).toFixed(1)} ${S.unit}/wk`,

  if(g==='weightloss'){

  }
  if(g==='recomp'){

    if(tot.protein||tot.cals){const ok=goalP&&tot.protein>=goalP*0.8;

        title:`Protein ${tot.protein||0}g${goalP?` / ${goalP}g`:''}`,sub:ok?'On track to protect muscle while leaning out.':'Hit protein to hold muscle in a recomp.'});}
  }
  return items;
}
// Goal-aware weekly stat strip (4 tiles).
function homeStrip(wkWks,wkSets,wkVol,wkCals){
  const td=today();const g=S.goal||'general';
  const fmtK=v=>v>=1000?(v/1000).toFixed(1)+'k':(Math.round(v)||0);
  const sessions={val:wkWks.length,lbl:'Sessions'};
  const curW=(S.bodyweightLog&&S.bodyweightLog[0]&&S.bodyweightLog[0].weight)||S.bodyweight||0;
  if(g==='weightloss'){
    const eb=energyBalance(td);const steps=S.stepsLog[td]||0;
    return[sessions,
      {val:steps?fmtK(steps):'0',lbl:'Steps'},
      {val:(eb.net<0?'−':'+')+fmtK(Math.abs(eb.net)),lbl:'Net so far',col:eb.net<0?'var(--green)':'var(--red)'},
      {val:curW||'–',lbl:`Weight`}];
  }
  if(g==='recomp'){
    const tot=getDayTotals(td);
    return[sessions,{val:fmtK(wkVol),lbl:'Volume'},{val:(tot.protein||0)+'g',lbl:'Protein'},{val:curW||'–',lbl:'Weight'}];
  }
  return[sessions,{val:wkSets,lbl:'Sets'},{val:fmtK(wkVol),lbl:'Volume'},{val:fmtK(wkCals),lbl:'~kcal'}];
}
// Actionable warnings shown across all goals: macro tracking + supplements not yet taken.
function homeWarnings(){
  const w=[];const td=today();const tot=getDayTotals(td);

// Genuine wins to keep the home screen encouraging (only real successes, goal-prioritized).

  if(S.supps&&S.supps.length){const logs=S.suppLogs[td]||{};if(S.supps.filter(s=>logs[s.id]).length===S.supps.length)out.push({icon:'✅',...grn,title:'All supplements taken today',sub:'Stack complete — nice consistency.'});}

// One renderer for the home intelligence feed, used with or without a routine today.
function homeFeedHTML(exIds){

function renderWorkout(c){
  if(S.activeCardDeck){renderCardDeckSession(c);return;}
  if(S.activeSprintTimer){renderSprintSession(c);return;}
  if(S.activeWorkout){renderSession(c);return;}
  const td=today();window._renderedDay=td;const name=esc(S.name||'Athlete');
  const ago7=Date.now()-7*86400000;
  const wkWks=S.workouts.filter(w=>w.started>=ago7);
  const wkSets=wkWks.reduce((t,wk)=>t+doneSetCnt(wk),0);
  const wkVol=wkWks.reduce((t,wk)=>t+totalVol(wk),0);
  const wkCals=wkWks.reduce((t,wk)=>t+(wk.cals||0),0)+S.activities.filter(a=>dayDate(a.date).getTime()>ago7).reduce((t,a)=>t+(a.cals||0),0);
  const ag=getActiveGroup();
  const todayR=getNextRoutine();

    todayRoutines.forEach(r=>{
      const lastSess=S.workouts.find(w=>w.routineId===r.id);
      const exNames=r.exercises.slice(0,4).map(e=>esc(getEx(e.exId)?.name||'')).filter(Boolean);

      html+=`<div class="routine-today"${todayRoutines.length>1?' style="margin-bottom:10px"':''}>

        <div style="font-size:11px;opacity:.7;margin-bottom:14px">${r.exercises.length} exercises${lastSess?` · Last done ${fmtShort(lastSess.started)}`:''}${exNames.length?` · ${exNames.slice(0,3).join(', ')}${r.exercises.length>3?'…':''}`:''}</div>
        ${doneToday
          ?`<div style="background:rgba(45,122,82,.25);border:1px solid rgba(45,122,82,.4);border-radius:10px;padding:11px;text-align:center;font-size:14px;font-weight:600;color:#fff">✓ Completed today</div>`

    // Intelligence feed (encouraging wins + warnings + goal context)
    const exIds=todayR.exercises.map(e=>e.exId);

  }else{
    // No routine today — same unified feed (encouraging wins + warnings + goal context)

  // Action buttons

      html+=`<div class="hi"><div style="flex:1">

      </div><button class="btn btp bsm" style="flex-shrink:0" onclick="startWorkout(${jsq(r.id)})">▶</button></div>`;
    });
    html+=`</div>`;
  }

  c.innerHTML=html;
}

function selActType(tid){
  window._actType=tid;
  document.querySelectorAll('[id^="atype-"]').forEach(b=>b.className=`btn ${b.id===`atype-${tid}`?'btp':'bts'}`);
  const t=ACT_TYPES.find(a=>a.id===tid);const el=document.getElementById('act-fields');if(!el||!t)return;
  let html='';
  if(t.fields.includes('dist'))html+=`<div class="fg"><label class="fl">Distance (miles)</label><input type="number" inputmode="decimal" id="act-dist" placeholder="0" oninput="updActCal()"></div>`;
  if(t.fields.includes('dur'))html+=`<div class="fg"><label class="fl">Duration (min)</label><input type="number" inputmode="numeric" id="act-dur" placeholder="0" oninput="updActCal()"></div>`;
  if(t.fields.includes('ruckWeight'))html+=`<div class="fg"><label class="fl">Ruck Weight (${S.unit})</label><input type="number" inputmode="decimal" id="act-rw" placeholder="0" oninput="updActCal()"></div>`;
  if(t.fields.includes('terrain'))html+=`<div class="fg"><label class="fl">Terrain</label><select id="act-terrain" onchange="updActCal()"><option value="flat">Flat</option><option value="hilly">Hilly (×1.3)</option><option value="trail">Trail (×1.2)</option><option value="mixed">Mixed (×1.15)</option></select></div>`;
  if(t.fields.includes('dist')&&t.fields.includes('dur')&&tid!=='ruck')html+=`<div style="font-size:11px;color:var(--muted);margin:-4px 0 12px;line-height:1.45">Enter distance, time, or both — I'll estimate the rest and the calories.</div>`;
  el.innerHTML=html;
}
function updActCal(){
  const type=window._actType;
  const act={type,dist:document.getElementById('act-dist')?.value,dur:document.getElementById('act-dur')?.value,ruckWeight:document.getElementById('act-rw')?.value,terrain:document.getElementById('act-terrain')?.value};
  const cals=activityCals(act);const el=document.getElementById('act-cal-prev');if(!el)return;
  const t=ACT_TYPES.find(a=>a.id===type)||{};
  const distCapable=(t.fields||[]).includes('dist');
  const d=parseFloat(act.dist)||0,m=parseFloat(act.dur)||0;
  let parts=[];
  if(distCapable&&!d&&m)parts.push(`~${estDistanceMi(type,m)} mi est`);
  if(distCapable&&d&&!m)parts.push(`~${estDurationMin(type,d)} min est`);
  if(d||m)parts.push(`~${cals} kcal`);
  el.textContent=parts.join(' · ');
}
function saveActivity(){
  const date=document.getElementById('act-date')?.value||today();
  const t=ACT_TYPES.find(a=>a.id===window._actType);
  const act={id:uid(),type:window._actType,date,dist:document.getElementById('act-dist')?.value||'',dur:document.getElementById('act-dur')?.value||'',ruckWeight:document.getElementById('act-rw')?.value||'',terrain:document.getElementById('act-terrain')?.value||'flat',notes:document.getElementById('act-notes')?.value||''};
  const distCapable=(t?.fields||[]).includes('dist');
  const d=parseFloat(act.dist)||0,m=parseFloat(act.dur)||0;
  if(distCapable&&!d&&!m){toast('Enter distance, time, or both');return;}
  if(!distCapable&&!m){toast('Enter a duration');return;}
  act.cals=activityCals(act);
  // Backfill whichever field was left blank with an estimate, so history/totals stay complete.
  if(distCapable&&!d&&m){act.dist=String(estDistanceMi(act.type,m));act.distEst=true;}
  if(distCapable&&d&&!m){act.dur=String(estDurationMin(act.type,d));act.durEst=true;}
  S.activities.unshift(act);save();
  closeOv('act-ov');toast('Activity logged!','green');render();
}

// ═══════════════════════════════════════════════════
// SESSION — the live workout screen
// ═══════════════════════════════════════════════════
function getLastRSess(rid){return S.workouts.find(w=>w.routineId===rid);}
// The sets you actually completed last time for this exercise: first from the same routine,
// otherwise from the most recent workout that included it. Card-deck sessions don't count.
function lastSetsFor(exId,rid){
  const pick=wk=>{
    for(const ex of wk.exercises){if(ex.exId===exId){const done=ex.sets.filter(s=>s.done);if(done.length)return done;}}
    return null;
  };
  if(rid){const sess=getLastRSess(rid);if(sess){const d=pick(sess);if(d)return d;}}
  for(const wk of S.workouts){if(wk.type==='cardDeck')continue;const d=pick(wk);if(d)return d;}
  return null;
}
// Prefill source for a new session. Warmups come back flagged as warmups (they used to come
// back as working sets, which inflated volume and made "+ Set" flatten everything).
function getAutoFill(exId,rid){
  const d=lastSetsFor(exId,rid);
  return d?d.map(s=>({w:s.w,r:s.r,warmup:!!s.warmup})):null;
}
function getLastStr(exId,rid){
  const d=lastSetsFor(exId,rid);if(!d)return null;
  const work=d.filter(s=>!s.warmup);if(!work.length)return null;
  const timed=!!(getSessionEx(exId)||{}).timed;
  const top=work.reduce((a,s)=>(parseFloat(s.w)||0)>(parseFloat(a.w)||0)?s:a,work[0]);
  const w=parseFloat(top.w)||0;
  const what=timed?`${top.r||'?'}s`:w?`${top.w}${S.unit}×${top.r||'?'}`:`${top.r||'?'} reps`;
  return`Last: ${what} · ${work.length} set${work.length===1?'':'s'}`;
}
function getSessionEx(exId){const wk=S.activeWorkout;return wk?wk.exercises.find(e=>e.exId===exId):null;}

// ─── Proportional autofill + warmups ───
const WARMUP_RAMP={1:[0.6],2:[0.5,0.7],3:[0.4,0.6,0.8]};
function loadInc(eq,weight){
  if(isKg()){
    if(eq==='Dumbbell'||eq==='Machine'||eq==='Cable')return weight>=45?2.5:1;
    return 2.5;
  }
  if(eq==='Dumbbell'||eq==='Machine'||eq==='Cable')return weight>=100?5:2.5;
  return 5; // Barbell, Kettlebell, Medicine Ball, Other, added-load Bodyweight
}
function roundTo(raw,inc){return Math.round(raw/inc)*inc;}
function jumpFor(weight,eq){const inc=loadInc(eq,weight);return Math.max(inc,roundTo(weight*0.025,inc));}
function warmupPcts(n){return WARMUP_RAMP[n]||Array.from({length:n},(_,i)=>0.4+(0.45*i/(n-1||1)));}
// Weight the next auto set should get, given the previous working set.
function nextAutoWeight(w0,base,mode,eq){
  if(mode==='ascend'){const a=base+jumpFor(base,eq);return roundTo(a,loadInc(eq,a));}
  if(mode==='descend'){const a=base-jumpFor(base,eq);return Math.max(loadInc(eq,base),roundTo(a,loadInc(eq,a)));}
  return w0; // straight sets repeat the first working set exactly
}
function warmupWeight(w0,pct,eq){const raw=w0*pct,inc=loadInc(eq,raw);return Math.max(inc,roundTo(raw,inc));}
// Any set whose weight differs from what the auto rules would produce was chosen by the lifter
// (a ramp, a back-off set, a custom warmup). Mark it manual so recalcExercise() leaves it alone.
function markManualSets(ex){
  const eq=getEx(ex.exId)?.eq||'Other';const mode=ex.progression||'flat';
  const working=ex.sets.filter(s=>!s.warmup);
  const w0=working.length?parseFloat(working[0].w):NaN;
  if(isNaN(w0))return;
  let base=w0;
  for(let k=1;k<working.length;k++){
    const s=working[k];const v=parseFloat(s.w);
    if(!isNaN(v)){if(v!==nextAutoWeight(w0,base,mode,eq))s._manual=true;base=v;}
  }
  const warm=ex.sets.filter(s=>s.warmup);const pcts=warmupPcts(warm.length);
  warm.forEach((s,i)=>{const v=parseFloat(s.w);if(!isNaN(v)&&v!==warmupWeight(w0,pcts[i],eq))s._manual=true;});
}
// Build one exercise for a live session. `re` is the routine entry (null for an ad-hoc add).
function sessionExercise(exId,rid,re){
  const prog=(re&&(re.type||re.progression))||'flat';
  const timed=!!(re&&re.timed);
  const fill=getAutoFill(exId,rid);
  const warm=fill?fill.filter(f=>f.warmup):[];
  const work=fill?fill.filter(f=>!f.warmup):[];
  const nTarget=re&&parseInt(re.sets)>0?parseInt(re.sets):0;
  // The routine decides how many working sets; last session decides the load.
  const n=nTarget||work.length||3;
  const fixedReps=re&&re.r&&!re.rMax&&!re.amrap?String(re.r):'';
  const blank=()=>({w:'',r:'',done:false,tag:'',warmup:false,_manual:false});
  const sets=[];
  for(let k=0;k<n;k++){
    const src=work[k]||work[work.length-1]||null;
    const s=blank();
    s.w=src&&src.w!=null?String(src.w):String((re&&re.w)||'');
    if(re&&re.amrap&&!re.r)s.r='';
    else s.r=fixedReps||(src&&src.r!=null&&src.r!==''?String(src.r):String((re&&re.r)||''));
    sets.push(s);
  }
  const wsets=warm.map(f=>{const s=blank();s.warmup=true;s.w=f.w!=null?String(f.w):'';s.r=f.r!=null?String(f.r):'';return s;});
  const ex={exId,sets:[...wsets,...sets],_af:!!fill,progression:prog,
    rest:re&&re.rest!=null?re.rest:null,link:(re&&re.link)||null,timed,
    target:re?{sets:nTarget,r:re.r||'',rMax:re.rMax||'',amrap:!!re.amrap,timed}:null,
    note:(re&&re.note)||''};
  markManualSets(ex);
  return ex;
}
function startWorkout(rid){
  const r=rid?S.routines.find(x=>x.id===rid):null;
  S.activeWorkout={id:uid(),routineId:r?r.id:null,
    name:r?(r.name||'Workout'):`Workout — ${new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}`,
    started:Date.now(),exercises:[],notes:'',_origExIds:null,_origProgression:{}};
  if(r){
    S.activeWorkout._origExIds=r.exercises.map(e=>e.exId);
    r.exercises.forEach(re=>{
      if(!getEx(re.exId))return; // exercise was deleted from the library
      const ex=sessionExercise(re.exId,r.id,re);

}

}
function renderSession(c){
  const wk=S.activeWorkout;if(!wk){render();return;}
  const el=Math.floor((Date.now()-wk.started)/1000);
  const doneSets=doneSetCnt(wk);const vol=Math.round(totalVol(wk));
  const painWs=getPainWarnings().filter(p=>wk.exercises.some(e=>e.exId===p.exId));
  let html=`<div class="fbar">

  </div>
  <div style="display:flex;border-bottom:1px solid var(--border)">
    <div style="flex:1;padding:7px 10px;text-align:center;background:var(--card)"><div class="mono" id="ss-sets" style="font-size:14px;font-weight:500">${doneSets}</div><div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Sets</div></div>
    <div style="width:1px;background:var(--border)"></div>
    <div style="flex:1;padding:7px 10px;text-align:center;background:var(--card)"><div class="mono" id="ss-vol" style="font-size:14px;font-weight:500">${vol.toLocaleString()}</div><div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">${S.unit}</div></div>
    <div style="width:1px;background:var(--border)"></div>

  if(!wk.exercises.length)html+=`<div class="empty" style="padding:44px 20px"><div style="margin-bottom:12px;color:var(--muted2)">${ICON('dumbbell',34)}</div><div class="etit">No exercises yet</div><p style="font-size:12px">Tap below to add your first</p></div>`;
  const _ssG=ssGroups(wk.exercises);

// Recompute every auto (non-manual, non-completed) set for one exercise.
// Working sets follow the first working set; warmups ramp off it.
function recalcExercise(ei){
  const wk=S.activeWorkout;if(!wk)return;
  const ex=wk.exercises[ei];if(!ex)return;
  const eq=getEx(ex.exId)?.eq||'Other';
  const working=ex.sets.filter(s=>!s.warmup);
  const w0=working.length?parseFloat(working[0].w):NaN;
  const mode=ex.progression||'flat';
  if(!isNaN(w0)){
    let base=w0;
    for(let k=1;k<working.length;k++){
      const s=working[k];
      if(!s.done&&!s._manual)s.w=String(nextAutoWeight(w0,base,mode,eq));
      const sv=parseFloat(s.w);if(!isNaN(sv))base=sv;
    }
    const warm=ex.sets.filter(s=>s.warmup);
    const pcts=warmupPcts(warm.length);
    warm.forEach((s,i)=>{if(!s.done&&!s._manual)s.w=String(warmupWeight(w0,pcts[i],eq));});
  }
  save();
}
function setInputs(ei,si){
  const q=n=>document.querySelector(`#sr-${ei}-${si} input:nth-of-type(${n})`);
  return{w:q(1),r:q(2)};
}
function syncExInputs(ei){
  const ex=S.activeWorkout?.exercises[ei];if(!ex)return;
  ex.sets.forEach((s,si)=>{
    const wi=setInputs(ei,si).w;
    if(wi&&document.activeElement!==wi)wi.value=s.w||'';
  });
}
function upd(ei,si,f,v){
  const ex=S.activeWorkout?.exercises[ei];const s=ex&&ex.sets[si];if(!s)return;
  s[f]=v;
  if(f==='w'){s._manual=(v!==''&&v!=null);recalcExercise(ei);syncExInputs(ei);}
  else save();
}
function refreshSessionStats(){
  const wk=S.activeWorkout;if(!wk)return;
  const a=document.getElementById('ss-sets');if(a)a.textContent=doneSetCnt(wk);
  const b=document.getElementById('ss-vol');if(b)b.textContent=Math.round(totalVol(wk)).toLocaleString();
}
function togSet(ei,si){
  const wk=S.activeWorkout;if(!wk)return;
  const ex=wk.exercises[ei];const s=ex&&ex.sets[si];if(!s)return;
  const inp=setInputs(ei,si);
  if(inp.w)s.w=inp.w.value;if(inp.r)s.r=inp.r.value;
  const prior=priorBest(ex.exId);
  const livePrev=(S.prs[ex.exId]&&S.prs[ex.exId].live)?S.prs[ex.exId].est:0;
  s.done=!s.done;
  if(s.done)s.t=Date.now();else delete s.t;
  rebuildPRs();
  if(s.done){
    const c=prCandidate(ex,s);
    if(c&&c.est>(prior?prior.est:0)&&c.est>livePrev)toast(`🏆 PR — ${exName(ex.exId)}: ${c.w}${S.unit}×${c.r}`,'gold');
    if(isLastInSuperset(ei))startRest(exRestFor(ex.exId));
  }
  save();
  // Redraw just this exercise's rows: the PR badge can move between sets.
  let wsn=0;
  ex.sets.forEach((x,xi)=>{
    if(!x.warmup)wsn++;
    const row=document.getElementById(`sr-${ei}-${xi}`);if(!row)return;
    const tmp=document.createElement('div');tmp.innerHTML=setRowHTML(ex,ei,x,xi,wsn);
    const fresh=tmp.firstElementChild;
    if(fresh&&document.activeElement&&row.contains(document.activeElement)&&xi!==si)return; // don't yank focus from another row
    if(fresh)row.replaceWith(fresh);
  });
  refreshSessionStats();
}
function toggleTagRow(ei,si){const s=S.activeWorkout?.exercises[ei]?.sets[si];if(!s)return;s._showTag=!s._showTag;renderSession(document.getElementById('content'));}
function setTag(ei,si,tag){const s=S.activeWorkout?.exercises[ei]?.sets[si];if(!s)return;s.tag=tag;s._showTag=false;save();renderSession(document.getElementById('content'));}
function addSet(ei){
  const ex=S.activeWorkout?.exercises[ei];if(!ex)return;
  const working=ex.sets.filter(s=>!s.warmup);
  const last=working[working.length-1];
  const ns={w:'',r:last?.r||'',done:false,tag:'',warmup:false,_manual:false};
  ex.sets.push(ns);
  recalcExercise(ei);
  // Straight sets: "one more" means one more at the weight you just used, not back at set 1.
  if((ex.progression||'flat')==='flat'&&last&&last.w!==''&&last.w!=null&&String(last.w)!==ns.w){ns.w=String(last.w);ns._manual=true;save();}
  renderSession(document.getElementById('content'));
  setTimeout(()=>{const rows=document.querySelectorAll(`#exb-${ei} .srow`);rows[rows.length-1]?.scrollIntoView({behavior:'smooth',block:'nearest'});},60);
}
function addWarmup(ei){
  const ex=S.activeWorkout?.exercises[ei];if(!ex)return;
  let idx=0;while(idx<ex.sets.length&&ex.sets[idx].warmup)idx++;
  ex.sets.splice(idx,0,{w:'',r:'',done:false,tag:'',warmup:true,_manual:false});
  recalcExercise(ei);renderSession(document.getElementById('content'));
}
// Removing things mid-workout is one sweaty mis-tap away, so both removals can be undone.
function rmLastSet(ei){
  const ex=S.activeWorkout?.exercises[ei];if(!ex||ex.sets.length<=1)return;
  const removed=ex.sets.pop();
  rebuildPRs();save();renderSession(document.getElementById('content'));
  if(removed.done)toast('Completed set removed','gold',{action:'Undo',onAction:()=>{
    const cur=S.activeWorkout?.exercises[ei];if(!cur||cur.exId!==ex.exId)return;
    cur.sets.push(removed);rebuildPRs();save();renderSession(document.getElementById('content'));
  }});
}
function removeEx(ei){
  const wk=S.activeWorkout;if(!wk||!wk.exercises[ei])return;
  const [removed]=wk.exercises.splice(ei,1);
  cleanSessionLinks();rebuildPRs();save();renderSession(document.getElementById('content'));
  toast(`${exName(removed.exId)} removed`,'gold',{action:'Undo',onAction:()=>{
    if(S.activeWorkout!==wk)return;
    wk.exercises.splice(Math.min(ei,wk.exercises.length),0,removed);
    rebuildPRs();save();renderSession(document.getElementById('content'));
  }});
}
function moveExInSession(ei,dir){
  if(!S.activeWorkout)return;
  const arr=S.activeWorkout.exercises;const j=ei+dir;
  if(j<0||j>=arr.length)return;
  [arr[ei],arr[j]]=[arr[j],arr[ei]];
  cleanSessionLinks();save();renderSession(document.getElementById('content'));
  setTimeout(()=>{document.getElementById(`exb-${j}`)?.scrollIntoView({behavior:'smooth',block:'nearest'});},60);
}
function cleanSessionLinks(){
  if(!S.activeWorkout)return;
  const arr=S.activeWorkout.exercises;
  arr.forEach((ex,i)=>{
    if(!ex.link)return;
    const prev=i>0&&arr[i-1].link===ex.link;
    const next=i<arr.length-1&&arr[i+1].link===ex.link;
    if(!prev&&!next)ex.link=null;

}

function calcPltDisp(){
  const tgt=parseFloat(document.getElementById('plt-tgt')?.value);
  const bar=parseFloat(document.getElementById('plt-bar')?.value)||(isKg()?20:45);
  const el=document.getElementById('plt-result');if(!el)return;
  if(!tgt){el.innerHTML='';return;}
  const side=(tgt-bar)/2;
  if(side<0){el.innerHTML=`<div style="color:var(--red);font-size:13px;text-align:center;padding:12px">Below bar weight (${bar}${S.unit})</div>`;return;}
  const sets=isKg()?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5,1.25];
  let rem=side;const plates=[];
  for(const p of sets){const n=Math.floor(rem/p+0.001);if(n>0){plates.push({w:p,n});rem-=p*n;}}
  const all=plates.flatMap(p=>Array(p.n).fill(p.w));
  const big=isKg()?[25,20,15,10,5]:[45,35,25,10,5];
  const cls=w=>w>=big[0]?'p45':w>=big[1]?'p35':w>=big[2]?'p25':w>=big[3]?'p10':w>=big[4]?'p5':'p2';
  el.innerHTML=`<div style="text-align:center;font-size:10px;color:var(--muted);margin-bottom:8px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">Each side · bar ${bar}${S.unit}</div>
    <div class="plate-visual">${all.length?all.map(w=>`<div class="plate ${cls(w)}">${w}</div>`).join(''):'<div style="color:var(--muted);font-size:12px">Just the bar</div>'}</div>
    ${rem>0.01?`<div style="text-align:center;font-size:11px;color:var(--gold);font-weight:600">~${rem.toFixed(2)}${S.unit} remainder</div>`:''}`;
}

// ─── Finish workout ───
// Wall-clock vs time actually spent training; the gap is idle time after the last set.
function sessionTiming(wk,now){
  now=now||Date.now();
  const wall=now-wk.started;
  const active=workoutActiveMs(Object.assign({},wk,{ended:now}));
  return{wall,active,trimmed:wall-active>10*60000};
}
function showFinish(){
  const wk=S.activeWorkout;if(!wk)return;
  const tm=sessionTiming(wk);const dur=tm.trimmed?tm.active:tm.wall;const cals=sessionCals(tm.active);

// Exercises whose all-time best now sits in this workout.
function getPRsFromSess(wk){
  rebuildPRs();
  const names=[];
  wk.exercises.forEach(ex=>{const pr=S.prs[ex.exId];if(pr&&pr.wkId===wk.id){const n=exName(ex.exId);if(!names.includes(n))names.push(n);}});
  return names;
}
function getRoutineDiff(wk){
  if(!wk.routineId||!wk._origExIds)return null;
  const orig=wk._origExIds;const now=wk.exercises.map(e=>e.exId);
  const added=now.filter(id=>!orig.includes(id)).map(exName);
  const changed=[];const ls=getLastRSess(wk.routineId);
  const firstDone=ex=>parseFloat(ex.sets.find(s=>s.done&&!s.warmup)?.w||0);
  if(ls){wk.exercises.filter(ex=>orig.includes(ex.exId)).forEach(ex=>{const prev=ls.exercises.find(e=>e.exId===ex.exId);if(!prev)return;const cW=firstDone(ex);const pW=firstDone(prev);if(pW&&cW&&Math.abs(cW-pW)/pW>0.03)changed.push(`${exName(ex.exId)} (${pW}→${cW}${S.unit})`);});}
  if(!added.length&&!changed.length)return null;return{added,changed};
}
// Copies this session's loads and set counts back to the routine. Rep targets (ranges, AMRAP,
// timed) are the plan, so they are left alone unless the routine had none.
function saveRoutineChanges(rid){
  const wk=S.activeWorkout;const r=S.routines.find(x=>x.id===rid);if(!r||!wk)return;
  wk.exercises.forEach(ex=>{
    const work=ex.sets.filter(s=>!s.warmup);if(!work.length)return;
    const best=work.filter(s=>s.done).sort((a,b)=>parseFloat(b.w||0)-parseFloat(a.w||0))[0];
    let rEx=r.exercises.find(e=>e.exId===ex.exId);
    if(!rEx){
      const bs=best||work[0];
      r.exercises.push({exId:ex.exId,sets:work.length,w:bs.w||'',r:bs.r||'',type:ex.progression||'flat',rest:ex.rest!=null?ex.rest:null,link:ex.link||null});
      return;
    }
    if(best){rEx.w=best.w;if(!rEx.r&&!rEx.rMax&&!rEx.amrap&&!rEx.timed)rEx.r=best.r;}
    rEx.sets=work.length;
  });
  wk._origExIds=r.exercises.map(e=>e.exId);
  save();toast('Routine updated!','green');
}
function saveWorkout(){
  const wk=S.activeWorkout;if(!wk)return;
  const n=document.getElementById('wkn');const nt=document.getElementById('wknt');
  if(n)wk.name=n.value.trim()||wk.name;if(nt)wk.notes=nt.value;
  const now=Date.now();const tm=sessionTiming(wk,now);
  wk.ended=tm.trimmed?wk.started+tm.active:now;
  wk.cals=sessionCals(tm.active);
  // Session-only bookkeeping has no business in history.
  delete wk._origExIds;delete wk._origProgression;
  wk.exercises.forEach(ex=>{delete ex._af;ex.sets.forEach(s=>{delete s._showTag;delete s._manual;});});
  S.workouts.unshift(wk);S.activeWorkout=null;
  const _ag=getActiveGroup();
  if(_ag&&_ag.mode==='rotation'&&(_ag.routineIds||[]).length){
    const curId=_ag.routineIds[(_ag.cursor||0)%_ag.routineIds.length];
    if(wk.routineId===curId)_ag.cursor=((_ag.cursor||0)+1)%_ag.routineIds.length;
  }
  endSessionTimers();rebuildPRs();saveNow();
  document.getElementById('fin-ov')?.remove();toast('Workout saved!','green');render();
}

function renderHistory(c){

function renderHistList(){
  const items=[];

    else{const a=item.data;const t=ACT_TYPES.find(x=>x.id===a.type)||{icon:'⚡',label:'Activity'};html+=`<div class="hi" onclick="showActivityDetail(${jsq(a.id)})"><div class="act-icon">${ICON(t.icon,18)}</div><div style="flex:1"><div class="hn">${t.label}${a.dist?` · ${esc(a.dist)}mi`:''}</div><div class="hm">${fmtDate(a.date+'T12:00:00')} · ${a.dur?esc(a.dur)+'min':''}${a.cals?` · ~${a.cals} kcal`:''}</div></div></div>`;}
  });
  html+=`</div>`;return html;
}
function wkDetailExHTML(wk){
  const groups=ssGroups(wk.exercises);const ssM={};groups.forEach(g=>{for(let k=g.start;k<=g.end;k++)ssM[k]=g;});
  let html='';
  wk.exercises.forEach((ex,exi)=>{
    const done=ex.sets.map((s,si)=>({s,si})).filter(x=>x.s.done);
    const work=done.filter(x=>!x.s.warmup).length;
    const inSS=ssM[exi];const isStart=inSS&&inSS.start===exi;const isEnd=inSS&&inSS.end===exi;
    if(isStart){const cnt=inSS.end-inSS.start+1;html+=`<div style="border-left:3px solid var(--navy);padding-left:8px;margin:4px 0"><div style="font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);margin-bottom:2px">${ssLabel(cnt)}</div>`;}
    html+=`<div class="wsr"><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">${esc(exName(ex.exId))}</div>
      <div class="set-chips">${done.map(({s,si})=>{
        const label=ex.timed?`${esc(s.r||0)}s`:`${s.w?esc(s.w)+'×':''}${esc(s.r||0)}`;
        const cls='set-chip'+(s.warmup?' warm':'')+(s.excl?' excl':'');
        const tap=s.warmup||ex.timed?'':` onclick="toggleSetExcluded(${jsq(wk.id)},${exi},${si})"`;
        return`<span class="${cls}"${tap}>${s.warmup?'W ':''}${label}${s.tag?` · ${esc(s.tag)}`:''}</span>`;
      }).join('')||'<span style="font-size:10px;color:var(--muted2)">no completed sets</span>'}</div>
    </div><div class="mono" style="font-size:11px;color:var(--muted);flex-shrink:0;margin-left:8px">${work} set${work===1?'':'s'}</div></div>`;
    if(isEnd)html+=`</div>`;
  });
  return html;
}

    <button class="btn btd bfw" onclick="confirmDeleteWk(${jsq(id)})">Delete Workout</button>

  document.body.appendChild(ov);attachSwipeDown(ov);
